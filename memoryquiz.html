<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Memory Quiz — ExamQuiz Haiti</title>

<style>
:root {
    --purple: #24113f;
    --purple2: #4b2481;
    --blue2: #2f80ed;
    --white: #ffffff;
    --bg: #f6f7fb;
    --text: #18181b;
    --muted: #6b7280;
    --green: #16803c;
    --red: #c62828;
    --border: #e5e7eb;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

/* =========================
   HEADER
========================= */

.header {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
}

.header-inner {
    width: 100%;
    max-width: 1050px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.logo {
    color: var(--purple);
    font-size: 20px;
    font-weight: 800;
}

.logo span {
    color: var(--blue2);
}

.back-btn {
    border: 1px solid var(--border);
    background: white;
    color: var(--purple);

    min-height: 42px;
    padding: 8px 13px;

    border-radius: 10px;

    cursor: pointer;
    font-weight: 700;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: min(100% - 24px, 1050px);
    margin: auto;
    padding: 20px 0 35px;
}

/* =========================
   HERO
========================= */

.hero {
    text-align: center;
    margin-bottom: 18px;
}

.hero h1 {
    color: var(--purple);
    font-size: clamp(28px, 8vw, 42px);
    line-height: 1.1;
    margin-bottom: 7px;
}

.hero p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;

    margin-bottom: 14px;
}

.stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;

    padding: 10px 5px;

    text-align: center;
    min-width: 0;
}

.stat-label {
    color: var(--muted);
    font-size: 10px;
    margin-bottom: 4px;
}

.stat-value {
    color: var(--purple);
    font-size: 18px;
    font-weight: 800;

    white-space: nowrap;
}

/* =========================
   GAME PANEL
========================= */

.game-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;

    padding: 12px;
}

/* =========================
   PROGRESS
========================= */

.progress-area {
    margin-bottom: 14px;
}

.progress-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 8px;

    color: var(--muted);
    font-size: 11px;

    margin-bottom: 6px;
}

.progress {
    width: 100%;
    height: 7px;

    background: #e9eaf0;

    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: var(--blue2);

    transition: width .3s ease;
}

/* =========================
   CARDS
========================= */

.cards {
    width: 100%;
    max-width: 720px;
    margin: auto;

    display: grid;

    /*
     * 3 colonnes sur téléphone.
     * 4 colonnes sur écrans plus larges.
     */
    grid-template-columns: repeat(4, minmax(0, 1fr));

    gap: 10px;
}

.card {
    position: relative;

    width: 100%;
    aspect-ratio: 1 / 1;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    perspective: 900px;
}

.card-inner {
    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    transition:
        transform .45s ease;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 8px;

    border-radius: 12px;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    overflow: hidden;
}

.card-front {
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--purple2)
        );

    border: 2px solid #5d3694;

    color: white;

    font-size: 26px;
    font-weight: 800;
}

.card-back {
    background: white;

    color: var(--purple);

    border: 2px solid #d8d3e2;

    transform: rotateY(180deg);

    font-size: clamp(10px, 1.5vw, 15px);

    line-height: 1.25;

    font-weight: 700;

    overflow-wrap: anywhere;
    word-break: normal;
}

.card.matched .card-back {
    border-color: #69b47e;
    background: #f1fbf4;
    color: var(--green);
}

.card:disabled {
    cursor: default;
}

/* =========================
   MESSAGE
========================= */

.message {
    text-align: center;

    min-height: 20px;

    margin-top: 12px;

    color: var(--muted);

    font-size: 13px;
    line-height: 1.4;
}

/* =========================
   CONTROL
========================= */

.controls {
    margin-top: 14px;
}

.restart-btn {
    width: 100%;

    border: 0;

    background: var(--purple);
    color: white;

    min-height: 46px;

    padding: 11px 16px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: 700;
}

.restart-btn:active {
    transform: scale(.98);
}

/* =========================
   ERROR
========================= */

.error-message {
    display: none;

    text-align: center;

    color: var(--red);

    padding: 25px 10px;

    font-weight: 600;

    font-size: 14px;
}

/* =========================
   OVERLAY
========================= */

.overlay {
    position: fixed;
    inset: 0;

    background: rgba(20, 12, 35, .74);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 16px;

    z-index: 100;
}

.overlay.show {
    display: flex;
}

.result-box {
    width: min(100%, 410px);

    background: white;

    border-radius: 18px;

    padding: 25px 18px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);
}

.result-box h2 {
    color: var(--purple);

    font-size: 27px;

    margin-bottom: 10px;
}

.result-box p {
    color: var(--muted);

    line-height: 1.5;

    margin-bottom: 16px;

    font-size: 14px;
}

.result-score {
    color: var(--blue2);

    font-size: 32px;

    font-weight: 800;

    margin-bottom: 14px;
}

.result-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

.result-buttons button {
    min-height: 46px;

    border: 0;

    padding: 10px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: 700;
}

.play-again {
    background: var(--purple);
    color: white;
}

.exit-game {
    background: #eeeef2;
    color: var(--purple);
}

/* =====================================================
   TABLET / PETITS ÉCRANS
===================================================== */

@media (max-width: 700px) {

    .container {
        width: calc(100% - 18px);
        padding-top: 16px;
    }

    .header {
        padding: 10px 11px;
    }

    .logo {
        font-size: 18px;
    }

    .back-btn {
        min-height: 40px;
        padding: 7px 11px;
        font-size: 13px;
    }

    .hero {
        margin-bottom: 14px;
    }

    .hero h1 {
        font-size: 29px;
    }

    .hero p {
        font-size: 12px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
    }

    .stat {
        padding: 9px;
    }

    .stat-label {
        font-size: 10px;
    }

    .stat-value {
        font-size: 18px;
    }

    .game-panel {
        padding: 10px;
        border-radius: 14px;
    }

    /*
     * 3 cartes par ligne sur téléphone.
     */
    .cards {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 8px;
    }

    .card-face {
        padding: 6px;
        border-radius: 10px;
    }

    .card-front {
        font-size: 23px;
    }

    .card-back {
        font-size: 10px;
        line-height: 1.2;
    }
}

/* =====================================================
   TRÈS PETITS TÉLÉPHONES
===================================================== */

@media (max-width: 380px) {

    .container {
        width: calc(100% - 12px);
    }

    .hero h1 {
        font-size: 26px;
    }

    .hero p {
        font-size: 11px;
    }

    .stats {
        gap: 5px;
    }

    .stat {
        padding: 8px 4px;
    }

    .stat-label {
        font-size: 9px;
    }

    .stat-value {
        font-size: 16px;
    }

    .game-panel {
        padding: 8px;
    }

    .cards {
        gap: 6px;
    }

    .card-face {
        padding: 5px;
        border-radius: 9px;
    }

    .card-front {
        font-size: 20px;
    }

    .card-back {
        font-size: 9px;
        line-height: 1.15;
    }

    .result-box {
        padding: 22px 14px;
    }

    .result-box h2 {
        font-size: 24px;
    }

    .result-score {
        font-size: 29px;
    }
}

/* =====================================================
   TÉLÉPHONES TRÈS ÉTROITS
===================================================== */

@media (max-width: 320px) {

    .cards {
        gap: 5px;
    }

    .card-front {
        font-size: 18px;
    }

    .card-back {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo">
            ExamQuiz <span>Haiti</span>
        </div>

        <button
            class="back-btn"
            id="backBtn"
            type="button">

            ← Retour

        </button>

    </div>

</header>


<main class="container">

    <section class="hero">

        <h1>Memory Quiz</h1>

        <p>
            Retourne les cartes et retrouve les bonnes paires.
        </p>

    </section>


    <section class="stats">

        <div class="stat">

            <div class="stat-label">
                Partie
            </div>

            <div
                class="stat-value"
                id="gameNumber">

                1

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Coups
            </div>

            <div
                class="stat-value"
                id="moves">

                0

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Paires
            </div>

            <div class="stat-value">

                <span id="pairs">
                    0
                </span>

                /

                <span id="totalPairs">
                    6
                </span>

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Temps
            </div>

            <div
                class="stat-value"
                id="time">

                00:00

            </div>

        </div>

    </section>


    <section class="game-panel">

        <div class="progress-area">

            <div class="progress-top">

                <span>
                    Questions utilisées
                </span>

                <span id="progressText">
                    0%
                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

        </div>


        <div
            class="cards"
            id="cards">
        </div>


        <div
            class="error-message"
            id="errorMessage">
        </div>


        <div
            class="message"
            id="message">

            Trouve toutes les paires.

        </div>


        <div class="controls">

            <button
                class="restart-btn"
                id="restartBtn"
                type="button">

                Recommencer

            </button>

        </div>

    </section>

</main>


<div
    class="overlay"
    id="winOverlay">

    <div class="result-box">

        <h2>
            Partie terminée
        </h2>


        <p id="resultMessage">
            Tu as retrouvé toutes les paires.
        </p>


        <div
            class="result-score"
            id="finalScore">

            0 points

        </div>


        <p id="finalStats"></p>


        <div class="result-buttons">

            <button
                class="play-again"
                id="playAgain"
                type="button">

                Partie suivante

            </button>


            <button
                class="exit-game"
                id="exitGame"
                type="button">

                Quitter

            </button>

        </div>

    </div>

</div>


<script type="module">

"use strict";


/*
 * CONNEXION AU FICHIER DES QUESTIONS
 */

import {
    jeuxQuestions
} from "./src/jeuxQuestions.js";


/*
 * ÉLÉMENTS HTML
 */

const cardsContainer =
    document.getElementById("cards");

const movesElement =
    document.getElementById("moves");

const pairsElement =
    document.getElementById("pairs");

const totalPairsElement =
    document.getElementById("totalPairs");

const timeElement =
    document.getElementById("time");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const messageElement =
    document.getElementById("message");

const errorMessage =
    document.getElementById("errorMessage");

const restartBtn =
    document.getElementById("restartBtn");

const backBtn =
    document.getElementById("backBtn");

const winOverlay =
    document.getElementById("winOverlay");

const finalScore =
    document.getElementById("finalScore");

const finalStats =
    document.getElementById("finalStats");

const resultMessage =
    document.getElementById("resultMessage");

const playAgain =
    document.getElementById("playAgain");

const exitGame =
    document.getElementById("exitGame");

const gameNumberElement =
    document.getElementById("gameNumber");


/*
 * CONFIGURATION
 */

const PAIRS_PER_GAME = 6;

const CARD_TYPES = {
    QUESTION: "question",
    ANSWER: "answer"
};


/*
 * ÉTAT DU JEU
 */

let cards = [];

let pairsData = [];

let usedQuestionIds = new Set();

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let moves = 0;

let matchedPairs = 0;

let seconds = 0;

let timer = null;

let gameStarted = false;

let gameNumber = 1;

let totalScore = 0;


/*
 * MÉLANGE
 */

function shuffle(array) {

    const copy = [...array];

    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];
    }

    return copy;
}


/*
 * QUESTIONS BIOLOGIE + GÉOLOGIE
 */

function getAvailableQuestions() {

    return jeuxQuestions.filter(question => {

        return (
            question.category === "Biologie" ||
            question.category === "Géologie"
        );

    });
}


/*
 * CHARGEMENT DES QUESTIONS
 */

function loadQuestions() {

    const allQuestions =
        getAvailableQuestions();


    if (allQuestions.length === 0) {

        showError(
            "Aucune question de Biologie ou de Géologie n'a été trouvée."
        );

        return false;
    }


    /*
     * Questions jamais utilisées.
     */

    let unused =
        allQuestions.filter(question => {

            return !usedQuestionIds.has(
                question.id
            );

        });


    /*
     * S'il reste moins de 6 questions,
     * on utilise les dernières questions
     * disponibles.
     */

    if (
        unused.length < PAIRS_PER_GAME
    ) {

        /*
         * Si toutes les questions ont déjà
         * été utilisées, nouveau cycle.
         */

        if (unused.length === 0) {

            usedQuestionIds.clear();

            unused =
                [...allQuestions];

        }

    }


    unused =
        shuffle(unused);


    pairsData =
        unused.slice(
            0,
            Math.min(
                PAIRS_PER_GAME,
                unused.length
            )
        );


    /*
     * Enregistrer les questions.
     */

    pairsData.forEach(question => {

        usedQuestionIds.add(
            question.id
        );

    });


    return pairsData.length > 0;
}


/*
 * CRÉER LES CARTES
 */

function createCards() {

    cards = [];


    pairsData.forEach(pair => {

        cards.push({

            id:
                `question-${pair.id}`,

            pairId:
                pair.id,

            type:
                CARD_TYPES.QUESTION,

            text:
                pair.question

        });


        cards.push({

            id:
                `answer-${pair.id}`,

            pairId:
                pair.id,

            type:
                CARD_TYPES.ANSWER,

            text:
                pair.answer

        });

    });


    cards =
        shuffle(cards);


    renderCards();
}


/*
 * AFFICHER LES CARTES
 */

function renderCards() {

    cardsContainer.innerHTML = "";

    errorMessage.style.display =
        "none";


    cards.forEach(
        (cardData, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className = "card";

            button.dataset.index =
                index;


            button.setAttribute(
                "aria-label",
                "Carte"
            );


            button.innerHTML = `

                <div class="card-inner">

                    <div class="card-face card-front">
                        ?
                    </div>

                    <div class="card-face card-back">
                        ${escapeHTML(cardData.text)}
                    </div>

                </div>

            `;


            button.addEventListener(
                "click",
                () => {

                    handleCardClick(
                        button,
                        index
                    );

                }
            );


            cardsContainer.appendChild(
                button
            );

        }
    );
}


/*
 * PROTECTION HTML
 */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


/*
 * CLIC SUR UNE CARTE
 */

function handleCardClick(
    element,
    index
) {

    if (

        lockBoard ||

        element.classList.contains(
            "flipped"
        ) ||

        element.classList.contains(
            "matched"
        )

    ) {

        return;
    }


    if (!gameStarted) {

        gameStarted = true;

        startTimer();
    }


    element.classList.add(
        "flipped"
    );


    if (!firstCard) {

        firstCard = {
            element,
            index
        };

        return;
    }


    secondCard = {
        element,
        index
    };


    moves++;

    updateStats();

    checkMatch();
}


/*
 * VÉRIFIER UNE PAIRE
 */

function checkMatch() {

    lockBoard = true;


    const first =
        cards[firstCard.index];

    const second =
        cards[secondCard.index];


    const isMatch =

        first.pairId ===
        second.pairId &&

        first.type !==
        second.type;


    if (isMatch) {

        firstCard.element
            .classList
            .add("matched");


        secondCard.element
            .classList
            .add("matched");


        matchedPairs++;


        messageElement.textContent =
            "Bonne paire.";


        updateStats();


        resetSelection();


        if (
            matchedPairs ===
            pairsData.length
        ) {

            setTimeout(
                endGame,
                500
            );

        }

    } else {

        messageElement.textContent =
            "Ce n'est pas une paire.";


        setTimeout(() => {

            if (firstCard) {

                firstCard.element
                    .classList
                    .remove(
                        "flipped"
                    );
            }


            if (secondCard) {

                secondCard.element
                    .classList
                    .remove(
                        "flipped"
                    );
            }


            resetSelection();

        }, 800);
    }
}


/*
 * RÉINITIALISER LA SÉLECTION
 */

function resetSelection() {

    firstCard = null;

    secondCard = null;

    lockBoard = false;
}


/*
 * CHRONOMÈTRE
 */

function startTimer() {

    if (timer) {
        return;
    }


    timer =
        setInterval(() => {

            seconds++;

            updateTime();

        }, 1000);
}


/*
 * ARRÊTER LE CHRONOMÈTRE
 */

function stopTimer() {

    if (timer) {

        clearInterval(timer);

        timer = null;
    }
}


/*
 * TEMPS
 */

function updateTime() {

    const minutes =
        Math.floor(
            seconds / 60
        );

    const remainingSeconds =
        seconds % 60;


    const mm =
        String(minutes)
            .padStart(2, "0");

    const ss =
        String(remainingSeconds)
            .padStart(2, "0");


    timeElement.textContent =
        `${mm}:${ss}`;
}


/*
 * STATISTIQUES
 */

function updateStats() {

    movesElement.textContent =
        moves;


    pairsElement.textContent =
        matchedPairs;


    totalPairsElement.textContent =
        pairsData.length;


    const allQuestions =
        getAvailableQuestions();


    const percentage =
        allQuestions.length > 0

            ? Math.min(
                100,
                Math.round(
                    (
                        usedQuestionIds.size /
                        allQuestions.length
                    ) * 100
                )
            )

            : 0;


    progressBar.style.width =
        `${percentage}%`;


    progressText.textContent =
        `${percentage}%`;


    gameNumberElement.textContent =
        gameNumber;
}


/*
 * SCORE
 */

function calculateScore() {

    const movePenalty =
        moves * 20;

    const timePenalty =
        seconds * 2;


    return Math.max(
        100,
        1000 -
        movePenalty -
        timePenalty
    );
}


/*
 * FIN DE LA PARTIE
 */

function endGame() {

    stopTimer();


    const score =
        calculateScore();


    totalScore += score;


    finalScore.textContent =
        `${score} points`;


    finalStats.textContent =
        `${moves} coups • ` +
        `${formatTime(seconds)} • ` +
        `${matchedPairs} paires`;


    const totalQuestions =
        getAvailableQuestions().length;


    if (
        usedQuestionIds.size >=
        totalQuestions
    ) {

        resultMessage.textContent =
            "Toutes les questions disponibles ont été utilisées.";

        playAgain.textContent =
            "Nouveau cycle";

    } else {

        resultMessage.textContent =
            "Une nouvelle série de questions est prête.";

        playAgain.textContent =
            "Partie suivante";
    }


    winOverlay.classList.add(
        "show"
    );
}


/*
 * FORMAT TEMPS
 */

function formatTime(totalSeconds) {

    const minutes =
        Math.floor(
            totalSeconds / 60
        );

    const secs =
        totalSeconds % 60;


    return (
        `${String(minutes).padStart(2, "0")}:` +
        `${String(secs).padStart(2, "0")}`
    );
}


/*
 * PARTIE SUIVANTE
 */

function startNewGame() {

    stopTimer();


    firstCard = null;

    secondCard = null;

    lockBoard = false;


    moves = 0;

    matchedPairs = 0;

    seconds = 0;

    gameStarted = false;


    gameNumber++;


    winOverlay.classList.remove(
        "show"
    );


    messageElement.textContent =
        "Trouve toutes les paires.";


    updateTime();


    if (loadQuestions()) {

        createCards();

        updateStats();

    }
}


/*
 * RECOMMENCER DEPUIS LE DÉBUT
 */

function resetEntireGame() {

    stopTimer();


    usedQuestionIds.clear();


    gameNumber = 1;

    totalScore = 0;


    firstCard = null;

    secondCard = null;

    lockBoard = false;


    moves = 0;

    matchedPairs = 0;

    seconds = 0;

    gameStarted = false;


    winOverlay.classList.remove(
        "show"
    );


    messageElement.textContent =
        "Nouvelle partie.";


    updateTime();


    if (loadQuestions()) {

        createCards();

        updateStats();

    }
}


/*
 * ERREUR
 */

function showError(message) {

    cardsContainer.innerHTML = "";

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";
}


/*
 * BOUTONS
 */

restartBtn.addEventListener(
    "click",
    resetEntireGame
);


playAgain.addEventListener(
    "click",
    startNewGame
);


backBtn.addEventListener(
    "click",
    () => {

        history.back();

    }
);


exitGame.addEventListener(
    "click",
    () => {

        history.back();

    }
);


/*
 * INITIALISATION
 */

if (
    !Array.isArray(jeuxQuestions) ||
    jeuxQuestions.length === 0
) {

    showError(
        "Impossible de charger les questions."
    );

} else {

    if (loadQuestions()) {

        createCards();

        updateStats();

        updateTime();

    }

}

</script>
