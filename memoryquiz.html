<script type="module">
"use strict";

import { jeuxQuestions } from "./src/jeuxQuestions.js";

const cardsContainer = document.getElementById("cards");
const movesElement = document.getElementById("moves");
const pairsElement = document.getElementById("pairs");
const totalPairsElement = document.getElementById("totalPairs");
const timeElement = document.getElementById("time");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const messageElement = document.getElementById("message");

const restartBtn = document.getElementById("restartBtn");
const backBtn = document.getElementById("backBtn");

const winOverlay = document.getElementById("winOverlay");
const finalScore = document.getElementById("finalScore");
const finalStats = document.getElementById("finalStats");

const playAgain = document.getElementById("playAgain");
const exitGame = document.getElementById("exitGame");

let cards = [];
let pairsData = [];

let firstCard = null;
let secondCard = null;

let lockBoard = false;
let moves = 0;
let matchedPairs = 0;

let seconds = 0;
let timer = null;
let gameStarted = false;

const CARD_TYPES = {
    QUESTION: "question",
    ANSWER: "answer"
};

/*
 * Nombre de paires affichées dans une partie.
 * Chaque partie prend 6 questions aléatoires.
 */
const PAIRS_PER_GAME = 6;


/*
 * Mélange un tableau.
 */
function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}


/*
 * Sélectionne les questions de Biologie et Géologie
 * dans jeuxQuestions.js.
 */
function loadQuestions() {

    const availableQuestions = jeuxQuestions.filter(question => {

        return (
            question.category === "Biologie" ||
            question.category === "Géologie"
        );

    });

    if (availableQuestions.length < PAIRS_PER_GAME) {

        messageElement.textContent =
            "Pas assez de questions disponibles.";

        return false;
    }

    /*
     * On mélange les questions puis on prend 6 questions.
     */
    pairsData = shuffle(availableQuestions)
        .slice(0, PAIRS_PER_GAME)
        .map(question => ({
            id: question.id,
            question: question.question,
            answer: question.answer,
            category: question.category
        }));

    return true;
}


/*
 * Création des 12 cartes.
 *
 * 6 cartes = questions
 * 6 cartes = réponses
 */
function createCards() {

    cards = [];

    pairsData.forEach((pair, index) => {

        cards.push({
            id: `q-${pair.id}`,
            pairId: pair.id,
            type: CARD_TYPES.QUESTION,
            text: pair.question
        });

        cards.push({
            id: `a-${pair.id}`,
            pairId: pair.id,
            type: CARD_TYPES.ANSWER,
            text: pair.answer
        });

    });

    cards = shuffle(cards);

    renderCards();
}


/*
 * Affiche les cartes.
 */
function renderCards() {

    cardsContainer.innerHTML = "";

    cards.forEach((cardData, index) => {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "card";

        button.dataset.index = index;

        button.innerHTML = `
            <div class="card-inner">

                <div class="card-face card-front">
                    ?
                </div>

                <div class="card-face card-back">
                    ${escapeHTML(cardData.text)}
                </div>

            </div>
        `;

        button.addEventListener("click", () => {

            handleCardClick(button, index);

        });

        cardsContainer.appendChild(button);
    });
}


/*
 * Protection contre l'injection HTML.
 */
function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = String(text);

    return div.innerHTML;
}


/*
 * Gestion du clic sur une carte.
 */
function handleCardClick(element, index) {

    if (
        lockBoard ||
        element.classList.contains("flipped") ||
        element.classList.contains("matched")
    ) {
        return;
    }

    if (!gameStarted) {

        startTimer();

        gameStarted = true;
    }

    element.classList.add("flipped");

    if (!firstCard) {

        firstCard = {
            element,
            index
        };

        return;
    }

    secondCard = {
        element,
        index
    };

    moves++;

    updateStats();

    checkMatch();
}


/*
 * Vérifie si les deux cartes correspondent.
 */
function checkMatch() {

    lockBoard = true;

    const first = cards[firstCard.index];
    const second = cards[secondCard.index];

    const isMatch =
        first.pairId === second.pairId &&
        first.type !== second.type;

    if (isMatch) {

        firstCard.element.classList.add("matched");
        secondCard.element.classList.add("matched");

        matchedPairs++;

        messageElement.textContent =
            "Bonne paire.";

        updateStats();

        resetSelection();

        if (matchedPairs === pairsData.length) {

            setTimeout(endGame, 550);
        }

    } else {

        messageElement.textContent =
            "Ce n'est pas une paire.";

        setTimeout(() => {

            if (firstCard) {
                firstCard.element.classList.remove("flipped");
            }

            if (secondCard) {
                secondCard.element.classList.remove("flipped");
            }

            resetSelection();

        }, 850);
    }
}


/*
 * Réinitialise la sélection des cartes.
 */
function resetSelection() {

    firstCard = null;
    secondCard = null;
    lockBoard = false;
}


/*
 * Démarre le chronomètre.
 */
function startTimer() {

    if (timer) {
        return;
    }

    timer = setInterval(() => {

        seconds++;

        updateTime();

    }, 1000);
}


/*
 * Arrête le chronomètre.
 */
function stopTimer() {

    if (timer) {

        clearInterval(timer);

        timer = null;
    }
}


/*
 * Affiche le temps.
 */
function updateTime() {

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;

    const mm = String(minutes).padStart(2, "0");
    const ss = String(remainingSeconds).padStart(2, "0");

    timeElement.textContent = `${mm}:${ss}`;
}


/*
 * Met à jour les statistiques.
 */
function updateStats() {

    movesElement.textContent = moves;

    pairsElement.textContent = matchedPairs;

    totalPairsElement.textContent = pairsData.length;

    const percentage = pairsData.length
        ? Math.round((matchedPairs / pairsData.length) * 100)
        : 0;

    progressBar.style.width = `${percentage}%`;

    progressText.textContent = `${percentage}%`;
}


/*
 * Calcul du score.
 */
function calculateScore() {

    const movePenalty = moves * 20;
    const timePenalty = seconds * 2;

    return Math.max(
        100,
        1000 - movePenalty - timePenalty
    );
}


/*
 * Fin de la partie.
 */
function endGame() {

    stopTimer();

    const score = calculateScore();

    finalScore.textContent =
        `${score} points`;

    finalStats.textContent =
        `${moves} coups • ${formatTime(seconds)} • ${matchedPairs} paires`;

    winOverlay.classList.add("show");
}


/*
 * Formate le temps.
 */
function formatTime(totalSeconds) {

    const minutes =
        Math.floor(totalSeconds / 60);

    const secs =
        totalSeconds % 60;

    return (
        `${String(minutes).padStart(2, "0")}:` +
        `${String(secs).padStart(2, "0")}`
    );
}


/*
 * Recommence une partie.
 * De nouvelles questions sont choisies aléatoirement.
 */
function resetGame() {

    stopTimer();

    firstCard = null;
    secondCard = null;

    lockBoard = false;

    moves = 0;
    matchedPairs = 0;

    seconds = 0;
    gameStarted = false;

    updateTime();

    updateStats();

    messageElement.textContent =
        "Trouve toutes les paires.";

    winOverlay.classList.remove("show");

    if (loadQuestions()) {

        createCards();
    }
}


/*
 * Boutons.
 */
restartBtn.addEventListener("click", resetGame);

playAgain.addEventListener("click", resetGame);

backBtn.addEventListener("click", () => {
    history.back();
});

exitGame.addEventListener("click", () => {
    history.back();
});


/*
 * Initialisation.
 */
if (loadQuestions()) {

    totalPairsElement.textContent =
        pairsData.length;

    createCards();

    updateStats();

    updateTime();
}
</script>
