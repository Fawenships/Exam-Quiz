<script type="module">

  import {
    createQuiz,
    selectQuestionsByLevel,
    answerQuestion,
    getCurrentQuestion,
    getLevel,
    getProgress,
    getAiHint,
    getAiFeedback,
    isFinished,
    QUESTIONS_PER_LEVEL
  } from './src/quizLogic.js';

  import {
    baccQuestions
  } from './src/baccQuestions.js';


  /* =========================
     QUESTIONS
  ========================= */

  const questions = baccQuestions;

  const totalLevels =
    Math.ceil(
      questions.length / QUESTIONS_PER_LEVEL
    );

  const unlockThreshold =
    Math.max(
      1,
      QUESTIONS_PER_LEVEL - 1
    );


  /* =========================
     NIVEAUX SAUVEGARDÉS
  ========================= */

  const savedUnlockedLevels =
    JSON.parse(
      localStorage.getItem(
        'exam_quiz_unlocked_levels'
      ) || '[1]'
    );

  const unlockedLevels =
    new Set(savedUnlockedLevels);


  function saveUnlockedLevels(){

    localStorage.setItem(
      'exam_quiz_unlocked_levels',
      JSON.stringify(
        Array.from(unlockedLevels)
      )
    );

  }


  /* =========================
     ÉTAT DU QUIZ
  ========================= */

  let selectedLevel = null;

  let quiz = null;

  let showLanding = true;


  /* =========================
     PIÈCES
  ========================= */

  let coins =
    Number(
      localStorage.getItem(
        'exam_quiz_coins'
      ) || 0
    );

  const levelReward = 5;


  /* =========================
     ACCUEIL DU QUIZ
  ========================= */

  function renderLanding(){

    const container =
      document.getElementById(
        'quiz-container'
      );

    container.innerHTML = `

      <div style="
        margin:18px 0;
        font-weight:bold;
        font-size:18px;
      ">
        🪙 ${coins} pièces
      </div>

      <button
        class="start-btn"
        id="start-btn">

        DÉMARRER

      </button>

      <button
        class="install-btn"
        id="install-btn"
        disabled>

        INSTALLER L'APPLICATION

      </button>

      <p
        id="install-note"
        style="
          color:#777;
          font-size:14px;
        ">

        Le bouton d'installation sera activé
        si le navigateur autorise l'installation.

      </p>

    `;

    document
      .getElementById('start-btn')
      .addEventListener(
        'click',
        () => {

          showLanding = false;

          render();

        }
      );

  }


  /* =========================
     DÉMARRER UN NIVEAU
  ========================= */

  function startQuiz(level){

    const levelQuestions =
      selectQuestionsByLevel(
        questions,
        level
      );

    return createQuiz(
      levelQuestions
    );

  }


  /* =========================
     SÉLECTION DES NIVEAUX
  ========================= */

  function renderLevelSelection(){

    const container =
      document.getElementById(
        'quiz-container'
      );

    const levels =
      Array.from(
        {
          length: totalLevels
        },
        (_, i) => i + 1
      );

    container.innerHTML = `

      <div class="quiz-progress">
        Choisissez un niveau :
      </div>

      <div style="
        margin-bottom:15px;
        font-weight:bold;
      ">
        Vos pièces : 🪙 ${coins}
      </div>

      <div class="levels-grid">

        ${levels.map(level => {

          const unlocked =
            unlockedLevels.has(level);

          return `

            <button
              class="level-btn${unlocked ? '' : ' locked'}"
              data-level="${level}"
              ${unlocked ? '' : 'disabled'}>

              ${
                unlocked
                  ? `Niveau ${level}`
                  : `Niveau ${level} 🔒`
              }

            </button>

          `;

        }).join('')}

      </div>

      <div class="result">
        Terminez un niveau pour débloquer le suivant.
      </div>

    `;

    container
      .querySelectorAll('.level-btn')
      .forEach(button => {

        if(button.disabled) return;

        button.addEventListener(
          'click',
          () => {

            selectedLevel =
              Number(
                button.dataset.level
              );

            quiz =
              startQuiz(
                selectedLevel
              );

            render();

          }
        );

      });

  }


  /* =========================
     AFFICHAGE PRINCIPAL
  ========================= */

  function render(){

    const container =
      document.getElementById(
        'quiz-container'
      );

    if(showLanding){

      renderLanding();

      return;

    }

    if(!quiz){

      renderLevelSelection();

      return;

    }


    /* =========================
       ÉCHEC
    ========================= */

    if(quiz.failed){

      const failedQuestion =
        getCurrentQuestion(
          quiz
        );

      const failedAnswerText =
        failedQuestion?.options[
          quiz.failedAnswer
        ] ?? 'Réponse inconnue';

      const correctAnswerText =
        failedQuestion?.options[
          failedQuestion?.correctAnswer
        ] ?? 'Réponse inconnue';

      container.innerHTML = `

        <div class="result">
          ❌ Échec du niveau ${selectedLevel}
        </div>

        <div class="result">
          Votre réponse :
          ${failedAnswerText}
        </div>

        <div class="result">
          Bonne réponse :
          ${correctAnswerText}
        </div>

        <div class="result">
          Recommencez le niveau pour progresser.
        </div>

        <button
          class="restart-btn"
          id="retry-btn">

          RECOMMENCER

        </button>

        <button
          class="restart-btn"
          id="back-btn">

          RETOUR AUX NIVEAUX

        </button>

      `;

      document
        .getElementById('retry-btn')
        .addEventListener(
          'click',
          () => {

            quiz =
              startQuiz(
                selectedLevel
              );

            render();

          }
        );

      document
        .getElementById('back-btn')
        .addEventListener(
          'click',
          () => {

            selectedLevel = null;

            quiz = null;

            render();

          }
        );

      return;

    }


    /* =========================
       QUIZ TERMINÉ
    ========================= */

    if(isFinished(quiz)){

      const nextLevel =
        selectedLevel + 1;

      const canUnlock =
        quiz.score >=
        unlockThreshold;

      let earned = 0;

      if(
        canUnlock &&
        nextLevel <= totalLevels &&
        !unlockedLevels.has(nextLevel)
      ){

        unlockedLevels.add(
          nextLevel
        );

        saveUnlockedLevels();

        earned =
          levelReward;

        coins += earned;

        localStorage.setItem(
          'exam_quiz_coins',
          String(coins)
        );

      }

      container.innerHTML = `

        <div class="result">
          🎉 Quiz terminé !
        </div>

        <div class="result">
          Score :
          ${quiz.score}/${quiz.questions.length}
        </div>

        <div class="result">
          ${getLevel(
            quiz.score,
            quiz.questions.length
          )}
        </div>

        ${
          canUnlock &&
          nextLevel <= totalLevels

          ?

          `<div class="badge">
            Niveau ${nextLevel} débloqué !
          </div>`

          :

          `<div
            class="badge"
            style="background:#e99619">

            Score nécessaire :
            ${unlockThreshold}/${quiz.questions.length}

          </div>`
        }

        ${
          earned > 0

          ?

          `<div style="margin-top:12px">
            +${earned} pièces 🪙
          </div>`

          :

          ''
        }

        <div style="margin-top:10px">
          Total : 🪙 ${coins}
        </div>

        <button
          class="restart-btn"
          id="restart-btn">

          RETOUR AUX NIVEAUX

        </button>

      `;

      document
        .getElementById('restart-btn')
        .addEventListener(
          'click',
          () => {

            selectedLevel = null;

            quiz = null;

            render();

          }
        );

      return;

    }


    /* =========================
       QUESTION
    ========================= */

    const question =
      getCurrentQuestion(
        quiz
      );

    container.innerHTML = `

      <div class="quiz-progress">

        Niveau ${selectedLevel}
        —
        ${getProgress(quiz)}

      </div>

      <h2>
        ${question.question}
      </h2>

      <div class="answers">

        ${question.options.map(
          (option,index) => `

          <button
            class="answer-btn"
            data-index="${index}">

            ${option}

          </button>

        `
        ).join('')}

      </div>

      <div class="ai-panel">

        <h3>
          🤖 Assistant IA
        </h3>

        <p id="ai-feedback">
          ${getAiHint(question)}
        </p>

        <button
          class="hint-btn"
          id="hint-btn">

          DEMANDER UN CONSEIL

        </button>

      </div>

    `;


    /* =========================
       RÉPONSES
    ========================= */

    container
      .querySelectorAll('.answer-btn')
      .forEach(button => {

        button.addEventListener(
          'click',
          () => {

            const selectedIndex =
              Number(
                button.dataset.index
              );

            const feedback =
              document.getElementById(
                'ai-feedback'
              );

            feedback.textContent =
              getAiFeedback(
                question,
                selectedIndex
              );

            const isCorrect =
              selectedIndex ===
              question.correctAnswer;

            if(!isCorrect){

              quiz = {
                ...quiz,
                failed:true,
                failedAnswer:selectedIndex
              };

              setTimeout(
                render,
                500
              );

              return;

            }

            quiz =
              answerQuestion(
                quiz,
                selectedIndex
              );

            setTimeout(
              render,
              400
            );

          }
        );

      });


    /* =========================
       CONSEIL IA
    ========================= */

    document
      .getElementById('hint-btn')
      .addEventListener(
        'click',
        () => {

          document
            .getElementById(
              'ai-feedback'
            )
            .textContent =
            getAiHint(question);

        }
      );

  }


  /* =========================
     LANCEMENT
  ========================= */

  render();


  /* =========================
     SERVICE WORKER
  ========================= */

  if(
    'serviceWorker'
    in navigator
  ){

    window.addEventListener(
      'load',
      () => {

        navigator.serviceWorker
          .register(
            '/service-worker.js'
          )
          .catch(
            error => {

              console.warn(
                'Service worker registration failed:',
                error
              );

            }
          );

      }
    );

  }

</script>
