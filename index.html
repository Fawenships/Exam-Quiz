<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam-Quiz</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        color: #0f172a;
        margin: 0;
        padding: 2rem;
      }
      .card {
        max-width: 680px;
        margin: 2rem auto;
        background: white;
        padding: 2rem;
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      }
      h1 {
        margin-top: 0;
        color: #1d4ed8;
      }
      button {
        display: block;
        width: 100%;
        margin: 0.7rem 0;
        padding: 0.95rem;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        background: #1d4ed8;
      }
      .progress {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 1rem;
      }
      .result {
        font-weight: bold;
        margin-top: 1rem;
        font-size: 1.1rem;
        color: #0f766e;
      }
      .restart-btn {
        margin-top: 1rem;
        background: #0f766e;
      }
      .restart-btn:hover {
        background: #115e59;
      }
      .ai-panel {
        margin-top: 1.2rem;
        padding: 1rem;
        border-radius: 12px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
      }
      .ai-panel h3 {
        margin-top: 0;
        color: #1d4ed8;
      }
      .ai-panel p {
        margin: 0.3rem 0 0;
        color: #334155;
      }
      .hint-btn {
        background: #7c3aed;
        margin-top: 0.8rem;
      }
      .hint-btn:hover {
        background: #6d28d9;
      }
      .level-btn.locked {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .level-btn.locked:hover {
        background: #94a3b8;
      }
      .badge {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        background: #22c55e;
        color: white;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Exam-Quiz</h1>
      <p>Bienvenue dans votre quiz d’entraînement en français.</p>
      <div id="quiz-container"></div>
    </div>

    <script type="module">
      import { createQuiz, selectQuestionsByLevel, answerQuestion, getCurrentQuestion, getLevel, getProgress, getAiHint, getAiFeedback, isFinished } from './src/quizLogic.js';
      import { baccQuestions } from './src/baccQuestions.js';

      const questions = baccQuestions;
      const totalLevels = Math.ceil(questions.length / 5);
      const unlockThreshold = 4; // score minimum requis pour débloquer le niveau suivant
      const unlockedLevels = new Set([1]);
      let selectedLevel = null;
      let quiz = null;

      function startQuiz(level) {
        const levelQuestions = selectQuestionsByLevel(questions, level);
        return createQuiz(levelQuestions);
      }

      function renderLevelSelection() {
        const container = document.getElementById('quiz-container');
        const levels = Array.from({ length: totalLevels }, (_, index) => index + 1);
        container.innerHTML = `
          <div class="progress">Choisissez un niveau à débloquer :</div>
          ${levels
            .map((level) => {
              const unlocked = unlockedLevels.has(level);
              return `<button class="level-btn${unlocked ? '' : ' locked'}" data-level="${level}" ${unlocked ? '' : 'disabled'}>${unlocked ? `Niveau ${level}` : `Niveau ${level} (verrouillé)`}</button>`;
            })
            .join('')}
          <div class="result">Niveau 1 disponible. Terminez chaque niveau pour débloquer le suivant.</div>
        `;

        container.querySelectorAll('.level-btn').forEach((button) => {
          if (button.disabled) {
            return;
          }
          button.addEventListener('click', () => {
            selectedLevel = Number(button.dataset.level);
            quiz = startQuiz(selectedLevel);
            render();
          });
        });
      }

      function render() {
        const container = document.getElementById('quiz-container');
        if (!quiz) {
          renderLevelSelection();
          return;
        }
        if (quiz.failed) {
          const failedQuestion = getCurrentQuestion(quiz);
          const failedAnswerText = failedQuestion?.options[quiz.failedAnswer] ?? 'Réponse inconnue';
          const correctAnswerText = failedQuestion?.options[failedQuestion?.correctAnswer] ?? 'Réponse correcte inconnue';

          container.innerHTML = `
            <div class="result">Échec du niveau ${selectedLevel}.</div>
            <div class="result">Vous avez choisi : ${failedAnswerText}</div>
            <div class="result">Bonne réponse : ${correctAnswerText}</div>
            <div class="result">Recommencez le niveau pour progresser.</div>
            <button class="restart-btn" id="retry-btn">Recommencer le niveau ${selectedLevel}</button>
            <button class="restart-btn" id="back-btn">Retour aux niveaux</button>
          `;
          document.getElementById('retry-btn').addEventListener('click', () => {
            quiz = startQuiz(selectedLevel);
            render();
          });
          document.getElementById('back-btn').addEventListener('click', () => {
            selectedLevel = null;
            quiz = null;
            render();
          });
          return;
        }

        if (isFinished(quiz)) {
          const nextLevel = selectedLevel + 1;
          const canUnlock = quiz.score >= unlockThreshold;
          if (canUnlock && nextLevel <= totalLevels) {
            unlockedLevels.add(nextLevel);
          }

          container.innerHTML = `
            <div class="result">Quiz terminé ! Niveau choisi : ${selectedLevel}</div>
            <div class="result">Votre score : ${quiz.score}/${quiz.questions.length}</div>
            <div class="result">${getLevel(quiz.score, quiz.questions.length)}</div>
            ${canUnlock && nextLevel <= totalLevels ? `<div class="badge">Niveau ${selectedLevel} terminé et niveau ${nextLevel} débloqué !</div>` : `<div class="badge" style="background:#f59e0b;">Score nécessaire : ${unlockThreshold}/5 pour débloquer le niveau suivant.</div>`}
            <button class="restart-btn" id="restart-btn">Revenir aux niveaux</button>
          `;
          document.getElementById('restart-btn').addEventListener('click', () => {
            selectedLevel = null;
            quiz = null;
            render();
          });
          return;
        }

        const question = getCurrentQuestion(quiz);
        container.innerHTML = `
          <div class="progress">Niveau ${selectedLevel} — ${getProgress(quiz)}</div>
          <h2>${question.question}</h2>
          ${question.options.map((option, index) => `<button data-index="${index}">${option}</button>`).join('')}
          <div class="ai-panel">
            <h3>Assistant IA</h3>
            <p id="ai-feedback">${getAiHint(question)}</p>
            <button class="hint-btn" id="hint-btn">Demander un conseil</button>
          </div>
        `;

        container.querySelectorAll('button').forEach((button) => {
          if (button.id === 'hint-btn') {
            button.addEventListener('click', () => {
              const feedback = document.getElementById('ai-feedback');
              feedback.textContent = getAiHint(question);
            });
            return;
          }

          button.addEventListener('click', () => {
            const selectedIndex = Number(button.dataset.index);
            const feedback = document.getElementById('ai-feedback');
            feedback.textContent = getAiFeedback(question, selectedIndex);
            const isCorrect = selectedIndex === question.correctAnswer;
            if (!isCorrect) {
              quiz = {
                ...quiz,
                failed: true,
                failedAnswer: selectedIndex,
              };
              render();
              return;
            }
            quiz = answerQuestion(quiz, selectedIndex);
            setTimeout(render, 400);
          });
        });
      }

      render();
    </script>
  </body>
</html>
