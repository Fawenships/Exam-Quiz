<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam-Quiz</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        color: #0f172a;
        margin: 0;
        padding: 2rem;
      }
      .card {
        max-width: 680px;
        margin: 2rem auto;
        background: white;
        padding: 2rem;
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      }
      h1 {
        margin-top: 0;
        color: #1d4ed8;
      }
      button {
        display: block;
        width: 100%;
        margin: 0.7rem 0;
        padding: 0.95rem;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        background: #1d4ed8;
      }
      .progress {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 1rem;
      }
      .result {
        font-weight: bold;
        margin-top: 1rem;
        font-size: 1.1rem;
        color: #0f766e;
      }
      .restart-btn {
        margin-top: 1rem;
        background: #0f766e;
      }
      .restart-btn:hover {
        background: #115e59;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Exam-Quiz</h1>
      <p>Bienvenue dans votre quiz d’entraînement en français.</p>
      <div id="quiz-container"></div>
    </div>

    <script type="module">
      import { createQuiz, answerQuestion, getCurrentQuestion, getLevel, getProgress, isFinished } from './src/quizLogic.js';

      const questions = [
        {
          id: 1,
          question: 'Quelle est la capitale d’Haïti ?',
          options: ['Port-au-Prince', 'Cap-Haïtien', 'Jacmel', 'Les Cayes'],
          correctAnswer: 0,
        },
        {
          id: 2,
          question: 'Combien de côtés a un carré ?',
          options: ['3', '4', '5', '6'],
          correctAnswer: 1,
        },
        {
          id: 3,
          question: 'Quel est le résultat de 2 + 2 ?',
          options: ['3', '4', '5', '6'],
          correctAnswer: 1,
        },
      ];

      function startQuiz() {
        return createQuiz(questions);
      }

      let quiz = startQuiz();

      function render() {
        const container = document.getElementById('quiz-container');
        if (isFinished(quiz)) {
          container.innerHTML = `
            <div class="result">Quiz terminé ! Votre score : ${quiz.score}/${questions.length}</div>
            <div class="result">${getLevel(quiz.score, questions.length)}</div>
            <button class="restart-btn" id="restart-btn">Recommencer</button>
          `;
          document.getElementById('restart-btn').addEventListener('click', () => {
            quiz = startQuiz();
            render();
          });
          return;
        }

        const question = getCurrentQuestion(quiz);
        container.innerHTML = `
          <div class="progress">${getProgress(quiz)}</div>
          <h2>${question.question}</h2>
          ${question.options.map((option, index) => `<button data-index="${index}">${option}</button>`).join('')}
        `;

        container.querySelectorAll('button').forEach((button) => {
          button.addEventListener('click', () => {
            const selectedIndex = Number(button.dataset.index);
            quiz = answerQuestion(quiz, selectedIndex);
            render();
          });
        });
      }

      render();
    </script>
  </body>
</html>
