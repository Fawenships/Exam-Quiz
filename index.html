<style>
:root{
  --dark:#343a40;
  --dark2:#495057;
  --gray:#6c757d;
  --gray2:#adb5bd;
  --light:#f1f3f5;
  --lighter:#f8f9fa;
  --text:#212529;
  --muted:#6c757d;
  --card:#ffffff;
  --border:#dee2e6;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:var(--light);
}

button,a{
  font:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   HEADER
========================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  height:76px;
  background:#343a40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.logo{
  display:flex;
  align-items:center;
  min-width:0;
}

.logo img{
  width:170px;
  max-width:55vw;
  height:auto;
  display:block;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:28px;
  color:#fff;
  font-size:15px;
}

.desktop-nav a{
  opacity:.9;
  transition:.2s;
}

.desktop-nav a:hover{
  opacity:1;
  color:#ced4da;
}

.menu-btn{
  display:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:34px;
  line-height:1;
  cursor:pointer;
  padding:4px;
}

.mobile-nav{
  display:none;
  position:absolute;
  top:76px;
  left:0;
  right:0;
  background:#343a40;
  padding:14px 7%;
  box-shadow:0 8px 18px rgba(0,0,0,.18);
}

.mobile-nav.open{
  display:block;
}

.mobile-nav a{
  display:block;
  color:#fff;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.12);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:610px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  padding:80px 20px 100px;
  background:linear-gradient(
    135deg,
    #343a40 0%,
    #495057 50%,
    #6c757d 100%
  );
  position:relative;
  overflow:hidden;
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.06);
}

.hero:before{
  width:420px;
  height:420px;
  top:-230px;
  right:-120px;
}

.hero:after{
  width:300px;
  height:300px;
  bottom:-200px;
  left:-100px;
}

.hero-content{
  max-width:820px;
  position:relative;
  z-index:1;
}

.hero-brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:64px;
  font-weight:300;
  margin-bottom:25px;
  letter-spacing:-2px;
}

.hero-brand span{
  width:3px;
  height:72px;
  background:#fff;
  display:inline-block;
}

.hero h1{
  margin:0 auto 24px;
  font-size:23px;
  letter-spacing:6px;
  line-height:1.8;
  color:#e9ecef;
  max-width:760px;
  text-transform:uppercase;
}

.hero p{
  font-size:17px;
  line-height:1.7;
  max-width:650px;
  margin:0 auto 30px;
  color:#f1f3f5;
}

/* =========================
   DEVELOPPEUR
========================= */

.developer-hero{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  margin:5px auto 28px;
  padding:16px 28px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:18px;
  background:rgba(0,0,0,.15);
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.developer-hero span{
  font-size:11px;
  letter-spacing:4px;
  color:#ced4da;
  font-weight:bold;
}

.developer-hero strong{
  font-size:25px;
  color:#fff;
  letter-spacing:.5px;
}

.developer-hero small{
  color:#e9ecef;
  font-size:13px;
}

/* =========================
   BOUTON PRINCIPAL
========================= */

.primary-btn{
  border:0;
  border-radius:40px;
  padding:18px 48px;
  background:#212529;
  color:#fff;
  font-weight:bold;
  letter-spacing:4px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.22);
  transition:.2s;
}

.primary-btn:hover{
  transform:translateY(-2px);
  background:#000;
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:85px 7%;
  background:#fff;
}

.section.alt{
  background:#f1f3f5;
}

.section-title{
  text-align:center;
  font-size:44px;
  font-weight:400;
  margin:0 0 22px;
  text-transform:uppercase;
  color:#343a40;
}

.section-intro{
  max-width:850px;
  margin:0 auto 45px;
  color:#6c757d;
  text-align:center;
  font-size:18px;
  line-height:1.8;
}

/* =========================
   QUIZ
========================= */

.quiz-shell{
  max-width:900px;
  margin:0 auto;
  background:#fff;
  border-radius:22px;
  padding:30px;
  box-shadow:0 12px 40px rgba(25,35,60,.09);
  border:1px solid #dee2e6;
}

.quiz-progress{
  color:#6c757d;
  margin-bottom:15px;
  font-weight:bold;
}

.quiz-shell h2{
  line-height:1.5;
  margin:10px 0 24px;
}

.answers{
  display:grid;
  gap:12px;
}

.answer-btn{
  width:100%;
  border:1px solid #dee2e6;
  background:#fff;
  color:#212529;
  padding:16px 18px;
  border-radius:12px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.answer-btn:hover{
  border-color:#6c757d;
  background:#f1f3f5;
  transform:translateX(2px);
}

/* =========================
   NIVEAUX
========================= */

.levels-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.level-btn{
  border:0;
  border-radius:12px;
  padding:15px;
  background:#495057;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

.level-btn:hover{
  background:#343a40;
  transform:translateY(-2px);
}

.level-btn.locked{
  background:#adb5bd;
  cursor:not-allowed;
}

.result{
  margin:12px 0;
  font-weight:bold;
  line-height:1.5;
}

/* =========================
   BOUTONS QUIZ
========================= */

.restart-btn,
.hint-btn,
.start-btn,
.install-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  color:#fff;
  cursor:pointer;
  margin-top:10px;
}

.restart-btn{
  background:#343a40;
}

.restart-btn:hover{
  background:#212529;
}

.hint-btn{
  background:#6c757d;
}

.hint-btn:hover{
  background:#495057;
}

.start-btn{
  background:#343a40;
}

.start-btn:hover{
  background:#212529;
}

.install-btn{
  background:#868e96;
}

.install-btn:hover{
  background:#6c757d;
}

.install-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================
   BADGE
========================= */

.badge{
  display:inline-block;
  margin-top:12px;
  padding:10px 15px;
  border-radius:30px;
  background:#495057;
  color:#fff;
  font-weight:bold;
}

/* =========================
   ASSISTANT IA
========================= */

.ai-panel{
  margin-top:22px;
  padding:18px;
  border-radius:15px;
  background:#f1f3f5;
  border:1px solid #dee2e6;
}

.ai-panel h3{
  margin-top:0;
  color:#343a40;
}

/* =========================
   CARTE QUIZ
========================= */

.landing-card{
  text-align:center;
}

.landing-card .quiz-icon{
  width:120px;
  height:120px;
  border-radius:30px;
  margin:0 auto 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#343a40,#6c757d);
  color:#fff;
  font-size:52px;
  box-shadow:0 10px 25px rgba(0,0,0,.16);
}

.reassure{
  margin:20px auto;
  max-width:650px;
  padding:18px;
  border-radius:15px;
  background:#f1f3f5;
  color:#495057;
  line-height:1.6;
  text-align:left;
}

/* =========================
   CARTE DEVELOPPEUR
========================= */

.developer-card{
  max-width:520px;
  margin:20px auto 25px;
  padding:18px;
  border-radius:16px;
  background:linear-gradient(135deg,#343a40,#6c757d);
  color:#fff;
  display:flex;
  flex-direction:column;
  gap:5px;
  box-shadow:0 10px 25px rgba(0,0,0,.14);
}

.developer-card span{
  font-size:11px;
  letter-spacing:3px;
  font-weight:bold;
  color:#dee2e6;
}

.developer-card strong{
  font-size:23px;
}

.developer-card small{
  font-size:14px;
  color:#e9ecef;
}

/* =========================
   CATÉGORIES
========================= */

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  max-width:1100px;
  margin:auto;
}

.category{
  background:#fff;
  border-radius:18px;
  padding:26px 20px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
  border:1px solid #dee2e6;
  transition:.2s;
}

.category:hover{
  transform:translateY(-5px);
  border-color:#adb5bd;
  box-shadow:0 14px 30px rgba(0,0,0,.10);
}

.category .emoji{
  font-size:40px;
  margin-bottom:12px;
}

.category h3{
  margin:8px 0;
  font-size:19px;
}

.category p{
  margin:0;
  color:#6c757d;
  line-height:1.5;
}

/* =========================
   RÉSEAUX SOCIAUX
========================= */

.social-section{
  background:#212529;
  color:#fff;
  text-align:center;
  padding:75px 7%;
}

.social-section p{
  max-width:700px;
  margin:0 auto 35px;
  font-size:18px;
  line-height:1.8;
  color:#dee2e6;
}

.socials{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

.socials a{
  font-size:34px;
  color:#fff;
  transition:.2s;
}

.socials a:hover{
  color:#ced4da;
  transform:scale(1.08);
}

/* =========================
   FOOTER
========================= */

footer{
  background:#212529;
  color:#fff;
  padding:60px 7% 25px;
  border-top:1px solid #495057;
}

.footer-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:50px;
}

footer h3{
  letter-spacing:5px;
  font-size:18px;
  font-weight:400;
  margin-top:0;
}

footer p{
  color:#adb5bd;
  line-height:1.8;
}

.footer-links a{
  display:block;
  color:#dee2e6;
  margin:16px 0;
}

.footer-links a:hover{
  color:#fff;
}

.footer-bottom{
  max-width:1100px;
  margin:50px auto 0;
  padding-top:25px;
  border-top:1px solid #495057;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#adb5bd;
  font-size:14px;
}

.footer-socials{
  display:flex;
  gap:20px;
}

.footer-socials a{
  color:#adb5bd;
  font-size:22px;
}

.footer-socials a:hover{
  color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .site-header{
    padding:0 5%;
    height:70px;
  }

  .desktop-nav{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .mobile-nav{
    top:70px;
  }

  .hero{
    min-height:610px;
    padding:65px 20px 85px;
  }

  .hero-brand{
    font-size:48px;
  }

  .developer-hero strong{
    font-size:21px;
  }

  .developer-hero{
    padding:14px 20px;
  }

  .hero-brand span{
    height:58px;
  }

  .hero h1{
    font-size:16px;
    letter-spacing:4px;
    line-height:2;
  }

  .hero p{
    font-size:16px;
  }

  .section{
    padding:65px 6%;
  }

  .section-title{
    font-size:34px;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .footer-grid{
    grid-template-columns:1fr;
    gap:25px;
  }

  .footer-bottom{
    flex-direction:column;
  }
}

@media(max-width:480px){

  .logo img{
    width:145px;
  }

  .hero-brand{
    font-size:40px;
  }

  .hero-brand span{
    height:48px;
  }

  .hero h1{
    font-size:14px;
    letter-spacing:3px;
  }

  .primary-btn{
    padding:16px 34px;
  }

  .quiz-shell{
    padding:20px;
  }

  .categories{
    grid-template-columns:1fr;
  }

  .section-title{
    font-size:29px;
  }
}
</style>
