<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Course Quiz — ExamQuiz Haiti</title>

<style>

:root{
    --purple:#24113f;
    --purple2:#4b2481;
    --blue:#1764c0;
    --blue2:#2f80ed;
    --white:#ffffff;
    --bg:#f5f5f7;
    --text:#171717;
    --muted:#707070;
    --border:#e4e4e7;
    --green:#16834b;
    --red:#c62828;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button{
    font:inherit;
    border:none;
    cursor:pointer;
}

.page{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:12px;
}

/* RETOUR */

.back-button{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    min-height:46px;

    margin-bottom:12px;
    padding:10px 14px;

    border:1px solid var(--border);
    border-radius:13px;

    background:var(--white);
    color:var(--purple);

    text-decoration:none;

    font-size:14px;
    font-weight:800;

    transition:.15s;
}

.back-button:hover{
    border-color:var(--purple2);
}

.back-button:active{
    transform:scale(.98);
}


/* HEADER */

.topbar{
    background:var(--white);

    border:1px solid var(--border);
    border-radius:16px;

    padding:14px 16px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;

    margin-bottom:14px;
}

.logo{
    font-size:18px;
    font-weight:800;
    color:var(--purple);
}

.race-label{
    font-size:14px;
    color:var(--muted);
    font-weight:700;
}


/* SCORE */

.scoreboard{

    display:grid;

    grid-template-columns:1fr auto 1fr;

    gap:10px;

    align-items:center;

    margin-bottom:14px;
}

.player{

    background:var(--white);

    border:2px solid var(--border);

    border-radius:16px;

    padding:12px;

    text-align:center;

    transition:.2s;
}

.player.active{

    border-color:var(--blue2);

    box-shadow:
        0 0 0 3px rgba(47,128,237,.10);
}

.player-name{

    font-size:13px;

    font-weight:700;

    color:var(--muted);
}

.player-score{

    font-size:30px;

    font-weight:800;

    color:var(--purple);

    margin-top:3px;
}

.vs{

    font-size:13px;

    font-weight:900;

    color:var(--muted);
}


/* COURSE */

.race-card{

    background:var(--white);

    border:1px solid var(--border);

    border-radius:18px;

    padding:18px;

    margin-bottom:14px;
}

.track-title{

    text-align:center;

    font-size:14px;

    font-weight:800;

    color:var(--muted);

    margin-bottom:14px;
}

.track{

    position:relative;

    height:70px;

    background:#f0f0f2;

    border:1px solid var(--border);

    border-radius:16px;

    margin-bottom:12px;

    overflow:hidden;
}

.track:last-child{
    margin-bottom:0;
}

.track-line{

    position:absolute;

    left:16px;
    right:16px;

    top:50%;

    height:4px;

    background:#d5d5d8;

    transform:translateY(-50%);
}

.runner{

    position:absolute;

    top:50%;

    left:16px;

    width:38px;
    height:38px;

    border-radius:50%;

    background:var(--purple2);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:900;

    transform:
        translateY(-50%);

    transition:
        left .35s ease;
}

.runner.player2{
    background:var(--blue);
}

.finish{

    position:absolute;

    right:10px;

    top:8px;
    bottom:8px;

    width:4px;

    background:var(--purple);
}


/* QUESTION */

.game-card{

    background:var(--white);

    border:1px solid var(--border);

    border-radius:18px;

    padding:20px;
}

.turn{

    text-align:center;

    font-size:14px;

    color:var(--blue);

    font-weight:800;

    margin-bottom:10px;
}

.question-number{

    text-align:center;

    color:var(--muted);

    font-size:13px;

    margin-bottom:10px;
}

.question{

    font-size:22px;

    line-height:1.35;

    font-weight:800;

    text-align:center;

    max-width:720px;

    margin:0 auto 22px;
}


/* OPTIONS */

.options{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.option{

    min-height:64px;

    border:2px solid var(--border);

    border-radius:14px;

    background:white;

    padding:12px;

    font-weight:700;

    text-align:left;

    transition:.15s;
}

.option:hover{

    border-color:var(--blue2);
}

.option:active{

    transform:scale(.98);
}

.option.correct{

    border-color:var(--green);

    background:#eef9f2;

    color:var(--green);
}

.option.wrong{

    border-color:var(--red);

    background:#fff0f0;

    color:var(--red);
}

.option:disabled{

    cursor:default;
}


/* FEEDBACK */

.feedback{

    margin-top:16px;

    padding:14px;

    border-radius:12px;

    text-align:center;

    font-weight:700;

    display:none;
}

.feedback.show{

    display:block;
}

.feedback.correct{

    background:#eef9f2;

    color:var(--green);
}

.feedback.wrong{

    background:#fff0f0;

    color:var(--red);
}


/* NEXT */

.next-btn{

    width:100%;

    margin-top:12px;

    min-height:52px;

    border-radius:13px;

    background:var(--purple2);

    color:white;

    font-weight:800;

    display:none;
}

.next-btn.show{

    display:block;
}

.next-btn:active{

    transform:scale(.98);
}


/* CATEGORY */

.category{

    margin-top:14px;

    text-align:center;

    color:var(--muted);

    font-size:13px;
}


/* OVERLAY */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(20,12,30,.72);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:50;
}

.overlay.show{

    display:flex;
}

.result-box{

    width:100%;

    max-width:450px;

    background:white;

    border-radius:20px;

    padding:26px 20px;

    text-align:center;
}

.result-title{

    font-size:27px;

    font-weight:900;

    color:var(--purple);

    margin-bottom:10px;
}

.result-winner{

    font-size:19px;

    font-weight:800;

    margin:16px 0;
}

.final-score{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin:18px 0;
}

.final-player{

    border:1px solid var(--border);

    border-radius:14px;

    padding:14px;
}

.final-player strong{

    display:block;

    color:var(--muted);

    margin-bottom:6px;
}

.final-player span{

    font-size:30px;

    font-weight:900;

    color:var(--purple);
}

.action-btn{

    width:100%;

    min-height:52px;

    border-radius:13px;

    background:var(--purple2);

    color:white;

    font-weight:800;

    margin-top:8px;
}

.action-btn:active{

    transform:scale(.98);
}

.secondary-btn{

    background:#eeeef1;

    color:var(--text);
}


/* MOBILE */

@media(max-width:600px){

    .page{

        padding:9px;
    }

    .back-button{

        min-height:44px;

        font-size:13px;

        margin-bottom:9px;
    }

    .topbar{

        border-radius:13px;

        padding:12px;
    }

    .logo{

        font-size:16px;
    }

    .race-label{

        font-size:12px;
    }

    .scoreboard{

        gap:6px;
    }

    .player{

        padding:10px 6px;

        border-radius:13px;
    }

    .player-name{

        font-size:12px;
    }

    .player-score{

        font-size:27px;
    }

    .vs{

        font-size:11px;
    }

    .race-card{

        padding:12px;

        border-radius:15px;
    }

    .track{

        height:58px;

        border-radius:13px;
    }

    .runner{

        width:32px;
        height:32px;

        font-size:12px;

        left:10px;
    }

    .track-line{

        left:12px;
        right:12px;
    }

    .finish{

        right:7px;
    }

    .game-card{

        padding:14px 10px;

        border-radius:15px;
    }

    .question{

        font-size:19px;

        line-height:1.35;

        margin-bottom:18px;
    }

    .options{

        grid-template-columns:1fr;

        gap:9px;
    }

    .option{

        min-height:58px;

        padding:11px;

        font-size:14px;
    }

    .result-box{

        padding:22px 15px;
    }

    .result-title{

        font-size:24px;
    }

    .result-winner{

        font-size:18px;
    }
}

@media(max-width:360px){

    .question{

        font-size:17px;
    }

    .player-score{

        font-size:24px;
    }

    .option{

        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="page">

    <!-- RETOUR -->

    <a
        href="baccalaureat.html"
        class="back-button"
    >
        ← Retour aux jeux
    </a>


    <!-- HEADER -->

    <header class="topbar">

        <div class="logo">
            ExamQuiz
        </div>

        <div
            class="race-label"
            id="raceLabel"
        >
            Course 1 / 20
        </div>

    </header>


    <!-- SCORE -->

    <section class="scoreboard">

        <div
            class="player active"
            id="player1Card"
        >

            <div class="player-name">
                Joueur 1
            </div>

            <div
                class="player-score"
                id="score1"
            >
                0
            </div>

        </div>


        <div class="vs">
            VS
        </div>


        <div
            class="player"
            id="player2Card"
        >

            <div class="player-name">
                Joueur 2
            </div>

            <div
                class="player-score"
                id="score2"
            >
                0
            </div>

        </div>

    </section>


    <!-- COURSE -->

    <section class="race-card">

        <div class="track-title">
            Course
        </div>


        <!-- JOUEUR 1 -->

        <div class="track">

            <div class="track-line"></div>

            <div
                class="runner"
                id="runner1"
            >
                1
            </div>

            <div class="finish"></div>

        </div>


        <!-- JOUEUR 2 -->

        <div class="track">

            <div class="track-line"></div>

            <div
                class="runner player2"
                id="runner2"
            >
                2
            </div>

            <div class="finish"></div>

        </div>

    </section>


    <!-- JEU -->

    <main class="game-card">

        <div
            class="turn"
            id="turnLabel"
        >
            Tour de Joueur 1
        </div>


        <div
            class="question-number"
            id="questionNumber"
        >
            Question 1 / 10
        </div>


        <div
            class="question"
            id="question"
        >
            Chargement...
        </div>


        <div
            class="options"
            id="options"
        ></div>


        <div
            class="feedback"
            id="feedback"
        ></div>


        <button
            type="button"
            class="next-btn"
            id="nextBtn"
        >
            Question suivante
        </button>


        <div
            class="category"
            id="category"
        ></div>

    </main>

</div>


<!-- RESULTAT -->

<div
    class="overlay"
    id="resultOverlay"
>

    <div class="result-box">

        <div
            class="result-title"
            id="resultTitle"
        >
            Course terminée
        </div>


        <div
            class="result-winner"
            id="winnerText"
        ></div>


        <div class="final-score">

            <div class="final-player">

                <strong>
                    Joueur 1
                </strong>

                <span id="finalScore1">
                    0
                </span>

            </div>


            <div class="final-player">

                <strong>
                    Joueur 2
                </strong>

                <span id="finalScore2">
                    0
                </span>

            </div>

        </div>


        <button
            type="button"
            class="action-btn"
            id="nextRaceBtn"
        >
            Course suivante
        </button>


        <button
            type="button"
            class="action-btn secondary-btn"
            id="restartBtn"
        >
            Recommencer
        </button>

    </div>

</div>


<script type="module">

import {
    jeuxQuestions
} from "./src/jeuxQuestions.js";


/* CONFIGURATION */

const QUESTIONS_PER_RACE = 10;

const MAX_RACES = 20;


/* ETAT */

let allQuestions = [];

let currentQuestions = [];

let currentQuestionIndex = 0;

let currentPlayer = 1;

let raceNumber = 1;

let score1 = 0;

let score2 = 0;

let progress1 = 0;

let progress2 = 0;

let answered = false;

let gameFinished = false;


/* ELEMENTS */

const questionElement =
    document.getElementById("question");

const optionsElement =
    document.getElementById("options");

const feedbackElement =
    document.getElementById("feedback");

const nextBtn =
    document.getElementById("nextBtn");

const turnLabel =
    document.getElementById("turnLabel");

const questionNumber =
    document.getElementById("questionNumber");

const categoryElement =
    document.getElementById("category");

const score1Element =
    document.getElementById("score1");

const score2Element =
    document.getElementById("score2");

const player1Card =
    document.getElementById("player1Card");

const player2Card =
    document.getElementById("player2Card");

const raceLabel =
    document.getElementById("raceLabel");

const runner1 =
    document.getElementById("runner1");

const runner2 =
    document.getElementById("runner2");

const resultOverlay =
    document.getElementById("resultOverlay");

const resultTitle =
    document.getElementById("resultTitle");

const winnerText =
    document.getElementById("winnerText");

const finalScore1 =
    document.getElementById("finalScore1");

const finalScore2 =
    document.getElementById("finalScore2");

const nextRaceBtn =
    document.getElementById("nextRaceBtn");

const restartBtn =
    document.getElementById("restartBtn");


/* MELANGE */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];
    }

    return copy;
}


/* PREPARER UNE COURSE */

function prepareRace(){

    if(
        !Array.isArray(jeuxQuestions) ||
        jeuxQuestions.length === 0
    ){

        questionElement.textContent =
            "Aucune question disponible.";

        optionsElement.innerHTML = "";

        return false;
    }


    allQuestions =
        [...jeuxQuestions];


    currentQuestions =
        shuffle(allQuestions)
        .slice(
            0,
            Math.min(
                QUESTIONS_PER_RACE,
                allQuestions.length
            )
        );


    return currentQuestions.length > 0;
}


/* SCORE */

function updateScore(){

    score1Element.textContent =
        score1;

    score2Element.textContent =
        score2;


    player1Card.classList.toggle(
        "active",
        currentPlayer === 1
    );


    player2Card.classList.toggle(
        "active",
        currentPlayer === 2
    );
}


/* POSITION DES JOUEURS */

function updateRunners(){

    const trackWidth =
        document.querySelector(".track")
        .clientWidth;


    const runnerWidth =
        runner1.offsetWidth;


    const start = 10;


    const finish =
        Math.max(
            start,
            trackWidth -
            runnerWidth -
            14
        );


    const maxProgress =
        Math.max(
            1,
            QUESTIONS_PER_RACE
        );


    const position1 =
        start +
        (
            progress1 /
            maxProgress
        ) *
        (
            finish -
            start
        );


    const position2 =
        start +
        (
            progress2 /
            maxProgress
        ) *
        (
            finish -
            start
        );


    runner1.style.left =
        `${position1}px`;

    runner2.style.left =
        `${position2}px`;
}


/* AFFICHER QUESTION */

function displayQuestion(){

    if(
        currentQuestionIndex >=
        currentQuestions.length
    ){

        endRace();

        return;
    }


    answered = false;


    const currentQuestion =
        currentQuestions[
            currentQuestionIndex
        ];


    questionNumber.textContent =
        `Question ${
            currentQuestionIndex + 1
        } / ${
            currentQuestions.length
        }`;


    questionElement.textContent =
        currentQuestion.question;


    turnLabel.textContent =
        `Tour de Joueur ${currentPlayer}`;


    categoryElement.textContent =
        currentQuestion.category
        ? `Catégorie : ${currentQuestion.category}`
        : "";


    feedbackElement.className =
        "feedback";

    feedbackElement.textContent =
        "";


    nextBtn.className =
        "next-btn";


    optionsElement.innerHTML =
        "";


    const options =
        shuffle(
            currentQuestion.options || []
        );


    options.forEach(option => {

        const button =
            document.createElement("button");


        button.type =
            "button";


        button.className =
            "option";


        button.textContent =
            option;


        button.addEventListener(
            "click",
            () => {

                answerQuestion(
                    button,
                    option,
                    currentQuestion
                );

            }
        );


        optionsElement.appendChild(
            button
        );

    });


    updateScore();

    updateRunners();
}


/* REPONDRE */

function answerQuestion(
    clickedButton,
    selectedAnswer,
    currentQuestion
){

    if(answered) return;


    answered = true;


    const buttons =
        optionsElement.querySelectorAll(
            ".option"
        );


    buttons.forEach(button => {

        button.disabled = true;


        if(
            button.textContent ===
            currentQuestion.answer
        ){

            button.classList.add(
                "correct"
            );

        }

    });


    const isCorrect =
        selectedAnswer ===
        currentQuestion.answer;


    if(isCorrect){

        clickedButton.classList.add(
            "correct"
        );


        if(currentPlayer === 1){

            score1 += 10;

            progress1++;

        }
        else{

            score2 += 10;

            progress2++;

        }


        feedbackElement.textContent =
            `Bonne réponse ! Joueur ${
                currentPlayer
            } avance de 1 position et gagne 10 points.`;


        feedbackElement.className =
            "feedback show correct";


        updateScore();

        updateRunners();

    }
    else{

        clickedButton.classList.add(
            "wrong"
        );


        feedbackElement.textContent =
            `Mauvaise réponse. La bonne réponse était : ${
                currentQuestion.answer
            }`;


        feedbackElement.className =
            "feedback show wrong";

    }


    nextBtn.className =
        "next-btn show";
}


/* QUESTION SUIVANTE */

function nextQuestion(){

    if(!answered) return;


    currentQuestionIndex++;


    currentPlayer =
        currentPlayer === 1
        ? 2
        : 1;


    displayQuestion();
}


/* FIN DE COURSE */

function endRace(){

    finalScore1.textContent =
        score1;

    finalScore2.textContent =
        score2;


    resultTitle.textContent =
        `Course ${raceNumber} terminée`;


    if(progress1 > progress2){

        winnerText.textContent =
            "Joueur 1 atteint la meilleure position.";

    }
    else if(progress2 > progress1){

        winnerText.textContent =
            "Joueur 2 atteint la meilleure position.";

    }
    else{

        winnerText.textContent =
            "Les deux joueurs terminent à égalité.";

    }


    if(
        raceNumber >= MAX_RACES
    ){

        endGame();

        return;
    }


    nextRaceBtn.textContent =
        "Course suivante";


    resultOverlay.classList.add(
        "show"
    );
}


/* FIN DES 20 COURSES */

function endGame(){

    gameFinished = true;


    resultTitle.textContent =
        "Course Quiz terminée";


    if(score1 > score2){

        winnerText.textContent =
            "Joueur 1 termine avec le plus de points.";

    }
    else if(score2 > score1){

        winnerText.textContent =
            "Joueur 2 termine avec le plus de points.";

    }
    else{

        winnerText.textContent =
            "La partie se termine par une égalité.";

    }


    finalScore1.textContent =
        score1;

    finalScore2.textContent =
        score2;


    nextRaceBtn.textContent =
        "Nouvelle partie";


    resultOverlay.classList.add(
        "show"
    );
}


/* COURSE SUIVANTE */

function startNextRace(){

    if(gameFinished){

        restartGame();

        return;
    }


    if(
        raceNumber >= MAX_RACES
    ){

        endGame();

        return;
    }


    raceNumber++;

    currentQuestionIndex = 0;

    currentPlayer = 1;

    progress1 = 0;

    progress2 = 0;


    raceLabel.textContent =
        `Course ${
            raceNumber
        } / ${
            MAX_RACES
        }`;


    resultOverlay.classList.remove(
        "show"
    );


    if(prepareRace()){

        updateRunners();

        displayQuestion();

    }
}


/* RECOMMENCER */

function restartGame(){

    raceNumber = 1;

    currentQuestionIndex = 0;

    currentPlayer = 1;

    score1 = 0;

    score2 = 0;

    progress1 = 0;

    progress2 = 0;

    answered = false;

    gameFinished = false;


    raceLabel.textContent =
        `Course 1 / ${MAX_RACES}`;


    resultOverlay.classList.remove(
        "show"
    );


    nextRaceBtn.textContent =
        "Course suivante";


    updateRunners();


    if(prepareRace()){

        displayQuestion();

    }
}


/* EVENEMENTS */

nextBtn.addEventListener(
    "click",
    nextQuestion
);


nextRaceBtn.addEventListener(
    "click",
    startNextRace
);


restartBtn.addEventListener(
    "click",
    restartGame
);


window.addEventListener(
    "resize",
    updateRunners
);


/* DEMARRAGE */

if(prepareRace()){

    displayQuestion();

}

</script>

</body>
</html>
