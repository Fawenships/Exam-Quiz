<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#24113f"
>

<title>Sciences NS4 — ExamQuiz Haiti</title>

<meta
  name="description"
  content="Questions et réponses de biologie, géologie, chimie, anglais et mathématiques niveau NS4 sur ExamQuiz Haiti."
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f3f8;
  color:#222;
}

/* HEADER */

header{
  background:#24113f;
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.logo-link{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  font-size:20px;
}

.logo-link img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:10px;
}

/* BOUTON RETOUR À L'ACCUEIL */

.home-btn{
  display:block;
  width:max-content;
  margin:20px auto 0;
  padding:12px 20px;
  background:#24113f;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  transition:.2s;
}

.home-btn:hover{
  opacity:.9;
  transform:translateY(-2px);
}

/* HERO */

.hero{
  text-align:center;
  padding:45px 20px 30px;
}

.hero h1{
  margin:0;
  color:#24113f;
  font-size:34px;
}

.hero p{
  margin-top:12px;
  color:#666;
  font-size:17px;
}

/* CATEGORIES */

.categories{
  width:min(1100px,92%);
  margin:20px auto 50px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.category-btn{
  border:none;
  border-radius:18px;
  padding:28px 20px;
  min-height:150px;
  cursor:pointer;
  background:white;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  transition:.2s;
  font-size:18px;
  font-weight:bold;
  color:#24113f;
}

.category-btn:hover{
  transform:translateY(-4px);
  box-shadow:0 9px 25px rgba(0,0,0,.14);
}

.category-icon{
  display:block;
  font-size:45px;
  margin-bottom:12px;
}

/* QUESTIONS PAGE */

#questions-page{
  display:none;
  width:min(950px,92%);
  margin:25px auto 50px;
}

/* QUESTIONS HEADER */

.questions-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
}

.questions-header h2{
  margin:0;
  color:#24113f;
  font-size:28px;
}

/* BOUTON RETOUR AUX CATÉGORIES */

#backBtn{
  border:none;
  background:#24113f;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
  transition:.2s;
}

#backBtn:hover{
  opacity:.9;
  transform:translateY(-2px);
}

/* QUESTION CARD */

.question-card{
  background:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.question-number{
  display:inline-block;
  background:#24113f;
  color:white;
  padding:7px 12px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  margin-bottom:15px;
}

.question-text{
  font-size:18px;
  font-weight:bold;
  line-height:1.6;
}

/* RÉSOLUTION */

.solution{
  background:#fff8e6;
  border-radius:12px;
  padding:18px;
  margin-top:18px;
  line-height:1.8;
  border-left:4px solid #f0a500;
}

.solution strong{
  display:block;
  margin-bottom:10px;
  font-size:17px;
}

.solution-steps{
  white-space:normal;
  color:#333;
}

/* RÉPONSE */

.answer{
  background:#f1f6ff;
  border-radius:10px;
  padding:18px;
  margin-top:15px;
  line-height:1.7;
  border-left:4px solid #1764c0;
}

.answer strong{
  color:#1764c0;
}

/* EMPTY */

.empty{
  background:white;
  padding:35px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.empty h3{
  color:#24113f;
}

/* FOOTER */

footer{
  text-align:center;
  padding:25px 15px;
  color:#777;
  font-size:14px;
}

/* MOBILE */

@media(max-width:750px){

  .categories{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:28px;
  }

  .home-btn{
    width:92%;
    text-align:center;
  }

  .questions-header{
    flex-direction:column;
    align-items:stretch;
  }

  #backBtn{
    width:100%;
    order:2;
  }

  .questions-header h2{
    text-align:center;
    order:1;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

  <a
    href="index.html"
    class="logo-link"
  >

    <img
      src="logo.png"
      alt="ExamQuiz Haiti"
    >

    <span>ExamQuiz Haiti</span>

  </a>

</header>


<!-- RETOUR À L'ACCUEIL -->

<a
  href="index.html"
  class="home-btn"
>
  ← Retour à l'accueil
</a>


<!-- HERO -->

<section class="hero">

  <h1>🔬 Sciences NS4</h1>

  <p>
    Révise tes matières avec des questions,
    réponses et résolutions détaillées.
  </p>

</section>


<!-- CATÉGORIES -->

<section
  class="categories"
  id="categories"
>

  <button
    class="category-btn"
    id="biologyBtn"
  >

    <span class="category-icon">🧬</span>

    Biologie

  </button>


  <button
    class="category-btn"
    id="geologyBtn"
  >

    <span class="category-icon">🌍</span>

    Géologie

  </button>


  <button
    class="category-btn"
    id="chemistryBtn"
  >

    <span class="category-icon">⚗️</span>

    Chimie

  </button>


  <button
    class="category-btn"
    id="anglaisBtn"
  >

    <span class="category-icon">🇬🇧</span>

    Anglais

  </button>


  <button
    class="category-btn"
    id="mathematiquesBtn"
  >

    <span class="category-icon">➗</span>

    Mathématiques

  </button>

  <button
    class="category-btn"
    id="physiqueBtn"
  >

    <span class="category-icon">⚡</span>

    Physique

  </button>

</section>


<!-- PAGE QUESTIONS -->

<section id="questions-page">

  <div class="questions-header">

    <button id="backBtn">
      ← Retour aux catégories
    </button>

    <h2 id="title">
      Questions
    </h2>

  </div>


  <div id="questions"></div>

</section>


<!-- FOOTER -->

<footer>

  © 2026 ExamQuiz •
  Développé par Ing. Fawenbert Régis

</footer>


<script type="module">

/* ============================= */
/* VARIABLES */
/* ============================= */

const categories =
  document.getElementById("categories");

const questionsPage =
  document.getElementById("questions-page");

const questionsContainer =
  document.getElementById("questions");

const title =
  document.getElementById("title");

const backBtn =
  document.getElementById("backBtn");

const biologyBtn =
  document.getElementById("biologyBtn");

const geologyBtn =
  document.getElementById("geologyBtn");

const chemistryBtn =
  document.getElementById("chemistryBtn");

const anglaisBtn =
  document.getElementById("anglaisBtn");

const mathematiquesBtn =
  document.getElementById("mathematiquesBtn");

const physiqueBtn =
  document.getElementById("physiqueBtn");


/* ============================= */
/* VARIABLES QUESTIONS */
/* ============================= */

let biologieQuestions = [];

let geologieQuestions = [];

let chimieQuestions = [];

let anglaisQuestions = [];

let mathematiquesQuestions = [];

let physiqueQuestions = [];


/* ============================= */
/* CHARGEMENT BIOLOGIE */
/* ============================= */

try{

  const module =
    await import("./src/biologieQuestions.js");

  biologieQuestions =
    module.biologieQuestions || [];

}catch(error){

  console.error(
    "Erreur chargement Biologie :",
    error
  );

}


/* ============================= */
/* CHARGEMENT GÉOLOGIE */
/* ============================= */

try{

  const module =
    await import("./src/geologieQuestions.js");

  geologieQuestions =
    module.geologieQuestions || [];

}catch(error){

  console.error(
    "Erreur chargement Géologie :",
    error
  );

}


/* ============================= */
/* CHARGEMENT CHIMIE */
/* ============================= */

try{

  const module =
    await import("./src/chimieQuestions.js");

  chimieQuestions =
    module.chimieQuestions || [];

}catch(error){

  console.error(
    "Erreur chargement Chimie :",
    error
  );

}


/* ============================= */
/* CHARGEMENT ANGLAIS */
/* ============================= */

try{

  const module =
    await import("./src/anglaisQuestions.js");

  anglaisQuestions =
    module.anglaisQuestions || [];

}catch(error){

  console.error(
    "Erreur chargement Anglais :",
    error
  );

}


/* ============================= */
/* CHARGEMENT MATHÉMATIQUES */
/* ============================= */

try{

  const module =
    await import("./src/mathematiquesQuestions.js");

  mathematiquesQuestions =
    module.mathematiquesQuestions || [];

}catch(error){

  console.error(
    "Erreur chargement Mathématiques :",
    error
  );

}


/* ============================= */
/* CHARGEMENT PHYSIQUE */
/* ============================= */

try{

  const module =
    await import("./src/physiqueQuestions.js");

  physiqueQuestions =
    module.physiqueQuestions || [];

}catch(error){

  console.error(
    "Erreur chargement Physique :",
    error
  );

}


/* ============================= */
/* AFFICHER LES QUESTIONS */
/* ============================= */

function afficherQuestions(liste, nom){

  categories.style.display =
    "none";

  questionsPage.style.display =
    "block";

  title.textContent =
    nom;

  questionsContainer.innerHTML =
    "";


  /* SI AUCUNE QUESTION */

  if(
    !Array.isArray(liste) ||
    liste.length === 0
  ){

    questionsContainer.innerHTML = `

      <div class="empty">

        <h3>
          Aucune question trouvée
        </h3>

        <p>
          Le fichier de cette matière
          est vide ou n'a pas pu être chargé.
        </p>

      </div>

    `;

    return;

  }


  /* AFFICHAGE */

  liste.forEach((item,index)=>{

    const question =
      item.question ??
      item.Question ??
      item.q ??
      "";


    const answer =
      item.answer ??
      item.reponse ??
      item.response ??
      item.r ??
      item.answerText ??
      "";


    const solution =
      item.solution ??
      item.resolution ??
      item.correction ??
      "";


    const card =
      document.createElement("div");

    card.className =
      "question-card";


    card.innerHTML = `

      <div class="question-number">

        Question ${index + 1}

      </div>


      <div class="question-text">

        ${question}

      </div>


      ${
        solution
        ?
        `
        <div class="solution">

          <strong>
            📝 Résolution :
          </strong>

          <div class="solution-steps">

            ${solution.replace(/\n/g,"<br>")}

          </div>

        </div>
        `
        :
        ""
      }


      <div class="answer">

        <strong>
          ✅ Réponse :
        </strong>

        <br><br>

        ${answer}

      </div>

    `;


    questionsContainer.appendChild(
      card
    );

  });


  /* RETOUR EN HAUT */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ============================= */
/* BOUTON BIOLOGIE */
/* ============================= */

biologyBtn.addEventListener(
  "click",
  ()=>{

    afficherQuestions(
      biologieQuestions,
      "🧬 Biologie"
    );

  }
);


/* ============================= */
/* BOUTON GÉOLOGIE */
/* ============================= */

geologyBtn.addEventListener(
  "click",
  ()=>{

    afficherQuestions(
      geologieQuestions,
      "🌍 Géologie"
    );

  }
);


/* ============================= */
/* BOUTON CHIMIE */
/* ============================= */

chemistryBtn.addEventListener(
  "click",
  ()=>{

    afficherQuestions(
      chimieQuestions,
      "⚗️ Chimie"
    );

  }
);


/* ============================= */
/* BOUTON ANGLAIS */
/* ============================= */

anglaisBtn.addEventListener(
  "click",
  ()=>{

    afficherQuestions(
      anglaisQuestions,
      "🇬🇧 Anglais"
    );

  }
);


/* ============================= */
/* BOUTON MATHÉMATIQUES */
/* ============================= */

mathematiquesBtn.addEventListener(
  "click",
  ()=>{

    afficherQuestions(
      mathematiquesQuestions,
      "➗ Mathématiques"
    );

  }
);


/* ============================= */
/* BOUTON PHYSIQUE */
/* ============================= */

physiqueBtn.addEventListener(
  "click",
  ()=>{

    afficherQuestions(
      physiqueQuestions,
      "⚡ Physique"
    );

  }
);


/* ============================= */
/* BOUTON RETOUR AUX CATÉGORIES */
/* ============================= */

backBtn.addEventListener(
  "click",
  ()=>{

    /* CACHER LA PAGE DES QUESTIONS */

    questionsPage.style.display =
      "none";


    /* RÉAFFICHER LES CATÉGORIES */

    categories.style.display =
      "grid";


    /* EFFACER LES QUESTIONS */

    questionsContainer.innerHTML =
      "";


    /* REMONTER EN HAUT DE LA PAGE */

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);

</script>

</body>
</html>
