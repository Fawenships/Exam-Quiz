<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#24113f">
<title>Sciences NS4 — ExamQuiz Haiti</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#171717;
}

header{
  background:#24113f;
  color:white;
  padding:22px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header img{
  width:150px;
  max-width:50vw;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#54319a,#1764c0);
  color:white;
  text-align:center;
  padding:70px 20px;
}

.hero h1{
  margin:0 0 15px;
  font-size:42px;
}

.hero p{
  max-width:700px;
  margin:auto;
  line-height:1.7;
  font-size:18px;
}

.container{
  max-width:1000px;
  margin:45px auto;
  padding:0 20px;
}

.choix{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  margin-bottom:35px;
}

.matiere{
  border:0;
  border-radius:18px;
  padding:30px 20px;
  background:white;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  cursor:pointer;
  text-align:center;
  transition:.2s;
}

.matiere:hover{
  transform:translateY(-4px);
}

.matiere .emoji{
  font-size:50px;
  margin-bottom:12px;
}

.matiere h2{
  margin:8px 0;
}

.matiere p{
  color:#666;
}

.quiz{
  display:none;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 35px rgba(0,0,0,.1);
}

.quiz.active{
  display:block;
}

.progress{
  color:#666;
  font-weight:bold;
  margin-bottom:15px;
}

.question{
  font-size:23px;
  line-height:1.5;
  margin-bottom:25px;
}

.answer{
  width:100%;
  border:1px solid #dce2eb;
  background:white;
  padding:16px;
  margin:8px 0;
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:16px;
}

.answer:hover{
  background:#f1f7ff;
  border-color:#3180e8;
}

.answer.correct{
  background:#dff6e8;
  border-color:#20a75a;
}

.answer.wrong{
  background:#ffe2e2;
  border-color:#d33;
}

.info{
  text-align:center;
  color:#666;
  margin:20px 0;
}

.retour{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:20px;
  background:#24113f;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.fin{
  text-align:center;
}

.fin h2{
  font-size:30px;
}

footer{
  margin-top:70px;
  background:#000;
  color:#aaa;
  text-align:center;
  padding:35px 20px;
}

footer strong{
  color:white;
}

@media(max-width:650px){
  .choix{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:32px;
  }

  .quiz{
    padding:20px;
  }

  .question{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="logo.png" alt="ExamQuiz Haiti">
  </a>

  <a href="index.html">← Accueil</a>
</header>

<section class="hero">
  <h1>🔬 Sciences NS4</h1>
  <p>
    Révise la biologie et la géologie avec des questions adaptées
    au niveau NS4 en Haïti.
  </p>
</section>

<main class="container">

  <div id="choix" class="choix">

    <button class="matiere" id="btn-biologie">
      <div class="emoji">🧬</div>
      <h2>Biologie</h2>
      <p>Questions de biologie niveau NS4</p>
    </button>

    <button class="matiere" id="btn-geologie">
      <div class="emoji">🌍</div>
      <h2>Géologie</h2>
      <p>Questions de géologie niveau NS4</p>
    </button>

  </div>

  <div id="quiz" class="quiz">

    <div class="progress" id="progress"></div>

    <div class="question" id="question"></div>

    <div id="answers"></div>

    <div class="info" id="info"></div>

    <button class="retour" id="retour">
      ← RETOUR AUX MATIÈRES
    </button>

  </div>

</main>

<footer>
  <strong>ExamQuiz Haiti</strong><br>
  Sciences — Niveau NS4<br><br>
  © 2026 ExamQuiz • Développé par Ing. Fawenbert Régis
</footer>


<script type="module">

/*
  IMPORTANT :
  Cette page n'utilise PAS quizLogic.js.

  Elle utilise uniquement :
  - biologieQuestions.js
  - geologieQuestions.js
*/

import { biologieQuestions } from './src/biologieQuestions.js';
import { geologieQuestions } from './src/geologieQuestions.js';


const choix = document.getElementById('choix');
const quiz = document.getElementById('quiz');

const btnBiologie = document.getElementById('btn-biologie');
const btnGeologie = document.getElementById('btn-geologie');

const progress = document.getElementById('progress');
const questionElement = document.getElementById('question');
const answersElement = document.getElementById('answers');
const info = document.getElementById('info');
const retour = document.getElementById('retour');


let questions = [];
let numero = 0;
let score = 0;
let matiere = "";


/*
  Cette fonction accepte plusieurs formats
  de questions pour éviter les problèmes
  avec ton fichier existant.
*/

function normaliserQuestion(q){

  if(Array.isArray(q)){

    return {
      question:q[0],
      options:q[1] || [],
      correctAnswer:q[2]
    };

  }

  if(q && typeof q === "object"){

    return {
      question:q.question || q.Question || "",
      options:q.options || q.choices || q.reponses || [],
      correctAnswer:
        q.correctAnswer ??
        q.correct ??
        q.answer ??
        q.bonneReponse
    };

  }

  return {
    question:"",
    options:[],
    correctAnswer:0
  };
}


function commencer(nouvellesQuestions, nom){

  questions = nouvellesQuestions.map(normaliserQuestion);

  /*
    Mélange les questions pour que l'ordre
    ne soit pas toujours le même.
  */

  questions = [...questions].sort(() => Math.random() - 0.5);

  numero = 0;
  score = 0;
  matiere = nom;

  choix.style.display = "none";
  quiz.classList.add("active");

  afficherQuestion();
}


function afficherQuestion(){

  if(numero >= questions.length){
    afficherFin();
    return;
  }

  const q = questions[numero];

  progress.textContent =
    `${matiere} — Question ${numero + 1} / ${questions.length}`;

  questionElement.textContent = q.question;

  answersElement.innerHTML = "";
  info.textContent = "";

  q.options.forEach((option,index)=>{

    const bouton = document.createElement("button");

    bouton.className = "answer";
    bouton.textContent = option;

    bouton.addEventListener("click",()=>{

      verifierReponse(index,q.correctAnswer,bouton);

    });

    answersElement.appendChild(bouton);

  });
}


function verifierReponse(index,bonne,bouton){

  const boutons =
    answersElement.querySelectorAll(".answer");

  boutons.forEach(b=>{
    b.disabled = true;
  });

  /*
    La bonne réponse peut être :
    - un numéro : 0,1,2,3
    - une lettre : A,B,C,D
  */

  let bonneIndex = bonne;

  if(typeof bonne === "string"){

    const lettre = bonne.trim().toUpperCase();

    if(["A","B","C","D"].includes(lettre)){
      bonneIndex = ["A","B","C","D"].indexOf(lettre);
    }
  }

  if(Number(index) === Number(bonneIndex)){

    bouton.classList.add("correct");
    score++;

    info.textContent = "✅ Bonne réponse !";

  }else{

    bouton.classList.add("wrong");

    if(boutons[bonneIndex]){
      boutons[bonneIndex].classList.add("correct");
    }

    info.textContent = "❌ Mauvaise réponse.";

  }

  setTimeout(()=>{

    numero++;
    afficherQuestion();

  },900);
}


function afficherFin(){

  questionElement.innerHTML = `
    <div class="fin">
      <h2>🎉 Quiz terminé !</h2>
      <p>
        Tu as obtenu
        <strong>${score} / ${questions.length}</strong>.
      </p>
    </div>
  `;

  progress.textContent = matiere;

  answersElement.innerHTML = "";

  info.textContent =
    `Score : ${score}/${questions.length}`;

  retour.style.display = "block";
}


btnBiologie.addEventListener("click",()=>{

  commencer(
    biologieQuestions,
    "🧬 Biologie NS4"
  );

});


btnGeologie.addEventListener("click",()=>{

  commencer(
    geologieQuestions,
    "🌍 Géologie NS4"
  );

});


retour.addEventListener("click",()=>{

  quiz.classList.remove("active");

  choix.style.display = "grid";

  progress.textContent = "";
  questionElement.textContent = "";
  answersElement.innerHTML = "";
  info.textContent = "";

});


</script>

</body>
</html>
