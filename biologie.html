<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#24113f">

<title>Sciences NS4 — ExamQuiz Haiti</title>
<meta name="description" content="Questions et réponses de biologie, géologie et chimie niveau NS4.">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#171717;
}

header{
  background:#24113f;
  padding:18px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header img{
  width:150px;
  max-width:50vw;
  display:block;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#54319a,#1764c0);
  color:white;
  text-align:center;
  padding:65px 20px;
}

.hero h1{
  margin:0 0 15px;
  font-size:40px;
}

.hero p{
  margin:auto;
  max-width:700px;
  font-size:18px;
  line-height:1.7;
}

.container{
  max-width:1050px;
  margin:45px auto;
  padding:0 20px;
}

/* CATÉGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.category-btn{
  border:0;
  background:#fff;
  border-radius:18px;
  padding:30px 20px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  transition:.2s;
  text-align:center;
}

.category-btn:hover{
  transform:translateY(-5px);
  box-shadow:0 14px 30px rgba(0,0,0,.12);
}

.emoji{
  font-size:50px;
  margin-bottom:12px;
}

.category-btn h2{
  margin:10px 0;
}

.category-btn p{
  color:#666;
  line-height:1.5;
}

/* PAGE QUESTIONS */

#questions-page{
  display:none;
}

.topbar{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.topbar h2{
  margin:0;
}

.back-btn{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  background:#24113f;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* QUESTIONS */

.question-card{
  background:#fff;
  border-radius:16px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  border-left:5px solid #1764c0;
}

.question-number{
  color:#1764c0;
  font-weight:bold;
  margin-bottom:10px;
}

.question-text{
  font-size:18px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:15px;
}

.answer{
  background:#f1f6ff;
  border-radius:10px;
  padding:15px;
  line-height:1.6;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  text-align:center;
  color:#666;
}

/* FOOTER */

footer{
  background:#000;
  color:#aaa;
  text-align:center;
  padding:35px 20px;
  margin-top:70px;
}

footer strong{
  color:#fff;
}

/* MOBILE */

@media(max-width:800px){

  .categories{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:32px;
  }

  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

  .back-btn{
    width:100%;
  }
}

@media(min-width:801px) and (max-width:950px){

  .categories{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <a href="index.html" aria-label="Retour à l'accueil">
    <img src="logo.png" alt="ExamQuiz Haiti">
  </a>

  <a href="index.html">← Accueil</a>

</header>


<!-- HERO -->

<section class="hero">

  <h1>🔬 Sciences NS4</h1>

  <p>
    Révise les sciences avec des questions et réponses
    adaptées au niveau NS4.
  </p>

</section>


<main class="container">


  <!-- LES 3 MATIÈRES -->

  <div id="categories" class="categories">


    <!-- BIOLOGIE -->

    <button class="category-btn" id="biologyBtn">

      <div class="emoji">🧬</div>

      <h2>Biologie</h2>

      <p>
        Questions et réponses de biologie
        niveau NS4.
      </p>

    </button>


    <!-- GÉOLOGIE -->

    <button class="category-btn" id="geologyBtn">

      <div class="emoji">🌍</div>

      <h2>Géologie</h2>

      <p>
        Questions et réponses de géologie
        niveau NS4.
      </p>

    </button>


    <!-- CHIMIE -->

    <button class="category-btn" id="chemistryBtn">

      <div class="emoji">⚗️</div>

      <h2>Chimie</h2>

      <p>
        Questions et réponses de chimie
        niveau NS4.
      </p>

    </button>


  </div>


  <!-- ZONE DES QUESTIONS -->

  <div id="questions-page">

    <div class="topbar">

      <h2 id="title"></h2>

      <button class="back-btn" id="backBtn">
        ← Retour aux matières
      </button>

    </div>


    <div id="questions"></div>

  </div>


</main>


<!-- FOOTER -->

<footer>

  <strong>ExamQuiz Haiti</strong>

  <br><br>

  Sciences — Niveau NS4

  <br><br>

  © 2026 ExamQuiz • Développé par Ing. Fawenbert Régis

</footer>


<script type="module">

/*
==================================================
FICHIERS DES QUESTIONS
==================================================

Cette page ne touche PAS à quizLogic.js.

Elle utilise uniquement les trois fichiers :
- biologieQuestions.js
- geologieQuestions.js
- chimieQuestions.js
*/

import {
  biologieQuestions
} from "./src/biologieQuestions.js";

import {
  geologieQuestions
} from "./src/geologieQuestions.js";

import {
  chimieQuestions
} from "./src/chimieQuestions.js";


/*
==================================================
ÉLÉMENTS HTML
==================================================
*/

const categories =
  document.getElementById("categories");

const questionsPage =
  document.getElementById("questions-page");

const questionsContainer =
  document.getElementById("questions");

const title =
  document.getElementById("title");

const biologyBtn =
  document.getElementById("biologyBtn");

const geologyBtn =
  document.getElementById("geologyBtn");

const chemistryBtn =
  document.getElementById("chemistryBtn");

const backBtn =
  document.getElementById("backBtn");


/*
==================================================
AFFICHER LES QUESTIONS
==================================================
*/

function afficherQuestions(liste, nom){

  categories.style.display = "none";

  questionsPage.style.display = "block";

  title.textContent = nom;

  questionsContainer.innerHTML = "";


  /*
  Vérification du fichier
  */

  if(!Array.isArray(liste) || liste.length === 0){

    questionsContainer.innerHTML = `
      <div class="empty">

        <h3>Aucune question trouvée</h3>

        <p>
          Vérifie que le fichier de questions
          contient bien les données.
        </p>

      </div>
    `;

    return;
  }


  /*
  Affichage de chaque question
  */

  liste.forEach((item,index)=>{

    /*
    Accepte plusieurs noms possibles
    pour la question.
    */

    const question =
      item.question ??
      item.Question ??
      item.q ??
      "";


    /*
    Accepte plusieurs noms possibles
    pour la réponse.
    */

    const answer =
      item.answer ??
      item.reponse ??
      item.response ??
      item.r ??
      "";


    const card =
      document.createElement("div");

    card.className = "question-card";


    card.innerHTML = `

      <div class="question-number">
        Question ${index + 1}
      </div>

      <div class="question-text">
        ${question}
      </div>

      <div class="answer">

        <strong>Réponse :</strong><br>

        ${answer}

      </div>

    `;


    questionsContainer.appendChild(card);

  });

}


/*
==================================================
BOUTON BIOLOGIE
==================================================
*/

biologyBtn.addEventListener("click",()=>{

  afficherQuestions(
    biologieQuestions,
    "🧬 Biologie — NS4"
  );

});


/*
==================================================
BOUTON GÉOLOGIE
==================================================
*/

geologyBtn.addEventListener("click",()=>{

  afficherQuestions(
    geologieQuestions,
    "🌍 Géologie — NS4"
  );

});


/*
==================================================
BOUTON CHIMIE
==================================================
*/

chemistryBtn.addEventListener("click",()=>{

  afficherQuestions(
    chimieQuestions,
    "⚗️ Chimie — NS4"
  );

});


/*
==================================================
RETOUR
==================================================
*/

backBtn.addEventListener("click",()=>{

  questionsPage.style.display = "none";

  categories.style.display = "grid";

  questionsContainer.innerHTML = "";

  title.textContent = "";

});


</script>

</body>
</html>
