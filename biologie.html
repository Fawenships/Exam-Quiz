<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#24113f">

<title>Sciences NS4 — ExamQuiz Haiti</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#171717;
}

header{
  background:#24113f;
  padding:18px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header img{
  width:150px;
  max-width:50vw;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#54319a,#1764c0);
  color:white;
  text-align:center;
  padding:65px 20px;
}

.hero h1{
  margin:0 0 15px;
  font-size:40px;
}

.hero p{
  margin:auto;
  max-width:700px;
  font-size:18px;
  line-height:1.7;
}

.container{
  max-width:1050px;
  margin:45px auto;
  padding:0 20px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.category-btn{
  border:0;
  background:white;
  border-radius:18px;
  padding:30px 20px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  transition:.2s;
  text-align:center;
}

.category-btn:hover{
  transform:translateY(-4px);
}

.emoji{
  font-size:50px;
}

.category-btn h2{
  margin:12px 0 8px;
}

.category-btn p{
  color:#666;
}

#questions-page{
  display:none;
}

.topbar{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.topbar h2{
  margin:0;
}

.back-btn{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  background:#24113f;
  color:white;
  cursor:pointer;
}

.question-card{
  background:white;
  border-radius:16px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  border-left:5px solid #1764c0;
}

.question-number{
  color:#1764c0;
  font-weight:bold;
  margin-bottom:10px;
}

.question-text{
  font-size:18px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:15px;
}

.answer{
  background:#f1f6ff;
  border-radius:10px;
  padding:15px;
  line-height:1.6;
}

footer{
  background:#000;
  color:#aaa;
  text-align:center;
  padding:35px 20px;
  margin-top:70px;
}

footer strong{
  color:white;
}

@media(max-width:650px){

  .categories{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:30px;
  }

  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

  .back-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html">
    <img src="logo.png" alt="ExamQuiz Haiti">
  </a>

  <a href="index.html">← Accueil</a>

</header>

<section class="hero">

  <h1>🔬 Sciences NS4</h1>

  <p>
    Révise tes cours avec les questions et réponses
    de niveau NS4.
  </p>

</section>

<main class="container">

  <!-- CHOIX DES MATIÈRES -->

  <div id="categories" class="categories">

    <button class="category-btn" id="biologyBtn">

      <div class="emoji">🧬</div>

      <h2>Biologie</h2>

      <p>
        Questions et réponses de biologie
        niveau NS4.
      </p>

    </button>


    <button class="category-btn" id="geologyBtn">

      <div class="emoji">🌍</div>

      <h2>Géologie</h2>

      <p>
        Questions et réponses de géologie
        niveau NS4.
      </p>

    </button>

  </div>


  <!-- PAGE QUESTIONS -->

  <div id="questions-page">

    <div class="topbar">

      <h2 id="title"></h2>

      <button class="back-btn" id="backBtn">
        ← Retour
      </button>

    </div>

    <div id="questions"></div>

  </div>

</main>


<footer>

  <strong>ExamQuiz Haiti</strong>

  <br><br>

  Sciences — Niveau NS4

  <br><br>

  © 2026 ExamQuiz • Développé par Ing. Fawenbert Régis

</footer>


<script type="module">

import { biologieQuestions } 
from "./src/biologieQuestions.js";

import { geologieQuestions } 
from "./src/geologieQuestions.js";


const categories =
document.getElementById("categories");

const questionsPage =
document.getElementById("questions-page");

const questionsContainer =
document.getElementById("questions");

const title =
document.getElementById("title");

const biologyBtn =
document.getElementById("biologyBtn");

const geologyBtn =
document.getElementById("geologyBtn");

const backBtn =
document.getElementById("backBtn");


function afficherQuestions(liste, nom){

  categories.style.display = "none";

  questionsPage.style.display = "block";

  title.textContent = nom;

  questionsContainer.innerHTML = "";


  if(!Array.isArray(liste) || liste.length === 0){

    questionsContainer.innerHTML = `
      <div class="question-card">
        <div class="question-text">
          Aucune question trouvée.
        </div>

        <div class="answer">
          Vérifie le contenu du fichier JavaScript.
        </div>
      </div>
    `;

    return;
  }


  liste.forEach((item,index)=>{

    const question =
      item.question ??
      item.Question ??
      "";

    const answer =
      item.answer ??
      item.reponse ??
      item.response ??
      item.answerText ??
      "";


    const card =
    document.createElement("div");

    card.className = "question-card";


    card.innerHTML = `

      <div class="question-number">
        Question ${index + 1}
      </div>

      <div class="question-text">
        ${question}
      </div>

      <div class="answer">
        <strong>Réponse :</strong><br>
        ${answer}
      </div>

    `;


    questionsContainer.appendChild(card);

  });

}


biologyBtn.addEventListener("click",()=>{

  afficherQuestions(
    biologieQuestions,
    "🧬 Biologie — NS4"
  );

});


geologyBtn.addEventListener("click",()=>{

  afficherQuestions(
    geologieQuestions,
    "🌍 Géologie — NS4"
  );

});


backBtn.addEventListener("click",()=>{

  questionsPage.style.display = "none";

  categories.style.display = "grid";

  questionsContainer.innerHTML = "";

});


</script>

</body>
</html>
