<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Mots Croisés — ExamQuiz</title>

<style>
:root{
    --purple:#4b2481;
    --purple-dark:#24113f;
    --purple-light:#eee7fa;
    --blue:#1764c0;
    --green:#15966b;
    --red:#d64545;

    --bg:#f4f5f8;
    --white:#ffffff;
    --text:#202124;
    --muted:#747982;
    --black:#202020;

    --cell:42px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font:inherit;
}

/* =========================
   HEADER
========================= */

.header{
    width:min(1100px,calc(100% - 24px));
    margin:12px auto 0;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.back{
    text-decoration:none;
    color:var(--purple-dark);
    background:white;

    border:1px solid #dddfe5;
    border-radius:11px;

    padding:10px 13px;

    font-weight:700;
    font-size:13px;
}

.title{
    text-align:center;
}

.title small{
    display:block;
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.title strong{
    color:var(--purple-dark);
    font-size:20px;
}

/* =========================
   HUD
========================= */

.hud{
    width:min(1100px,calc(100% - 24px));
    margin:12px auto;

    display:flex;
    gap:8px;
}

.stat{
    flex:1;
    background:white;

    border:1px solid #e0e2e7;
    border-radius:12px;

    padding:9px 12px;
}

.stat span{
    display:block;
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
}

.stat strong{
    display:block;
    margin-top:3px;

    color:var(--purple-dark);
    font-size:19px;
}

/* =========================
   LAYOUT
========================= */

.layout{
    width:min(1100px,calc(100% - 24px));
    margin:auto;

    display:grid;
    grid-template-columns:minmax(0,1fr) 350px;
    gap:14px;

    padding-bottom:30px;
}

.panel{
    background:white;

    border:1px solid #e0e2e7;
    border-radius:18px;

    box-shadow:0 5px 22px rgba(0,0,0,.045);
}

/* =========================
   GRID
========================= */

.grid-panel{
    padding:15px;
}

.clue-bar{
    background:var(--purple-dark);
    color:white;

    border-radius:13px;

    padding:13px 15px;

    margin-bottom:14px;
}

.clue-type{
    opacity:.65;
    font-size:9px;

    text-transform:uppercase;
    letter-spacing:1px;
}

.clue-text{
    margin-top:4px;

    font-size:15px;
    line-height:1.35;

    font-weight:700;
}

.clue-length{
    margin-top:5px;

    opacity:.7;
    font-size:11px;
}

.grid-scroll{
    width:100%;
    overflow:auto;

    display:flex;
    justify-content:center;

    padding:3px;
}

.grid{
    display:grid;

    background:#171717;

    gap:1px;
    padding:2px;

    flex:none;

    border-radius:6px;
}

.cell{
    width:var(--cell);
    height:var(--cell);

    border:0;
    padding:0;

    position:relative;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:800;

    color:#222;

    user-select:none;
    -webkit-user-select:none;

    touch-action:manipulation;
}

.cell.black{
    background:#202020;
}

.cell.playable{
    cursor:pointer;
}

.cell.word{
    background:#eee8f8;
}

.cell.selected{
    background:#d2c0ed;
}

.cell.correct{
    background:#dff5ec;
    color:#087b54;
}

.cell.wrong{
    background:#f9dddd;
    color:#c52e2e;
}

.cell.revealed{
    background:#e8edf8;
    color:#1764c0;
}

.number{
    position:absolute;

    top:2px;
    left:3px;

    font-size:8px;
    font-weight:700;

    color:#555;
}

.letter{
    margin-top:5px;
}

/* =========================
   SIDE
========================= */

.side{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.side-card{
    padding:15px;
}

.side-card h2{
    color:var(--purple-dark);
    font-size:17px;
    margin-bottom:11px;
}

.current{
    background:#f5f1fa;
    border:1px solid #ddd0ee;

    border-radius:12px;

    padding:12px;

    margin-bottom:12px;
}

.current-label{
    color:var(--purple);
    font-size:9px;
    text-transform:uppercase;
    font-weight:800;
}

.current-text{
    margin-top:5px;
    font-size:14px;
    line-height:1.4;
    font-weight:700;
}

.current-info{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.action{
    border:1px solid #dfe1e6;
    background:white;

    border-radius:10px;

    padding:11px 8px;

    font-weight:700;
    font-size:12px;
}

.action.primary{
    background:var(--purple);
    border-color:var(--purple);
    color:white;
}

.action:hover{
    filter:brightness(.97);
}

.message{
    min-height:19px;

    margin-top:9px;

    font-size:12px;
    font-weight:700;
}

.message.good{
    color:var(--green);
}

.message.bad{
    color:var(--red);
}

.message.info{
    color:var(--blue);
}

/* =========================
   CLUES
========================= */

.clues{
    display:flex;
    flex-direction:column;
    gap:6px;

    max-height:350px;
    overflow:auto;
}

.clue-button{
    width:100%;

    display:flex;
    align-items:flex-start;

    gap:8px;

    text-align:left;

    background:#fafafa;

    border:1px solid #e3e4e8;
    border-radius:9px;

    padding:9px;

    color:var(--text);
}

.clue-button.active{
    border-color:var(--purple);
    background:#f3eef9;
}

.clue-button.done{
    border-color:#9bd9c1;
    background:#effaf5;
}

.clue-number{
    flex:0 0 24px;
    height:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--purple-dark);
    color:white;

    border-radius:6px;

    font-size:10px;
    font-weight:800;
}

.clue-button.done .clue-number{
    background:var(--green);
}

.clue-content{
    font-size:12px;
    line-height:1.35;
}

/* =========================
   MOBILE INPUT
========================= */

/*
   Ce champ est volontairement presque invisible.
   Il sert à ouvrir le clavier natif du téléphone.
*/

.mobile-input{
    position:fixed;

    left:-1000px;
    top:0;

    width:1px;
    height:1px;

    opacity:0;

    border:0;

    font-size:16px;
}

/* =========================
   COMPLETION
========================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:50;

    background:rgba(25,15,40,.58);

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.overlay.show{
    display:flex;
}

.result{
    width:min(420px,100%);

    background:white;

    border-radius:22px;

    padding:28px;

    text-align:center;
}

.result h2{
    color:var(--purple-dark);
    font-size:26px;
}

.result-score{
    color:var(--purple);
    font-size:48px;
    font-weight:900;

    margin:10px 0;
}

.result p{
    color:var(--muted);
    line-height:1.5;
}

.restart{
    width:100%;

    margin-top:18px;

    border:0;
    border-radius:11px;

    padding:13px;

    background:var(--purple);
    color:white;

    font-weight:800;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    :root{
        --cell:38px;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .side{
        order:2;
    }

    .grid-panel{
        order:1;
    }

}

@media(max-width:520px){

    :root{
        --cell:32px;
    }

    .header,
    .hud,
    .layout{
        width:calc(100% - 14px);
    }

    .header{
        margin-top:8px;
    }

    .back{
        padding:8px 9px;
        font-size:11px;
    }

    .title strong{
        font-size:17px;
    }

    .title small{
        font-size:8px;
    }

    .hud{
        margin:8px auto;
    }

    .stat{
        padding:8px;
    }

    .stat span{
        font-size:8px;
    }

    .stat strong{
        font-size:16px;
    }

    .layout{
        padding-bottom:20px;
    }

    .grid-panel{
        padding:9px;
        border-radius:14px;
    }

    .clue-bar{
        padding:11px;
        margin-bottom:9px;
    }

    .clue-text{
        font-size:14px;
    }

    .cell{
        font-size:16px;
    }

    .number{
        font-size:7px;
    }

    .side-card{
        padding:12px;
        border-radius:14px;
    }

    .clues{
        max-height:none;
    }

}

@media(max-width:370px){

    :root{
        --cell:29px;
    }

    .cell{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header class="header">

    <a
        class="back"
        href="baccalaureat.html">
        ← Jeux
    </a>

    <div class="title">
        <small>ExamQuiz</small>
        <strong>Mots Croisés</strong>
    </div>

    <div style="width:52px"></div>

</header>


<section class="hud">

    <div class="stat">
        <span>Score</span>
        <strong id="score">0</strong>
    </div>

    <div class="stat">
        <span>Mots</span>
        <strong>
            <span id="solved">0</span>/<span id="total">0</span>
        </strong>
    </div>

    <div class="stat">
        <span>Indices</span>

    </div>

</section>


<main class="layout">

    <!-- GRILLE -->

    <section class="panel grid-panel">

        <div class="clue-bar">

            <div
                id="clueType"
                class="clue-type">
                Sélectionne une case
            </div>

            <div
                id="clueText"
                class="clue-text">
                Touche une case blanche pour commencer.
            </div>

            <div
                id="clueLength"
                class="clue-length">
            </div>

        </div>


        <div class="grid-scroll">

            <div
                id="grid"
                class="grid">
            </div>

        </div>

    </section>


    <!-- COMMANDES / INDICES -->

    <aside class="side">

        <section class="panel side-card">

            <div class="current">

                <div class="current-label">
                    Mot sélectionné
                </div>

                <div
                    id="currentText"
                    class="current-text">
                    Sélectionne une case.
                </div>

                <div
                    id="currentInfo"

                </div>

            </div>


            <div class="actions">

                <button
                    id="check"
                    class="action primary">
                    Vérifier
                </button>

                <button
                    id="hint"
                    class="action">
                    Révéler une lettre
                </button>

                <button
                    id="previous"
                    class="action">
                    ← Précédent
                </button>

                <button
                    id="next"
                    class="action">
                    Suivant →
                </button>

            </div>


            <div
                id="message"
                class="message">
            </div>

        </section>


        <section class="panel side-card">

            <h2>Horizontal</h2>

            <div
                id="across"
                class="clues">
            </div>

        </section>


        <section class="panel side-card">

            <h2>Vertical</h2>

            <div
                id="down"
                class="clues">
            </div>

        </section>

    </aside>

</main>


<!--
    Champ caché utilisé uniquement pour
    récupérer le clavier natif du téléphone.
-->
<input
    id="mobileInput"
    class="mobile-input"
    type="text"
    inputmode="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="characters"
    spellcheck="false">


<!-- FIN -->

<div
    id="overlay"
    class="overlay">

    <div class="result">

        <h2>Grille terminée</h2>

        <div
            id="finalScore"
            class="result-score">
            0
        </div>

        <p id="finalText"></p>

        <button
            id="restart"
            class="restart">
            Nouvelle grille
        </button>

    </div>

</div>


<script type="module">

import { jeuxQuestions }
    from "./src/jeuxQuestions.js";


/* =====================================
   CONFIGURATION
===================================== */

const GRID_SIZE = 15;
const WORD_COUNT = 8;

const MAX_HINTS = 3;


/* =====================================
   ELEMENTS
===================================== */

const gridElement =
    document.getElementById("grid");

const mobileInput =
    document.getElementById("mobileInput");

const scoreElement =
    document.getElementById("score");

const solvedElement =
    document.getElementById("solved");

const totalElement =
    document.getElementById("total");

const hintsElement =
    document.getElementById("hints");

const clueTypeElement =
    document.getElementById("clueType");

const clueTextElement =
    document.getElementById("clueText");

const clueLengthElement =
    document.getElementById("clueLength");

const currentTextElement =
    document.getElementById("currentText");

const currentInfoElement =
    document.getElementById("currentInfo");

const acrossElement =
    document.getElementById("across");

const downElement =
    document.getElementById("down");

const messageElement =
    document.getElementById("message");

const overlay =
    document.getElementById("overlay");

const finalScoreElement =
    document.getElementById("finalScore");

const finalTextElement =
    document.getElementById("finalText");


/* =====================================
   ETAT
===================================== */

let score = 0;

let hints = MAX_HINTS;

let puzzleWords = [];

let cells = [];

let selectedWord = null;

let selectedRow = null;

let selectedCol = null;

let selectedIndex = 0;

let direction = "across";

let usedQuestions = new Set();


/* =====================================
   NORMALISATION
===================================== */

function normalize(value){

    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^A-Za-z]/g,"")
        .toUpperCase();

}


function shuffle(array){

    return [...array]
        .sort(() => Math.random() - 0.5);

}


/* =====================================
   QUESTIONS
===================================== */

function getQuestions(){

    let available =
        jeuxQuestions.filter(question => {

            const answer =
                normalize(question.answer);

            return (
                question.question &&
                answer.length >= 3 &&
                answer.length <= 10
            );

        });


    let unused =
        available.filter(
            question =>
                !usedQuestions.has(question.id)
        );


    if(unused.length < WORD_COUNT){

        usedQuestions.clear();

        unused = available;

    }


    return shuffle(unused)
        .slice(0,WORD_COUNT);

}


/* =====================================
   GRILLE VIDE
===================================== */

function createGrid(){

    cells = [];

    for(let row=0; row<GRID_SIZE; row++){

        const line = [];

        for(let col=0; col<GRID_SIZE; col++){

            line.push({

                letter:"",
                userLetter:"",
                number:null,

                across:null,
                down:null

            });

        }

        cells.push(line);

    }

}


/* =====================================
   TEST DE PLACEMENT
===================================== */

function canPlace(
    word,
    row,
    col,
    dir
){

    const length = word.length;

    if(dir === "across"){

        if(
            col < 0 ||
            col + length > GRID_SIZE
        ){

            return false;

        }

    }else{

        if(
            row < 0 ||
            row + length > GRID_SIZE
        ){

            return false;

        }

    }


    let crossings = 0;


    for(let i=0;i<length;i++){

        const r =
            dir === "across"
                ? row
                : row + i;

        const c =
            dir === "across"
                ? col + i
                : col;


        const cell =
            cells[r][c];


        /* Mauvaise lettre */

        if(
            cell.letter &&
            cell.letter !== word[i]
        ){

            return false;

        }


        if(
            cell.letter === word[i]
        ){

            crossings++;

        }


        /*
            Si la case est vide,
            les cases autour ne doivent
            pas créer un faux mot parallèle.
        */

        if(!cell.letter){

            if(dir === "across"){

                if(
                    r > 0 &&
                    cells[r-1][c].letter
                ){

                    return false;

                }

                if(
                    r < GRID_SIZE-1 &&
                    cells[r+1][c].letter
                ){

                    return false;

                }

            }else{

                if(
                    c > 0 &&
                    cells[r][c-1].letter
                ){

                    return false;

                }

                if(
                    c < GRID_SIZE-1 &&
                    cells[r][c+1].letter
                ){

                    return false;

                }

            }

        }

    }


    /* Cases juste avant / après */

    if(dir === "across"){

        if(
            col > 0 &&
            cells[row][col-1].letter
        ){

            return false;

        }

        if(
            col + length < GRID_SIZE &&
            cells[row][col+length].letter
        ){

            return false;

        }

    }else{

        if(
            row > 0 &&
            cells[row-1][col].letter
        ){

            return false;

        }

        if(
            row + length < GRID_SIZE &&
            cells[row+length][col].letter
        ){

            return false;

        }

    }


    /*
       Le premier mot peut être posé sans
       croisement. Les suivants doivent
       normalement croiser.
    */

    return puzzleWords.length === 0 || crossings > 0;

}


/* =====================================
   PLACER UN MOT
===================================== */

function placeWord(
    wordObject,
    row,
    col,
    dir
){

    const id =
        puzzleWords.length;


    const object = {

        id,

        answer:wordObject.answer,

        clue:wordObject.clue,

        category:wordObject.category,

        row,

        col,

        direction:dir,

        solved:false,

        revealed:new Set(),

        checked:new Set()

    };


    for(
        let i=0;
        i<object.answer.length;
        i++
    ){

        const r =
            dir === "across"
                ? row
                : row + i;

        const c =
            dir === "across"
                ? col + i
                : col;


        cells[r][c].letter =
            object.answer[i];


        if(dir === "across"){

            cells[r][c].across =
                id;

        }else{

            cells[r][c].down =
                id;

        }

    }


    puzzleWords.push(object);

}


/* =====================================
   GENERATION
===================================== */

function generatePuzzle(){

    let best = null;

    let bestCount = 0;


    /*
       Plusieurs essais.
       On conserve celui qui place
       le plus de mots.
    */

    for(let attempt=0; attempt<80; attempt++){

        createGrid();

        puzzleWords = [];


        const questions =
            getQuestions();


        /*
           Mettre le mot le plus long
           au centre.
        */

        const sorted =
            [...questions].sort(
                (a,b) =>
                    normalize(b.answer).length -
                    normalize(a.answer).length
            );


        if(!sorted.length)
            continue;


        const first =
            sorted[0];


        const firstAnswer =
            normalize(first.answer);


        const firstDir =
            Math.random() > .5
                ? "across"
                : "down";


        const firstRow =
            firstDir === "across"
                ? Math.floor(GRID_SIZE/2)
                : Math.floor(
                    GRID_SIZE/2 -
                    firstAnswer.length/2
                );


        const firstCol =
            firstDir === "across"
                ? Math.floor(
                    GRID_SIZE/2 -
                    firstAnswer.length/2
                )
                : Math.floor(GRID_SIZE/2);


        placeWord({

            answer:firstAnswer,
            clue:first.question,
            category:first.category

        },
        firstRow,
        firstCol,
        firstDir);


        /*
           Ajouter les autres mots.
        */

        for(
            let q=1;
            q<sorted.length;
            q++
        ){

            const question =
                sorted[q];


            const answer =
                normalize(question.answer);


            let candidates = [];


            /*
               Chercher toutes les intersections
               possibles avec les mots existants.
            */

            for(
                let existingIndex=0;
                existingIndex<puzzleWords.length;
                existingIndex++
            ){

                const existing =
                    puzzleWords[existingIndex];


                const newDir =
                    existing.direction === "across"
                        ? "down"
                        : "across";


                for(
                    let a=0;
                    a<answer.length;
                    a++
                ){

                    for(
                        let b=0;
                        b<existing.answer.length;
                        b++
                    ){

                        if(
                            answer[a] !==
                            existing.answer[b]
                        ){

                            continue;

                        }


                        let row;
                        let col;


                        if(newDir === "across"){

                            row =
                                existing.row + b;

                            col =
                                existing.col - a;

                        }else{

                            row =
                                existing.row - a;

                            col =
                                existing.col + b;

                        }


                        if(
                            canPlace(
                                answer,
                                row,
                                col,
                                newDir
                            )
                        ){

                            candidates.push({

                                row,
                                col,
                                direction:newDir

                            });

                        }

                    }

                }

            }


            if(candidates.length){

                const selected =
                    candidates[
                        Math.floor(
                            Math.random() *
                            candidates.length
                        )
                    ];


                placeWord({

                    answer,
                    clue:question.question,
                    category:question.category

                },
                selected.row,
                selected.col,
                selected.direction);

            }

        }


        if(
            puzzleWords.length >
            bestCount
        ){

            bestCount =
                puzzleWords.length;


            best = {

                cells:
                    cells.map(row =>
                        row.map(cell => ({
                            ...cell
                        }))
                    ),

                words:
                    puzzleWords.map(word => ({
                        ...word,
                        revealed:
                            new Set(),
                        checked:
                            new Set()
                    }))

            };

        }


        if(
            bestCount >=
            Math.min(WORD_COUNT,7)
        ){

            break;

        }

    }


    if(!best)
        return;


    cells = best.cells;

    puzzleWords = best.words;


    assignNumbers();

}


/* =====================================
   NUMEROTATION
===================================== */

function assignNumbers(){

    let number = 1;


    for(
        let row=0;
        row<GRID_SIZE;
        row++
    ){

        for(
            let col=0;
            col<GRID_SIZE;
            col++
        ){

            const cell =
                cells[row][col];


            if(!cell.letter)
                continue;


            const startsAcross =
                cell.across !== null &&
                (
                    col === 0 ||
                    !cells[row][col-1].letter
                );


            const startsDown =
                cell.down !== null &&
                (
                    row === 0 ||
                    !cells[row-1][col].letter
                );


            if(
                startsAcross ||
                startsDown
            ){

                cell.number =
                    number++;

            }

        }

    }

}


/* =====================================
   RENDU
===================================== */

function render(){

    gridElement.innerHTML = "";

    gridElement.style.gridTemplateColumns =
        `repeat(${GRID_SIZE},var(--cell))`;


    const fragment =
        document.createDocumentFragment();


    for(
        let row=0;
        row<GRID_SIZE;
        row++
    ){

        for(
            let col=0;
            col<GRID_SIZE;
            col++
        ){

            const data =
                cells[row][col];


            const button =
                document.createElement("button");


            button.type = "button";

            button.className = "cell";


            if(!data.letter){

                button.classList.add("black");

                fragment.appendChild(button);

                continue;

            }


            button.classList.add("playable");


            if(data.number){

                const number =
                    document.createElement("span");

                number.className = "number";

                number.textContent =
                    data.number;

                button.appendChild(number);

            }


            const letter =
                document.createElement("span");

            letter.className = "letter";


            /*
               IMPORTANT :
               on n'affiche jamais la solution.
               Seulement la lettre que le joueur
               a réellement entrée ou révélée.
            */

            letter.textContent =
                data.userLetter || "";


            button.appendChild(letter);


            button.dataset.row = row;
            button.dataset.col = col;


            button.addEventListener(
                "click",
                () =>
                    selectCell(row,col)
            );


            fragment.appendChild(button);

        }

    }


    gridElement.appendChild(fragment);

    highlight();

    updateStats();

}


/* =====================================
   SÉLECTION
===================================== */

function selectCell(row,col){

    const cell =
        cells[row][col];


    if(!cell.letter)
        return;


    /*
       Si on retouche la même case,
       on passe Horizontal ↔ Vertical.
    */

    if(
        selectedRow === row &&
        selectedCol === col
    ){

        const other =
            direction === "across"
                ? cell.down
                : cell.across;


        if(other !== null){

            direction =
                direction === "across"
                    ? "down"
                    : "across";

            selectedWord =
                other;

        }

    }else{

        selectedRow = row;

        selectedCol = col;


        if(
            direction === "across" &&
            cell.across !== null
        ){

            selectedWord =
                cell.across;

        }else if(
            cell.down !== null
        ){

            direction = "down";

            selectedWord =
                cell.down;

        }else if(
            cell.across !== null
        ){

            direction = "across";

            selectedWord =
                cell.across;

        }

    }


    const word =
        puzzleWords[selectedWord];


    if(!word)
        return;


    selectedIndex =
        getIndexInWord(
            word,
            row,
            col
        );


    showClue();

    highlight();

    focusMobileInput();

}


/* =====================================
   INDEX DANS MOT
===================================== */

function getIndexInWord(
    word,
    row,
    col
){

    if(word.direction === "across"){

        return col - word.col;

    }

    return row - word.row;

}


/* =====================================
   INDICE
===================================== */

function showClue(){

    if(selectedWord === null)
        return;


    const word =
        puzzleWords[selectedWord];


    clueTypeElement.textContent =
        `${word.direction === "across"
            ? "Horizontal"
            : "Vertical"} • ${getWordNumber(word)}`;


    clueTextElement.textContent =
        word.clue;


    clueLengthElement.textContent =
        `${word.answer.length} lettres`;


    currentTextElement.textContent =
        word.clue;


    currentInfoElement.textContent =
        `${word.answer.length} lettres • ${
            word.direction === "across"
                ? "Horizontal"
                : "Vertical"
        }`;

}


/* =====================================
   NUMERO MOT
===================================== */

function getWordNumber(word){

    const cell =
        cells[word.row][word.col];

    return cell.number || "";

}


/* =====================================
   HIGHLIGHT
===================================== */

function highlight(){

    const elements =
        gridElement.querySelectorAll(".cell");


    elements.forEach(element => {

        element.classList.remove(
            "word",
            "selected",
            "correct",
            "wrong",
            "revealed"
        );


        if(!element.dataset.row)
            return;


        const row =
            Number(element.dataset.row);

        const col =
            Number(element.dataset.col);


        const data =
            cells[row][col];


        if(
            selectedWord !== null
        ){

            const word =
                puzzleWords[selectedWord];


            const belongs =
                word.direction === "across"
                    ? (
                        row === word.row &&
                        col >= word.col &&
                        col <
                        word.col +
                        word.answer.length
                    )
                    : (
                        col === word.col &&
                        row >= word.row &&
                        row <
                        word.row +
                        word.answer.length
                    );


            if(belongs){

                element.classList.add("word");

            }

        }


        if(
            selectedRow === row &&
            selectedCol === col
        ){

            element.classList.add("selected");

        }


        /*
           Une case correcte n'est colorée
           que lorsque le joueur a déjà vérifié
           le mot.
        */

        const acrossId =
            data.across;

        const downId =
            data.down;


        const ids =
            [
                acrossId,
                downId
            ].filter(
                id => id !== null
            );


        if(
            ids.some(id =>
                puzzleWords[id]?.checked.has(
                    getIndexInWord(
                        puzzleWords[id],
                        row,
                        col
                    )
                )
            )
        ){

            const valid =
                ids.some(id => {

                    const word =
                        puzzleWords[id];

                    const index =
                        getIndexInWord(
                            word,
                            row,
                            col
                        );

                    return (
                        word.checked.has(index) &&
                        data.userLetter ===
                        data.letter
                    );

                });


            if(valid){

                element.classList.add("correct");

            }else{

                element.classList.add("wrong");

            }

        }

    });

}


/* =====================================
   FOCUS CLAVIER MOBILE
===================================== */

function focusMobileInput(){

    mobileInput.value = "";

    /*
       Le clavier natif s'ouvre ici.
    */

    mobileInput.focus({
        preventScroll:true
    });

}


/* =====================================
   ENTRÉE LETTRE
===================================== */

mobileInput.addEventListener(
    "input",
    event => {

        let value =
            normalize(mobileInput.value);


        if(!value)
            return;


        /*
           Si plusieurs caractères ont été
           collés, on utilise le dernier.
        */

        const letter =
            value[value.length - 1];


        enterLetter(letter);

        mobileInput.value = "";

    }
);


/* =====================================
   LETTRE
===================================== */

function enterLetter(letter){

    if(selectedWord === null)
        return;


    const word =
        puzzleWords[selectedWord];


    if(
        selectedIndex < 0 ||
        selectedIndex >= word.answer.length
    ){

        return;

    }


    const row =
        word.direction === "across"
            ? word.row
            : word.row + selectedIndex;


    const col =
        word.direction === "across"
            ? word.col + selectedIndex
            : word.col;


    cells[row][col].userLetter =
        letter;


    /*
       Avancer automatiquement.
    */

    if(
        selectedIndex <
        word.answer.length - 1
    ){

        selectedIndex++;

        selectedRow =
            word.direction === "across"
                ? row
                : row + 1;

        selectedCol =
            word.direction === "across"
                ? col + 1
                : col;

    }


    render();

    focusMobileInput();

}


/* =====================================
   CLAVIER
===================================== */

mobileInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Backspace"){

            event.preventDefault();

            deleteLetter();

            return;

        }


        if(event.key === "ArrowLeft"){

            event.preventDefault();

            moveCursor(-1,0);

        }


        if(event.key === "ArrowRight"){

            event.preventDefault();

            moveCursor(1,0);

        }


        if(event.key === "ArrowUp"){

            event.preventDefault();

            moveCursor(0,-1);

        }


        if(event.key === "ArrowDown"){

            event.preventDefault();

            moveCursor(0,1);

        }

    }
);


/* =====================================
   EFFACER
===================================== */

function deleteLetter(){

    if(selectedWord === null)
        return;


    const word =
        puzzleWords[selectedWord];


    const row =
        word.direction === "across"
            ? word.row
            : word.row + selectedIndex;


    const col =
        word.direction === "across"
            ? word.col + selectedIndex
            : word.col;


    if(
        cells[row][col].userLetter
    ){

        cells[row][col].userLetter = "";

    }else if(selectedIndex > 0){

        selectedIndex--;

        const previousRow =
            word.direction === "across"
                ? word.row
                : word.row + selectedIndex;

        const previousCol =
            word.direction === "across"
                ? word.col + selectedIndex
                : word.col;


        cells[previousRow][previousCol].userLetter =
            "";

        selectedRow =
            previousRow;

        selectedCol =
            previousCol;

    }


    render();

}


/* =====================================
   DÉPLACEMENT
===================================== */

function moveCursor(
    dx,
    dy
){

    if(
        selectedRow === null ||
        selectedCol === null
    ){

        return;

    }


    let row =
        selectedRow + dy;

    let col =
        selectedCol + dx;


    while(
        row >= 0 &&
        row < GRID_SIZE &&
        col >= 0 &&
        col < GRID_SIZE
    ){

        if(
            cells[row][col].letter
        ){

            selectCell(row,col);

            return;

        }


        row += dy;

        col += dx;

    }

}


/* =====================================
   VÉRIFICATION
===================================== */

function checkCurrentWord(){

    if(selectedWord === null){

        showMessage(
            "Sélectionne un mot.",
            "info"
        );

        return;

    }


    const word =
        puzzleWords[selectedWord];


    let complete = true;

    let correct = true;


    for(
        let i=0;
        i<word.answer.length;
        i++
    ){

        const row =
            word.direction === "across"
                ? word.row
                : word.row + i;

        const col =
            word.direction === "across"
                ? word.col + i
                : word.col;


        const user =
            cells[row][col].userLetter;


        if(!user){

            complete = false;

        }


        if(
            user &&
            user !== word.answer[i]
        ){

            correct = false;

        }


        word.checked.add(i);

    }


    if(!complete){

        showMessage(
            "Le mot n'est pas encore complet.",
            "info"
        );

        render();

        return;

    }


    if(correct){

        if(!word.solved){

            word.solved = true;

            score += 10;

        }


        showMessage(
            "+10 points — bonne réponse.",
            "good"
        );


        selectNextUnsolved();

    }else{

        score =
            Math.max(0,score - 2);


        showMessage(
            "Il y a une ou plusieurs lettres incorrectes. -2 points.",
            "bad"
        );

    }


    render();

    checkComplete();

}


/* =====================================
   PROCHAIN MOT
===================================== */

function selectNextUnsolved(){

    const next =
        puzzleWords.find(
            word => !word.solved
        );


    if(!next)
        return;


    selectedWord =
        next.id;

    direction =
        next.direction;

    selectedRow =
        next.row;

    selectedCol =
        next.col;

    selectedIndex = 0;


    showClue();

    focusMobileInput();

}


/* =====================================
   INDICE
===================================== */

function revealLetter(){

    if(hints <= 0){

        showMessage(
            "Tu n'as plus d'indice.",
            "bad"
        );

        return;

    }


    if(selectedWord === null){

        showMessage(
            "Sélectionne un mot.",
            "info"
        );

        return;

    }


    const word =
        puzzleWords[selectedWord];


    let position = -1;


    for(
        let i=0;
        i<word.answer.length;
        i++
    ){

        const row =
            word.direction === "across"
                ? word.row
                : word.row + i;

        const col =
            word.direction === "across"
                ? word.col + i
                : word.col;


        if(
            !cells[row][col].userLetter
        ){

            position = i;

            break;

        }

    }


    if(position === -1){

        showMessage(
            "Ce mot est déjà rempli.",
            "info"
        );

        return;

    }


    const row =
        word.direction === "across"
            ? word.row
            : word.row + position;

    const col =
        word.direction === "across"
            ? word.col + position
            : word.col;


    cells[row][col].userLetter =
        word.answer[position];


    word.revealed.add(position);


    hints--;

    score =
        Math.max(0,score - 2);


    selectedIndex =
        position;

    selectedRow =
        row;

    selectedCol =
        col;


    showMessage(
        "Une lettre a été révélée. -2 points.",
        "info"
    );


    render();

}


/* =====================================
   CLUE LISTE
===================================== */

function renderClues(){

    acrossElement.innerHTML = "";

    downElement.innerHTML = "";


    puzzleWords.forEach(word => {

        const button =
            document.createElement("button");


        button.type = "button";

        button.className =
            "clue-button";


        if(
            word.id === selectedWord
        ){

            button.classList.add("active");

        }


        if(word.solved){

            button.classList.add("done");

        }


        button.innerHTML = `
            <span class="clue-number">
                ${getWordNumber(word)}
            </span>

            <span class="clue-content">
                ${escapeHtml(word.clue)}
            </span>
        `;


        button.addEventListener(
            "click",
            () => {

                selectedWord =
                    word.id;

                direction =
                    word.direction;

                selectedRow =
                    word.row;

                selectedCol =
                    word.col;

                selectedIndex = 0;

                showClue();

                renderClues();

                highlight();

                focusMobileInput();

            }
        );


        if(
            word.direction === "across"
        ){

            acrossElement.appendChild(
                button
            );

        }else{

            downElement.appendChild(
                button
            );

        }

    });

}


/* =====================================
   HTML SAFE
===================================== */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    messageElement.textContent =
        text;

    messageElement.className =
        `message ${type}`;

}


/* =====================================
   STATS
===================================== */

function updateStats(){

    scoreElement.textContent =
        score;

    solvedElement.textContent =
        puzzleWords.filter(
            word => word.solved
        ).length;

    totalElement.textContent =
        puzzleWords.length;

    hintsElement.textContent =
        hints;

}


/* =====================================
   FIN
===================================== */

function checkComplete(){

    if(
        puzzleWords.length &&
        puzzleWords.every(
            word => word.solved
        )
    ){

        setTimeout(
            finishGame,
            400
        );

    }

}


function finishGame(){

    finalScoreElement.textContent =
        score;


    finalTextElement.textContent =
        `Tu as terminé la grille avec ${
            score
        } points. ${
            puzzleWords.length
        } mots ont été trouvés.`;


    overlay.classList.add("show");

}


/* =====================================
   BOUTONS PREVIOUS / NEXT
===================================== */

function changeWord(step){

    if(!puzzleWords.length)
        return;


    let index =
        selectedWord === null
            ? 0
            : selectedWord;


    /*
       Chercher seulement dans la même direction.
    */

    const sameDirection =
        puzzleWords.filter(
            word =>
                word.direction === direction
        );


    if(!sameDirection.length)
        return;


    const currentPosition =
        sameDirection.findIndex(
            word =>
                word.id === index
        );


    let newPosition =
        currentPosition + step;


    if(newPosition < 0){

        newPosition =
            sameDirection.length - 1;

    }


    if(
        newPosition >=
        sameDirection.length
    ){

        newPosition = 0;

    }


    const word =
        sameDirection[newPosition];


    selectedWord =
        word.id;

    direction =
        word.direction;

    selectedRow =
        word.row;

    selectedCol =
        word.col;

    selectedIndex = 0;


    showClue();

    renderClues();

    highlight();

    focusMobileInput();

}


document
    .getElementById("previous")
    .addEventListener(
        "click",
        () => changeWord(-1)
    );


document
    .getElementById("next")
    .addEventListener(
        "click",
        () => changeWord(1)
    );


document
    .getElementById("check")
    .addEventListener(
        "click",
        checkCurrentWord
    );


document
    .getElementById("hint")
    .addEventListener(
        "click",
        revealLetter
    );


document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            overlay.classList.remove(
                "show"
            );

            startGame();

        }
    );


/* =====================================
   LANCEMENT
===================================== */

function startGame(){

    score = 0;

    hints = MAX_HINTS;

    selectedWord = null;

    selectedRow = null;

    selectedCol = null;

    selectedIndex = 0;

    direction = "across";


    generatePuzzle();


    /*
       On vérifie qu'on n'a pas
       généré une grille vide.
    */

    if(!puzzleWords.length){

        showMessage(
            "Impossible de générer la grille.",
            "bad"
        );

        return;

    }


    render();

    renderClues();

    updateStats();


    selectNextUnsolved();

}


startGame();

</script>
