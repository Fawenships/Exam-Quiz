<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mots Croisés — ExamQuiz</title>

<style>
:root{
    --purple:#4b2481;
    --purple-dark:#24113f;
    --blue:#1764c0;
    --green:#16a085;
    --orange:#f39c12;
    --red:#e74c3c;

    --bg:#f5f6fa;
    --card:#ffffff;
    --text:#202124;
    --muted:#73777d;
    --border:#e1e4e8;

    --cell-size:42px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 10%, rgba(75,36,129,.08), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(23,100,192,.07), transparent 25%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

.header{
    width:min(1180px, calc(100% - 28px));
    margin:18px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.back-button{
    text-decoration:none;
    color:var(--purple-dark);
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 15px;
    font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
}

.logo{
    text-align:center;
    flex:1;
}

.logo small{
    display:block;
    color:var(--muted);
    font-size:11px;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.logo strong{
    font-size:21px;
    color:var(--purple-dark);
}

/* HUD */

.hud{
    width:min(1180px, calc(100% - 28px));
    margin:18px auto 0;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
}

.hud-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:13px 16px;
    box-shadow:0 5px 20px rgba(0,0,0,.045);
}

.hud-label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.8px;
}

.hud-value{
    margin-top:4px;
    font-size:21px;
    font-weight:800;
    color:var(--purple-dark);
}

/* MAIN */

.game{
    width:min(1180px, calc(100% - 28px));
    margin:16px auto 40px;

    display:grid;
    grid-template-columns:minmax(0, 1.2fr) minmax(320px, .8fr);
    gap:18px;
}

/* GRID PANEL */

.grid-panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
    min-width:0;
}

.panel-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.panel-title h1{
    font-size:24px;
    color:var(--purple-dark);
}

.panel-title span{
    color:var(--muted);
    font-size:13px;
}

.crossword-wrapper{
    width:100%;
    overflow:auto;
    padding:8px 4px 15px;
    display:flex;
    justify-content:center;
}

.crossword{
    display:grid;
    gap:2px;
    background:#161616;
    padding:2px;
    border-radius:7px;
    flex:none;
}

.cell{
    width:var(--cell-size);
    height:var(--cell-size);

    position:relative;

    background:#fff;
    border:0;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:800;
    text-transform:uppercase;

    color:#202124;
}

.cell.black{
    background:#191919;
}

.cell.playable{
    cursor:pointer;
}

.cell.playable:hover{
    background:#f0ebfa;
}

.cell.selected{
    background:#dcd0f3;
}

.cell.word-selected{
    background:#f0ebfa;
}

.cell.correct{
    background:#dff6ed;
    color:#117a58;
}

.cell.incorrect{
    background:#fde3e0;
    color:#c0392b;
}

.cell-number{
    position:absolute;
    top:2px;
    left:3px;

    font-size:9px;
    font-weight:700;

    color:#555;
}

.cell-letter{
    margin-top:5px;
}

/* CLUES */

.clues-panel{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.clues-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.clues-card h2{
    color:var(--purple-dark);
    font-size:18px;
    margin-bottom:12px;
}

.clue-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.clue{
    width:100%;
    border:1px solid var(--border);
    background:#fafafa;

    border-radius:11px;

    padding:11px 12px;

    text-align:left;

    display:flex;
    gap:9px;
    align-items:flex-start;

    color:var(--text);
}

.clue:hover{
    border-color:#b9a8d8;
    background:#f8f4fc;
}

.clue.active{
    border-color:var(--purple);
    background:#f1ebfa;
}

.clue.done{
    border-color:#8ed7bd;
    background:#effbf6;
}

.clue-number{
    min-width:25px;
    height:25px;

    border-radius:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--purple-dark);
    color:white;

    font-size:12px;
    font-weight:800;
}

.clue.done .clue-number{
    background:var(--green);
}

.clue-text{
    font-size:13px;
    line-height:1.35;
}

/* ACTIVE CLUE */

.active-clue{
    background:linear-gradient(135deg,#24113f,#4b2481);
    color:white;
    border-radius:17px;
    padding:16px;
}

.active-clue-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:.7;
}

.active-clue-text{
    margin-top:6px;
    font-size:16px;
    line-height:1.4;
    font-weight:700;
}

.answer-info{
    margin-top:8px;
    font-size:12px;
    opacity:.8;
}

/* INPUT */

.answer-box{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.answer-input{
    min-width:0;
    flex:1;

    border:2px solid var(--border);
    border-radius:11px;

    padding:12px;

    outline:none;

    text-transform:uppercase;
    font-weight:700;
}

.answer-input:focus{
    border-color:var(--purple);
}

.check-button{
    border:0;
    border-radius:11px;

    padding:0 18px;

    background:var(--purple);
    color:#fff;

    font-weight:800;
}

.check-button:hover{
    background:var(--purple-dark);
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.control-button{
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);

    border-radius:10px;

    padding:11px;

    font-weight:700;
}

.control-button:hover{
    background:#f6f6f6;
}

.control-button.hint{
    color:var(--orange);
}

.control-button.skip{
    color:var(--blue);
}

/* MESSAGE */

.message{
    min-height:20px;
    margin-top:10px;

    font-size:13px;
    font-weight:700;
}

.message.success{
    color:#13805c;
}

.message.error{
    color:#c0392b;
}

.message.info{
    color:var(--blue);
}

/* PROGRESS */

.progress-section{
    margin-top:14px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-bottom:7px;
}

.progress{
    height:9px;
    background:#eceef2;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--purple),var(--blue));
    transition:width .3s ease;
}

/* COMPLETION */

.complete{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(25,15,40,.58);

    z-index:100;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.complete.show{
    display:flex;
}

.complete-card{
    width:min(440px,100%);

    background:#fff;

    border-radius:24px;

    padding:30px;

    text-align:center;

    box-shadow:0 20px 70px rgba(0,0,0,.25);
}

.complete-card h2{
    color:var(--purple-dark);
    font-size:28px;
}

.final-score{
    font-size:48px;
    font-weight:900;
    color:var(--purple);
    margin:13px 0;
}

.final-detail{
    color:var(--muted);
    line-height:1.5;
}

.restart{
    width:100%;
    margin-top:20px;

    border:0;
    border-radius:12px;

    padding:14px;

    background:var(--purple);
    color:white;

    font-weight:800;
}

/* ANIMATIONS */

@keyframes correctFlash{
    0%{transform:scale(1)}
    45%{transform:scale(1.07)}
    100%{transform:scale(1)}
}

@keyframes wrongShake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}
}

.flash-correct{
    animation:correctFlash .35s ease;
}

.flash-wrong{
    animation:wrongShake .3s ease;
}

/* MOBILE */

@media(max-width:850px){

    .game{
        grid-template-columns:1fr;
    }

    .clues-panel{
        order:2;
    }

    .grid-panel{
        order:1;
    }
}

@media(max-width:600px){

    :root{
        --cell-size:35px;
    }

    .header{
        margin-top:10px;
        width:calc(100% - 18px);
    }

    .back-button{
        padding:9px 10px;
        font-size:12px;
    }

    .logo small{
        font-size:8px;
    }

    .logo strong{
        font-size:17px;
    }

    .hud{
        width:calc(100% - 18px);
        margin-top:10px;
        gap:7px;
    }

    .hud-card{
        padding:10px;
        border-radius:11px;
    }

    .hud-label{
        font-size:9px;
    }

    .hud-value{
        font-size:17px;
    }

    .game{
        width:calc(100% - 18px);
        margin-top:10px;
        gap:10px;
    }

    .grid-panel,
    .clues-card{
        border-radius:15px;
        padding:12px;
    }

    .panel-title h1{
        font-size:19px;
    }

    .panel-title span{
        font-size:11px;
    }

    .cell{
        font-size:16px;
    }

    .cell-number{
        font-size:7px;
    }

    .cell-letter{
        margin-top:4px;
    }

    .active-clue{
        border-radius:13px;
        padding:13px;
    }

    .active-clue-text{
        font-size:14px;
    }

    .answer-box{
        flex-direction:column;
    }

    .check-button{
        padding:12px;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:360px){

    :root{
        --cell-size:31px;
    }

    .cell{
        font-size:14px;
    }
}
</style>
</head>

<body>

<script type="module">

import { jeuxQuestions } from "./src/jeuxQuestions.js";


/* ==============================
   CONFIGURATION
============================== */

const WORDS_PER_GAME = 10;
const GRID_SIZE = 21;
const MAX_ATTEMPTS = 2;


/* ==============================
   ELEMENTS
============================== */

const crosswordEl = document.getElementById("crossword");

const scoreEl = document.getElementById("score");
const solvedEl = document.getElementById("solved");
const totalWordsEl = document.getElementById("totalWords");
const hintsEl = document.getElementById("hints");

const activeClueEl = document.getElementById("activeClue");
const answerInfoEl = document.getElementById("answerInfo");
const answerInput = document.getElementById("answerInput");

const checkButton = document.getElementById("checkButton");
const hintButton = document.getElementById("hintButton");
const skipButton = document.getElementById("skipButton");

const messageEl = document.getElementById("message");

const acrossCluesEl = document.getElementById("acrossClues");
const downCluesEl = document.getElementById("downClues");

const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const categoryLabel = document.getElementById("categoryLabel");

const completeEl = document.getElementById("complete");
const finalScoreEl = document.getElementById("finalScore");
const finalDetailEl = document.getElementById("finalDetail");
const restartButton = document.getElementById("restartButton");


/* ==============================
   ÉTAT
============================== */

let score = 0;
let hints = 3;

let words = [];

let grid = [];

let placedWords = [];

let selectedWord = null;
let selectedDirection = null;
let selectedCell = null;

let solvedWords = new Set();

let usedQuestionIds = new Set();


/* ==============================
   OUTILS
============================== */

function normalizeWord(value){

    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^A-Za-z]/g,"")
        .toUpperCase();

}


function shuffle(array){

    return [...array].sort(() => Math.random() - .5);

}


function randomItem(array){

    return array[Math.floor(Math.random() * array.length)];

}


/* ==============================
   QUESTIONS
============================== */

function getQuestions(){

    let available = jeuxQuestions.filter(q => {

        const answer = normalizeWord(q.answer);

        return answer.length >= 3 &&
               answer.length <= 12 &&
               q.question &&
               q.answer;

    });


    let unused = available.filter(q =>
        !usedQuestionIds.has(q.id)
    );


    if(unused.length < WORDS_PER_GAME){

        usedQuestionIds.clear();

        unused = available;

    }


    const selected = shuffle(unused)
        .slice(0, WORDS_PER_GAME);


    selected.forEach(q =>
        usedQuestionIds.add(q.id)
    );


    return selected;

}


/* ==============================
   GRILLE VIDE
============================== */

function createEmptyGrid(){

    grid = [];

    for(let y = 0; y < GRID_SIZE; y++){

        const row = [];

        for(let x = 0; x < GRID_SIZE; x++){

            row.push({
                letter:"",
                number:null,
                wordIds:[]
            });

        }

        grid.push(row);

    }

}


/* ==============================
   TEST PLACEMENT
============================== */

function canPlace(word, row, col, direction){

    const len = word.length;

    if(direction === "across"){

        if(col < 0 || col + len > GRID_SIZE)
            return false;

    }else{

        if(row < 0 || row + len > GRID_SIZE)
            return false;

    }


    let crossings = 0;


    for(let i = 0; i < len; i++){

        const r =
            direction === "across"
                ? row
                : row + i;

        const c =
            direction === "across"
                ? col + i
                : col;


        const current = grid[r][c];

        if(current.letter &&
           current.letter !== word[i]){

            return false;

        }

        if(current.letter === word[i]){

            crossings++;

        }


        /* Empêcher les mots de se coller
           parallèlement sans croisement */

        if(!current.letter){

            if(direction === "across"){

                if(r > 0 && grid[r-1][c].letter)
                    return false;

                if(r < GRID_SIZE-1 && grid[r+1][c].letter)
                    return false;

            }else{

                if(c > 0 && grid[r][c-1].letter)
                    return false;

                if(c < GRID_SIZE-1 && grid[r][c+1].letter)
                    return false;

            }

        }

    }


    /* Vérification avant/après du mot */

    if(direction === "across"){

        if(col > 0 && grid[row][col-1].letter)
            return false;

        if(col + len < GRID_SIZE &&
           grid[row][col+len].letter)
            return false;

    }else{

        if(row > 0 && grid[row-1][col].letter)
            return false;

        if(row + len < GRID_SIZE &&
           grid[row+len][col].letter)
            return false;

    }


    return crossings > 0;

}


/* ==============================
   PLACEMENT
============================== */

function placeWord(wordObj, row, col, direction){

    const id = placedWords.length;

    const startRow = row;
    const startCol = col;

    wordObj.id = id;
    wordObj.row = row;
    wordObj.col = col;
    wordObj.direction = direction;

    for(let i = 0; i < wordObj.answer.length; i++){

        const r =
            direction === "across"
                ? row
                : row + i;

        const c =
            direction === "across"
                ? col + i
                : col;


        grid[r][c].letter = wordObj.answer[i];

        if(!grid[r][c].wordIds.includes(id)){

            grid[r][c].wordIds.push(id);

        }

    }


    placedWords.push({
        ...wordObj,
        startRow,
        startCol
    });

}


/* ==============================
   CONSTRUIRE LA GRILLE
============================== */

function buildCrossword(){

    createEmptyGrid();

    placedWords = [];


    const sorted = [...words]
        .sort((a,b) =>
            b.answer.length - a.answer.length
        );


    if(!sorted.length)
        return;


    /* Premier mot au centre */

    const first = sorted[0];

    const firstDirection =
        Math.random() > .5
            ? "across"
            : "down";


    const firstRow =
        Math.floor(GRID_SIZE / 2);

    const firstCol =
        Math.floor(
            GRID_SIZE / 2 -
            first.answer.length / 2
        );


    placeWord(
        first,
        firstDirection === "across"
            ? firstRow
            : firstRow - Math.floor(first.answer.length / 2),

        firstDirection === "across"
            ? firstCol
            : firstCol
    );


    /* Les autres mots */

    for(let index = 1; index < sorted.length; index++){

        const wordObj = sorted[index];

        let placed = false;


        /* Chercher des croisements */

        for(let p = 0; p < 2000 && !placed; p++){

            const existing =
                randomItem(placedWords);


            const direction =
                existing.direction === "across"
                    ? "down"
                    : "across";


            for(
                let i = 0;
                i < wordObj.answer.length && !placed;
                i++
            ){

                for(
                    let j = 0;
                    j < existing.answer.length && !placed;
                    j++
                ){

                    if(
                        wordObj.answer[i] !==
                        existing.answer[j]
                    ){
                        continue;
                    }


                    let row;
                    let col;


                    if(direction === "across"){

                        row =
                            existing.row + j;

                        col =
                            existing.col - i;

                    }else{

                        row =
                            existing.row - i;

                        col =
                            existing.col + j;

                    }


                    if(
                        canPlace(
                            wordObj.answer,
                            row,
                            col,
                            direction
                        )
                    ){

                        placeWord(
                            wordObj,
                            row,
                            col,
                            direction
                        );

                        placed = true;

                    }

                }

            }

        }


        /* Si aucun croisement,
           essayer plusieurs positions */

        if(!placed){

            for(
                let row = 0;
                row < GRID_SIZE && !placed;
                row++
            ){

                for(
                    let col = 0;
                    col < GRID_SIZE && !placed;
                    col++
                ){

                    for(
                        const direction of
                        ["across","down"]
                    ){

                        if(
                            canPlace(
                                wordObj.answer,
                                row,
                                col,
                                direction
                            )
                        ){

                            placeWord(
                                wordObj,
                                row,
                                col,
                                direction
                            );

                            placed = true;

                            break;

                        }

                    }

                }

            }

        }

    }


    /* Numéros */

    let number = 1;

    for(let y = 0; y < GRID_SIZE; y++){

        for(let x = 0; x < GRID_SIZE; x++){

            const cell = grid[y][x];

            if(!cell.letter)
                continue;


            const startsAcross =
                cell.wordIds.some(id => {

                    const word = placedWords[id];

                    return word.direction === "across" &&
                        word.row === y &&
                        word.col === x;

                });


            const startsDown =
                cell.wordIds.some(id => {

                    const word = placedWords[id];

                    return word.direction === "down" &&
                        word.row === y &&
                        word.col === x;

                });


            if(startsAcross || startsDown){

                cell.number = number++;

            }

        }

    }

}


/* ==============================
   RENDU GRILLE
============================== */

function renderGrid(){

    crosswordEl.innerHTML = "";

    crosswordEl.style.gridTemplateColumns =
        `repeat(${GRID_SIZE}, var(--cell-size))`;


    for(let y = 0; y < GRID_SIZE; y++){

        for(let x = 0; x < GRID_SIZE; x++){

            const cellData = grid[y][x];

            const cell =
                document.createElement("button");

            cell.type = "button";

            cell.className = "cell";


            if(!cellData.letter){

                cell.classList.add("black");

            }else{

                cell.classList.add("playable");

                if(cellData.number){

                    const number =
                        document.createElement("span");

                    number.className =
                        "cell-number";

                    number.textContent =
                        cellData.number;

                    cell.appendChild(number);

                }


                const letter =
                    document.createElement("span");

                letter.className =
                    "cell-letter";


                if(
                    solvedWords.size &&
                    cellData.wordIds.some(id =>
                        solvedWords.has(id)
                    )
                ){

                    letter.textContent =
                        cellData.letter;

                }else{

                    const userLetter =
                        cellData.userLetter || "";

                    letter.textContent =
                        userLetter;

                }


                cell.appendChild(letter);


                cell.addEventListener(
                    "click",
                    () => selectCell(y,x)
                );

            }


            crosswordEl.appendChild(cell);

        }

    }


    highlightSelection();

}


/* ==============================
   SÉLECTION
============================== */

function selectCell(row,col){

    const cell = grid[row][col];

    if(!cell.letter)
        return;


    selectedCell = {
        row,
        col
    };


    let possibleWords =
        cell.wordIds.filter(id =>
            !solvedWords.has(id)
        );


    if(!possibleWords.length){

        possibleWords = cell.wordIds;

    }


    if(
        selectedWord === null ||
        !possibleWords.includes(selectedWord)
    ){

        selectedWord =
            possibleWords[0];

    }


    const word =
        placedWords[selectedWord];


    if(word){

        selectedDirection =
            word.direction;

        showActiveClue(word);

    }


    highlightSelection();

}


/* ==============================
   HIGHLIGHT
============================== */

function highlightSelection(){

    const cells =
        crosswordEl.querySelectorAll(".cell");


    cells.forEach((cell,index) => {

        cell.classList.remove(
            "selected",
            "word-selected"
        );


        const row =
            Math.floor(index / GRID_SIZE);

        const col =
            index % GRID_SIZE;


        if(!grid[row][col].letter)
            return;


        const cellWordIds =
            grid[row][col].wordIds;


        if(
            selectedWord !== null &&
            cellWordIds.includes(selectedWord)
        ){

            cell.classList.add("word-selected");

        }


        if(
            selectedCell &&
            selectedCell.row === row &&
            selectedCell.col === col
        ){

            cell.classList.add("selected");

        }

    });

}


/* ==============================
   INDICE ACTIF
============================== */

function showActiveClue(word){

    if(!word)
        return;


    activeClueEl.textContent =
        word.question;


    answerInfoEl.textContent =
        `${word.answer.length} lettres • ${
            word.direction === "across"
                ? "Horizontal"
                : "Vertical"
        }`;


    answerInput.value = "";

    answerInput.focus();

}


/* ==============================
   LISTE INDICES
============================== */

function renderClues(){

    acrossCluesEl.innerHTML = "";
    downCluesEl.innerHTML = "";


    placedWords.forEach(word => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "clue";


        if(solvedWords.has(word.id)){

            button.classList.add("done");

        }


        const number =
            grid[word.row][word.col].number;


        button.innerHTML = `
            <span class="clue-number">
                ${number || "?"}
            </span>
            <span class="clue-text">
                ${escapeHtml(word.question)}
            </span>
        `;


        button.addEventListener(
            "click",
            () => {

                selectedWord = word.id;

                selectedDirection =
                    word.direction;

                selectedCell = {
                    row:word.row,
                    col:word.col
                };

                showActiveClue(word);

                highlightSelection();

            }
        );


        if(word.direction === "across"){

            acrossCluesEl.appendChild(button);

        }else{

            downCluesEl.appendChild(button);

        }

    });

}


/* ==============================
   ÉCHAPPEMENT HTML
============================== */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ==============================
   VÉRIFIER MOT
============================== */

function checkAnswer(){

    if(selectedWord === null){

        showMessage(
            "Sélectionne d'abord un mot.",
            "info"
        );

        return;

    }


    const word =
        placedWords[selectedWord];


    if(!word)
        return;


    const value =
        normalizeWord(answerInput.value);


    if(!value){

        showMessage(
            "Écris une réponse.",
            "info"
        );

        return;

    }


    if(value === word.answer){

        solveWord(word);

    }else{

        showMessage(
            "Ce n'est pas le bon mot.",
            "error"
        );

        crosswordEl.classList.remove(
            "flash-wrong"
        );

        void crosswordEl.offsetWidth;

        crosswordEl.classList.add(
            "flash-wrong"
        );

    }

}


/* ==============================
   RÉSOUDRE
============================== */

function solveWord(word){

    if(solvedWords.has(word.id))
        return;


    solvedWords.add(word.id);


    word.answer.split("").forEach(
        (letter,index) => {

            const row =
                word.direction === "across"
                    ? word.row
                    : word.row + index;

            const col =
                word.direction === "across"
                    ? word.col + index
                    : word.col;


            grid[row][col].userLetter =
                letter;

        }
    );


    score += 10;

    updateHud();

    renderGrid();

    renderClues();


    showMessage(
        "+10 points — bonne réponse !",
        "success"
    );


    answerInput.value = "";


    crosswordEl.classList.remove(
        "flash-correct"
    );

    void crosswordEl.offsetWidth;

    crosswordEl.classList.add(
        "flash-correct"
    );


    if(solvedWords.size === placedWords.length){

        setTimeout(
            finishGame,
            500
        );

    }else{

        selectNextWord();

    }

}


/* ==============================
   MOT SUIVANT
============================== */

function selectNextWord(){

    const next =
        placedWords.find(
            word => !solvedWords.has(word.id)
        );


    if(!next)
        return;


    selectedWord = next.id;

    selectedDirection =
        next.direction;

    selectedCell = {
        row:next.row,
        col:next.col
    };


    showActiveClue(next);

    highlightSelection();

}


/* ==============================
   INDICE LETTRE
============================== */

function revealLetter(){

    if(hints <= 0){

        showMessage(
            "Tu n'as plus d'indice.",
            "error"
        );

        return;

    }


    if(selectedWord === null){

        showMessage(
            "Sélectionne un mot.",
            "info"
        );

        return;

    }


    const word =
        placedWords[selectedWord];


    const emptyPositions = [];


    for(
        let i = 0;
        i < word.answer.length;
        i++
    ){

        const row =
            word.direction === "across"
                ? word.row
                : word.row + i;

        const col =
            word.direction === "across"
                ? word.col + i
                : word.col;


        if(
            !grid[row][col].userLetter
        ){

            emptyPositions.push({
                row,
                col,
                letter:word.answer[i]
            });

        }

    }


    if(!emptyPositions.length){

        showMessage(
            "Cette lettre est déjà remplie.",
            "info"
        );

        return;

    }


    const position =
        randomItem(emptyPositions);


    grid[position.row][position.col].userLetter =
        position.letter;


    hints--;

    score = Math.max(0,score - 2);


    updateHud();

    renderGrid();


    showMessage(
        "Une lettre a été révélée. -2 points.",
        "info"
    );

}


/* ==============================
   AFFICHER INDICE
============================== */

function showFullHint(){

    if(selectedWord === null)
        return;


    const word =
        placedWords[selectedWord];


    showMessage(
        `Le mot contient ${word.answer.length} lettres.`,
        "info"
    );

}


/* ==============================
   MESSAGE
============================== */

function showMessage(text,type){

    messageEl.textContent = text;

    messageEl.className =
        `message ${type}`;

}


/* ==============================
   HUD
============================== */

function updateHud(){

    scoreEl.textContent = score;

    solvedEl.textContent =
        solvedWords.size;

    totalWordsEl.textContent =
        placedWords.length;

    hintsEl.textContent =
        hints;


    const percent =
        placedWords.length
            ? Math.round(
                solvedWords.size /
                placedWords.length *
                100
            )
            : 0;


    progressBar.style.width =
        `${percent}%`;

    progressText.textContent =
        `${percent}%`;

}


/* ==============================
   FIN
============================== */

function finishGame(){

    finalScoreEl.textContent =
        score;


    finalDetailEl.innerHTML =
        `Tu as trouvé <strong>${
            solvedWords.size
        }</strong> mots sur <strong>${
            placedWords.length
        }</strong>.<br><br>
        Chaque bonne réponse vaut 10 points.
        Une lettre révélée coûte 2 points.`;


    completeEl.classList.add("show");

}


/* ==============================
   NOUVELLE PARTIE
============================== */

function startGame(){

    completeEl.classList.remove("show");

    score = 0;

    hints = 3;

    solvedWords.clear();

    selectedWord = null;

    selectedDirection = null;

    selectedCell = null;


    words =
        getQuestions().map(q => ({
            id:q.id,
            question:q.question,
            answer:normalizeWord(q.answer),
            category:q.category || "Révision"
        }));


    if(!words.length){

        showMessage(
            "Impossible de charger les questions.",
            "error"
        );

        return;

    }


    categoryLabel.textContent =
        words[0].category || "Révision";


    buildCrossword();

    renderGrid();

    renderClues();

    updateHud();


    if(placedWords.length){

        selectNextWord();

    }

}


/* ==============================
   CLAVIER
============================== */

answerInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            checkAnswer();

        }

    }
);


/* ==============================
   BOUTONS
============================== */

checkButton.addEventListener(
    "click",
    checkAnswer
);

hintButton.addEventListener(
    "click",
    revealLetter
);

skipButton.addEventListener(
    "click",
    showFullHint
);

restartButton.addEventListener(
    "click",
    startGame
);


/* ==============================
   LANCEMENT
============================== */

startGame();

</script>

</body>
</html>
