/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {
    display: inline-flex;

    align-items: center;
    gap: 8px;

    text-decoration: none;

    color: white;

    background:
        rgba(255,255,255,.1);

    border:

    backdrop-filter: blur(12px);

    padding: 11px 16px;

    border-radius: 14px;

    font-size: 14px;
    font-weight: 800;

    transition:

        background .2s ease;
}

.back-button:hover {
    background:

    transform:

}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: center;

    gap: 12px;

    margin-bottom: 14px;
}


.stat {

    position: relative;

    overflow: hidden;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid rgba(255,255,255,.18);

    backdrop-filter: blur(16px);

    border-radius: 18px;

    padding: 12px 16px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.18);
}

.stat::after {

    content: "";

    position: absolute;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);

    top: -30px;
    right: -20px;
}

.stat-label {

    display: block;

    color:
        rgba(255,255,255,.65);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 3px;
}

.stat-value {

    font-size: 22px;

    font-weight: 900;

    color: white;

    text-shadow:
        0 2px 12px rgba(255,255,255,.2);
}


.header-center {

    text-align: center;

    min-width: 230px;
}

.header-center h1 {

    font-size:
        clamp(24px, 5vw, 36px);

    font-weight: 1000;

    letter-spacing: -1px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #7de7ff,
            #ff83d0,
            #ffffff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s linear infinite;
}

@keyframes titleGradient {

    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 250% center;
    }
}

.header-center p {

    color:
        rgba(255,255,255,.65);

    font-size: 12px;

    margin-top: 3px;
}


/* =========================================================
   PROGRESSION
========================================================= */

.progress-container {

    background:
        rgba(255,255,255,.09);

    border:
        1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(15px);

    border-radius: 18px;

    padding: 12px 15px;

    margin-bottom: 15px;
}

.progress-info {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    font-size: 12px;

    margin-bottom: 8px;

    color:
        rgba(255,255,255,.7);
}

.progress-bar {

    width: 100%;

    height: 10px;

    background:
        rgba(255,255,255,.1);

    border-radius: 999px;

    overflow: hidden;
}

.progress-fill {

    height: 100%;

    width: 0%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            #ff2f92,
            #8b5cff,
            #00d9ff
        );

    box-shadow:
        0 0 18px rgba(0,210,255,.7);

    transition:
        width .35s ease;
}


/* =========================================================
   QUESTION
========================================================= */

.question-card {

    position: relative;

    overflow: hidden;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid rgba(255,255,255,.2);

    backdrop-filter: blur(18px);

    border-radius: 26px;

    padding:
        clamp(22px, 5vw, 42px);

    text-align: center;

    margin-bottom: 10px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.2);
}

.question-card::before {

    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(0,217,255,.15);

    filter: blur(25px);

    top: -80px;
    right: -60px;
}

.question-card::after {

    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background:
        rgba(255,40,150,.13);

    filter: blur(25px);

    bottom: -70px;
    left: -60px;
}

.question-number {

    position: relative;

    z-index: 1;

    color:
        #7de7ff;

    font-weight: 900;

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 13px;
}

.question {

    position: relative;

    z-index: 1;

    font-size:
        clamp(21px, 4.5vw, 32px);

    line-height: 1.3;

    font-weight: 900;

    color: white;

    text-shadow:
        0 3px 15px rgba(0,0,0,.25);
}


/* =========================================================
   ARROWS AREA
========================================================= */

.arrows-area {

    position: relative;

    width:
        min(100%, 600px);

    height: 400px;

    margin: 0 auto 10px;

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    grid-template-rows:
        1fr 1fr 1fr;

    gap: 12px;

    align-items: center;

    justify-items: center;
}


/* =========================================================
   ARROW BUTTON
========================================================= */

.arrow-button {

    position: relative;

    width:
        clamp(94px, 22vw, 145px);

    height:
        clamp(94px, 22vw, 145px);

    border: none;

    border-radius: 30px;

    cursor: pointer;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    overflow: hidden;

    touch-action: manipulation;

    transition:
        transform .14s ease,
        filter .14s ease;

    box-shadow:
        0 10px 0 rgba(0,0,0,.22),
        0 18px 35px rgba(0,0,0,.25);
}


/* lumière interne */

.arrow-button::before {

    content: "";

    position: absolute;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.22);

    filter: blur(18px);

    top: -35px;
    left: -25px;
}

.arrow-button::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.24),
            transparent 45%
        );

    pointer-events: none;
}

.arrow-button:hover:not(:disabled) {

    transform:
        translateY(-7px)
        scale(1.04);

    filter:
        brightness(1.12);
}

.arrow-button:active:not(:disabled) {

    transform:
        translateY(5px)
        scale(.96);

    box-shadow:
        0 4px 0 rgba(0,0,0,.22),
        0 8px 18px rgba(0,0,0,.2);
}


/* =========================================================
   COULEURS DES FLÈCHES
========================================================= */

/* HAUT — ROSE */

.arrow-up {

    grid-column: 2;
    grid-row: 1;

    background:
        linear-gradient(
            145deg,
            #ff3d9a,
            #c90070
        );

    box-shadow:
        0 10px 0 #8d0050,
        0 18px 35px rgba(255,0,130,.35);
}


/* GAUCHE — BLEU */

.arrow-left {

    grid-column: 1;
    grid-row: 2;

    background:
        linear-gradient(
            145deg,
            #29d9ff,
            #0874df
        );

    box-shadow:
        0 10px 0 #0552a3,
        0 18px 35px rgba(0,170,255,.35);
}


/* DROITE — VERT */

.arrow-right {

    grid-column: 3;
    grid-row: 2;

    background:
        linear-gradient(
            145deg,
            #55ef91,
            #0aa957
        );

    box-shadow:
        0 10px 0 #08783e,
        0 18px 35px rgba(0,220,100,.35);
}


/* BAS — ORANGE */

.arrow-down {

    grid-column: 2;
    grid-row: 3;

    background:
        linear-gradient(
            145deg,
            #ffc94d,
            #f07819
        );

    box-shadow:
        0 10px 0 #ad4e0c,
        0 18px 35px rgba(255,150,0,.35);
}


/* =========================================================
   ARROW TEXT
========================================================= */

.arrow-symbol {

    position: relative;

    z-index: 2;

    font-size:
        clamp(44px, 10vw, 70px);

    line-height: .8;

    font-weight: 1000;

    text-shadow:
        0 4px 8px rgba(0,0,0,.2);
}

.arrow-answer {

    position: relative;

    z-index: 2;

    font-size:
        clamp(11px, 2.7vw, 15px);

    font-weight: 900;

    max-width: 88%;

    line-height: 1.15;

    text-align: center;

    word-break: break-word;

    text-shadow:
        0 2px 5px rgba(0,0,0,.18);
}


/* =========================================================
   CENTRE
========================================================= */

.arrow-center {

    grid-column: 2;
    grid-row: 2;

    width: 112px;
    height: 112px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #6c3cff,
            #32128e
        );

    border:
        4px solid
        rgba(255,255,255,.25);

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    box-shadow:
        0 0 0 8px
        rgba(125,70,255,.12),

        0 0 35px
        rgba(130,70,255,.55),

        inset 0 0 25px
        rgba(255,255,255,.12);

    animation:
        centerPulse 2.2s ease-in-out infinite;
}

@keyframes centerPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.center-icon {

    font-size: 32px;

    font-weight: 1000;
}

.center-text {

    font-size: 9px;

    color:
        rgba(255,255,255,.7);

    text-transform: uppercase;

    letter-spacing: 1.5px;

    font-weight: 800;
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback {

    min-height: 52px;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid rgba(255,255,255,.16);

    backdrop-filter: blur(14px);

    border-radius: 16px;

    padding: 13px 18px;

    text-align: center;

    font-weight: 800;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 10px;

    color:
        rgba(255,255,255,.8);
}

.feedback.correct {

    background:
        rgba(20,220,100,.17);

    border-color:
        rgba(70,255,140,.5);

    color:
        #6dffa1;

    box-shadow:
        0 0 25px
        rgba(30,255,120,.15);
}

.feedback.wrong {

    background:
        rgba(255,40,70,.17);

    border-color:
        rgba(255,80,90,.5);

    color:
        #ff8c98;

    box-shadow:
        0 0 25px
        rgba(255,40,70,.15);
}


/* =========================================================
   BONNE / MAUVAISE REPONSE
========================================================= */

.arrow-button.correct {

    animation:
        correctPop .45s ease;

    filter:
        brightness(1.25);

    outline:
        4px solid
        rgba(90,255,150,.75);
}

.arrow-button.wrong {

    animation:
        wrongShake .4s ease;

    filter:
        brightness(.8);

    outline:
        4px solid
        rgba(255,80,90,.75);
}

.arrow-button.reveal {

    animation:
        revealPulse 1s ease infinite;

    outline:
        4px solid
        rgba(255,255,255,.8);
}

@keyframes correctPop {

    0% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.16);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes wrongShake {

    0%,
    100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-9px);
    }

    75% {
        transform: translateX(9px);
    }
}

@keyframes revealPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

.arrow-button:disabled {

    cursor: default;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(5,2,20,.76);

    backdrop-filter:
        blur(10px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.overlay.active {

    display: flex;
}


/* =========================================================
   RESULT CARD
========================================================= */

.result-card {

    position: relative;

    overflow: hidden;

    width:
        min(100%, 500px);

    background:
        linear-gradient(
            145deg,
            rgba(58,30,110,.97),
            rgba(22,9,55,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.2);

    border-radius: 28px;

    padding: 34px 24px;

    text-align: center;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.45);
}

.result-card::before {

    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    background:
        #ff168c;

    filter: blur(65px);

    opacity: .22;

    top: -80px;
    left: -70px;
}

.result-card::after {

    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        #00cfff;

    filter: blur(65px);

    opacity: .22;

    bottom: -70px;
    right: -60px;
}

.result-card > * {

    position: relative;

    z-index: 2;
}

.result-card h2 {

    font-size: 29px;

    font-weight: 1000;

    margin-bottom: 8px;
}

.result-score {

    font-size: 54px;

    font-weight: 1000;

    margin: 14px 0;

    background:
        linear-gradient(
            90deg,
            #ff61b4,
            #72e9ff,
            #9d7aff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.result-details {

    color:
        rgba(255,255,255,.72);

    line-height: 1.7;

    margin-bottom: 20px;
}

.result-details strong {

    color: white;
}

.result-button {

    width: 100%;

    border: none;

    border-radius: 15px;

    padding: 15px;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7b45ff,
            #c523ff
        );

    box-shadow:
        0 7px 0 #4b1a96,
        0 12px 25px
        rgba(110,50,255,.25);

    transition:
        transform .15s ease;
}

.result-button:active {

    transform:
        translateY(5px);

    box-shadow:
        0 2px 0 #4b1a96;
}

.result-button.secondary {

    margin-top: 11px;

    background:
        rgba(255,255,255,.1);

    box-shadow:
        none;

    border:
        1px solid
        rgba(255,255,255,.15);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {
        padding: 9px;
    }

    .header {

        grid-template-columns:
            1fr 1fr;

        gap: 8px;
    }

    .header-center {

        grid-column: 1 / -1;

        grid-row: 1;

        margin-bottom: 3px;
    }

    .stat {

        padding: 10px 12px;

        border-radius: 15px;
    }

    .stat-value {

        font-size: 18px;
    }

    .arrows-area {

        height: 330px;

        gap: 8px;
    }

    .arrow-button {

        border-radius: 23px;

        box-shadow:
            0 7px 0 rgba(0,0,0,.22),
            0 12px 25px rgba(0,0,0,.22);
    }

    .arrow-center {

        width: 88px;
        height: 88px;
    }

    .arrow-center .center-icon {

        font-size: 25px;
    }

    .question-card {

        border-radius: 22px;

        padding: 22px 15px;
    }
}


/* =========================================================
   PETITS TELEPHONES
========================================================= */

@media (max-width: 380px) {

    .arrows-area {

        height: 290px;

        gap: 5px;
    }

    .arrow-button {

        width: 82px;
        height: 82px;

        border-radius: 19px;
    }

    .arrow-center {

        width: 73px;
        height: 73px;
    }

    .arrow-symbol {

        font-size: 40px;
    }

    .arrow-answer {

        font-size: 9px;
    }

    .center-icon {

        font-size: 22px;
    }

    .center-text {

        font-size: 7px;
    }
}


/* =========================================================
   REDUCTION DES ANIMATIONS
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        scroll-behavior: auto !important;

        transition-duration: .01ms !important;
    }
}

</style>

<body>

<div class="game">

    <a
        href="baccalaureat.html"
        class="back-button"
    >
        ← Retour aux jeux
    </a>


    <!-- HEADER -->

    <div class="header">

        <div class="stat">

            <span class="stat-label">
                Score
            </span>

            <span
                class="stat-value"
                id="score"
            >
                0
            </span>

        </div>


        <div class="header-center">

            <h1>
                Flèches à réponses
            </h1>

            <p>
                Choisis la bonne direction
            </p>

        </div>


        <div class="stat">

            <span class="stat-label">
                Manche
            </span>

            <span
                class="stat-value"
                id="round"
            >
                1 / 20
            </span>

        </div>

    </div>


    <!-- PROGRESSION -->

    <div class="progress-container">

        <div class="progress-info">

            <span id="questionProgress">
                Question 1 / 10
            </span>

            <span id="correctCount">
                0 correct
            </span>

        </div>


        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

    </div>


    <!-- QUESTION -->

    <div class="question-card">

        <div
            class="question-number"
            id="questionNumber"
        >
            QUESTION 1
        </div>


        <div
            class="question"
            id="question"
        >
            Chargement de la question...
        </div>

    </div>


    <!-- FLECHES -->

    <div class="arrows-area">


        <!-- HAUT -->

        <button
            class="arrow-button arrow-up"
            data-direction="up"
        >

            <span class="arrow-symbol">
                ↑
            </span>

            <span class="arrow-answer"></span>

        </button>


        <!-- GAUCHE -->

        <button
            class="arrow-button arrow-left"
            data-direction="left"
        >

            <span class="arrow-symbol">
                ←
            </span>

            <span class="arrow-answer"></span>

        </button>


        <!-- CENTRE -->

        <div class="arrow-center">

            <span class="center-icon">
                ?
            </span>

            <span class="center-text">
                Réponse
            </span>

        </div>


        <!-- DROITE -->

        <button
            class="arrow-button arrow-right"
            data-direction="right"
        >

            <span class="arrow-symbol">
                →
            </span>

            <span class="arrow-answer"></span>

        </button>


        <!-- BAS -->

        <button
            class="arrow-button arrow-down"
            data-direction="down"
        >

            <span class="arrow-symbol">
                ↓
            </span>

            <span class="arrow-answer"></span>

        </button>

    </div>


    <!-- FEEDBACK -->

    <div
        class="feedback"
        id="feedback"
    >
        Choisis une flèche.
    </div>

</div>


<!-- =====================================================
     RESULTAT
===================================================== -->

<div
    class="overlay"
    id="resultOverlay"
>

    <div class="result-card">

        <h2 id="resultTitle">
            Manche terminée
        </h2>


        <div
            class="result-score"
            id="resultScore"
        >
            0
        </div>


        <div
            class="result-details"
            id="resultDetails"
        >
            Résultats de la manche
        </div>


        <button
            class="result-button"
            id="nextRoundButton"
        >
            Manche suivante
        </button>


        <button
            class="result-button secondary"
            id="restartButton"
        >
            Recommencer
        </button>

    </div>

</div>


<script type="module">

import {
    jeuxQuestions
} from "./src/jeuxQuestions.js";


/* =========================================================
   CONFIGURATION
========================================================= */

const QUESTIONS_PER_ROUND = 10;

const MAX_ROUNDS = 20;


/* =========================================================
   ELEMENTS
========================================================= */

const scoreElement =
    document.getElementById("score");

const roundElement =
    document.getElementById("round");

const questionProgress =
    document.getElementById("questionProgress");

const correctCountElement =
    document.getElementById("correctCount");

const progressFill =
    document.getElementById("progressFill");

const questionNumber =
    document.getElementById("questionNumber");

const questionElement =
    document.getElementById("question");

const feedbackElement =
    document.getElementById("feedback");

const resultOverlay =
    document.getElementById("resultOverlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultScore =
    document.getElementById("resultScore");

const resultDetails =
    document.getElementById("resultDetails");

const nextRoundButton =
    document.getElementById("nextRoundButton");

const restartButton =
    document.getElementById("restartButton");

const arrowButtons =
    [
        ...document.querySelectorAll(
            ".arrow-button"
        )
    ];


/* =========================================================
   ETAT
========================================================= */

let score = 0;

let round = 1;

let questionIndex = 0;

let correctAnswers = 0;

let roundQuestions = [];

let currentQuestion = null;

let questionLocked = false;


/* =========================================================
   MELANGE
========================================================= */

function shuffle(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =========================================================
   QUESTIONS DISPONIBLES
========================================================= */

function getQuestions() {

    if (!Array.isArray(jeuxQuestions)) {

        console.error(
            "jeuxQuestions n'est pas un tableau."
        );

        return [];
    }


    return jeuxQuestions.filter(
        question => {

            return (
                question &&
                typeof question.question ===
                    "string" &&
                Array.isArray(
                    question.options
                ) &&
                question.options.length >= 4 &&
                typeof question.answer ===
                    "string"
            );

        }
    );

}


/* =========================================================
   DEMARRER UNE MANCHE
========================================================= */

function startRound() {

    const questions =
        getQuestions();


    if (questions.length < 4) {

        questionElement.textContent =
            "Pas assez de questions disponibles.";

        arrowButtons.forEach(
            button => {
                button.disabled = true;
            }
        );

        return;
    }


    roundQuestions =
        shuffle(questions).slice(
            0,
            Math.min(
                QUESTIONS_PER_ROUND,
                questions.length
            )
        );


    questionIndex = 0;

    correctAnswers = 0;

    roundElement.textContent =
        `${round} / ${MAX_ROUNDS}`;


    updateScore();

    loadQuestion();

}


/* =========================================================
   CHARGER QUESTION
========================================================= */

function loadQuestion() {

    if (
        questionIndex >=
        roundQuestions.length
    ) {

        finishRound();

        return;
    }


    currentQuestion =
        roundQuestions[
            questionIndex
        ];


    questionLocked = false;


    let options =
        shuffle(
            currentQuestion.options
        ).slice(0, 4);


    /*
       La bonne réponse doit
       toujours être présente.
    */

    if (
        !options.includes(
            currentQuestion.answer
        )
    ) {

        options[
            Math.floor(
                Math.random() *
                options.length
            )
        ] =
            currentQuestion.answer;
    }


    arrowButtons.forEach(
        (button, index) => {

            button.dataset.answer =
                options[index];


            const answerElement =
                button.querySelector(
                    ".arrow-answer"
                );


            answerElement.textContent =
                options[index];


            button.disabled = false;


            button.classList.remove(
                "correct",
                "wrong",
                "reveal"
            );

        }
    );


    questionElement.textContent =
        currentQuestion.question;


    questionNumber.textContent =
        `QUESTION ${questionIndex + 1}`;


    questionProgress.textContent =
        `Question ${questionIndex + 1} / ${roundQuestions.length}`;


    correctCountElement.textContent =
        `${correctAnswers} correct`;


    progressFill.style.width =
        `${
            (
                questionIndex /
                roundQuestions.length
            ) * 100
        }%`;


    feedbackElement.className =
        "feedback";


    feedbackElement.textContent =
        "Choisis une flèche.";

}


/* =========================================================
   REPONSE
========================================================= */

function selectAnswer(button) {

    if (
        questionLocked ||
        !currentQuestion
    ) {
        return;
    }


    questionLocked = true;


    const selectedAnswer =
        button.dataset.answer;


    const correctAnswer =
        currentQuestion.answer;


    const isCorrect =
        selectedAnswer ===
        correctAnswer;


    arrowButtons.forEach(
        item => {
            item.disabled = true;
        }
    );


    if (isCorrect) {

        score += 10;

        correctAnswers++;


        button.classList.add(
            "correct"
        );


        feedbackElement.className =
            "feedback correct";


        feedbackElement.textContent =
            "Bonne réponse ! +10 points";


    } else {

        button.classList.add(
            "wrong"
        );


        const correctButton =
            arrowButtons.find(
                item =>
                    item.dataset.answer ===
                    correctAnswer
            );


        if (correctButton) {

            correctButton.classList.add(
                "reveal"
            );

        }


        feedbackElement.className =
            "feedback wrong";


        feedbackElement.textContent =
            `Mauvaise réponse. La bonne réponse est : ${correctAnswer}`;

    }


    updateScore();


    correctCountElement.textContent =
        `${correctAnswers} correct`;


    setTimeout(
        () => {

            questionIndex++;

            loadQuestion();

        },
        1100
    );

}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {

    scoreElement.textContent =
        score;

}


/* =========================================================
   FIN DE MANCHE
========================================================= */

function finishRound() {

    progressFill.style.width =
        "100%";


    resultOverlay.classList.add(
        "active"
    );


    resultScore.textContent =
        `${correctAnswers * 10} pts`;


    resultTitle.textContent =
        `Manche ${round} terminée`;


    resultDetails.innerHTML =
        `
            ${correctAnswers}
            bonne(s) réponse(s)
            sur
            ${roundQuestions.length}
            <br>
            Score total :
            <strong>${score}</strong>
            points
        `;


    if (round >= MAX_ROUNDS) {

        nextRoundButton.textContent =
            "Nouvelle partie";

    } else {

        nextRoundButton.textContent =
            "Manche suivante";

    }

}


/* =========================================================
   MANCHE SUIVANTE
========================================================= */

nextRoundButton.addEventListener(
    "click",
    () => {

        resultOverlay.classList.remove(
            "active"
        );


        if (round >= MAX_ROUNDS) {

            round = 1;

            score = 0;

        } else {

            round++;

        }


        startRound();

    }
);


/* =========================================================
   RECOMMENCER
========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        resultOverlay.classList.remove(
            "active"
        );


        score = 0;

        round = 1;


        startRound();

    }
);


/* =========================================================
   CLIC SUR LES FLECHES
========================================================= */

arrowButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                selectAnswer(button);

            }
        );

    }
);


/* =========================================================
   CLAVIER
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (questionLocked) {
            return;
        }


        let direction = null;


        switch (event.key) {

            case "ArrowUp":
                direction = "up";
                break;

            case "ArrowLeft":
                direction = "left";
                break;

            case "ArrowRight":
                direction = "right";
                break;

            case "ArrowDown":
                direction = "down";
                break;

            default:
                return;
        }


        const button =
            arrowButtons.find(
                item =>
                    item.dataset.direction ===
                    direction
            );


        if (button) {

            selectAnswer(button);

        }

    }
);


/* =========================================================
   DEMARRAGE
========================================================= */

startRound();

</script>

</body>
</html>
