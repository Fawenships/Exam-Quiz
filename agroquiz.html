{id:"q241",ch:1,lvl:1,q:"Quel outil permet d’observer des cellules que l’œil nu ne distingue pas ?",opts:["Une hypothèse est toujours vraie sans vérification", "Un microscope", "Une population est une seule cellule", "La locomotion est obligatoire pour tout être vivant"],a:1,exp:"Le microscope agrandit les structures trop petites pour être observées directement."},
{id:"q242",ch:1,lvl:1,q:"Quelle branche étudie les relations entre les organismes et leur milieu ?",opts:["Une hypothèse est toujours vraie sans vérification", "L’écologie", "Une population est une seule cellule", "La locomotion est obligatoire pour tout être vivant"],a:1,exp:"L’écologie étudie les interactions entre les êtres vivants et leur environnement."},
{id:"q243",ch:1,lvl:2,q:"Comment nomme-t-on la capacité de maintenir des conditions internes relativement stables ?",opts:["La biologie étudie uniquement les roches", "La photosynthèse est un organe", "La locomotion est obligatoire pour tout être vivant", "L’homéostasie"],a:3,exp:"L’homéostasie aide l’organisme à maintenir un équilibre interne malgré les variations du milieu."},
{id:"q244",ch:1,lvl:1,q:"Quel niveau d’organisation rassemble plusieurs tissus et réalise une fonction ?",opts:["Un organe", "Une communauté ne contient qu’une seule espèce", "Une hypothèse est toujours vraie sans vérification", "Un écosystème ne contient que des organismes vivants"],a:0,exp:"Un organe, comme une feuille ou une racine, réunit plusieurs tissus."},
{id:"q245",ch:1,lvl:2,q:"Quelle proposition décrit le mieux une population ?",opts:["Une communauté ne contient qu’une seule espèce", "Un écosystème ne contient que des organismes vivants", "Des individus de la même espèce vivant dans une même zone", "La photosynthèse est un organe"],a:2,exp:"Une population est définie par une espèce et un espace donné."},
{id:"q246",ch:1,lvl:2,q:"Quel niveau comprend les organismes vivants et les facteurs physiques d’un lieu ?",opts:["Une hypothèse est toujours vraie sans vérification", "Une communauté ne contient qu’une seule espèce", "L’écosystème", "La locomotion est obligatoire pour tout être vivant"],a:2,exp:"Un écosystème comprend une communauté vivante et son milieu physique."},
{id:"q247",ch:1,lvl:1,q:"Quelle branche étudie la transmission des caractères héréditaires ?",opts:["La photosynthèse est un organe", "La biologie étudie uniquement les roches", "La génétique", "Un écosystème ne contient que des organismes vivants"],a:2,exp:"La génétique porte sur les gènes, l’hérédité et la variation des caractères."},
{id:"q248",ch:1,lvl:2,q:"Pourquoi comparer plusieurs plants d’une même parcelle est-il utile ?",opts:["La biologie étudie uniquement les roches", "Pour repérer des différences de croissance ou des symptômes", "Une communauté ne contient qu’une seule espèce", "La génétique étudie seulement la météo"],a:1,exp:"L’observation comparative permet de détecter des variations et de formuler des hypothèses."},
{id:"q249",ch:1,lvl:2,q:"Dans une démarche scientifique, que fait-on après avoir formulé une hypothèse ?",opts:["On la met à l’épreuve par des observations ou une expérience", "La génétique étudie seulement la météo", "Un écosystème ne contient que des organismes vivants", "La photosynthèse est un organe"],a:0,exp:"Une hypothèse doit être confrontée à des données vérifiables."},
{id:"q250",ch:1,lvl:1,q:"Quel élément est un facteur abiotique ?",opts:["Une population est une seule cellule", "La biologie étudie uniquement les roches", "La température", "La génétique étudie seulement la météo"],a:2,exp:"La température est un facteur physique non vivant du milieu."},
{id:"q251",ch:1,lvl:1,q:"Quel élément est un facteur biotique ?",opts:["Une hypothèse est toujours vraie sans vérification", "La biologie étudie uniquement les roches", "Un champignon pathogène", "Une communauté ne contient qu’une seule espèce"],a:2,exp:"Un champignon est un organisme vivant et constitue donc un facteur biotique."},
{id:"q252",ch:1,lvl:1,q:"Quel terme désigne les organismes microscopiques étudiés par la microbiologie ?",opts:["Un écosystème ne contient que des organismes vivants", "La génétique étudie seulement la météo", "Les microorganismes", "La photosynthèse est un organe"],a:2,exp:"La microbiologie étudie notamment les bactéries et les champignons microscopiques."},
{id:"q253",ch:1,lvl:2,q:"Pourquoi un agronome observe-t-il les racines d’un plant malade ?",opts:["Une hypothèse est toujours vraie sans vérification", "Une communauté ne contient qu’une seule espèce", "Pour rechercher des indices sur l’eau, les nutriments ou les maladies", "La photosynthèse est un organe"],a:2,exp:"Les racines donnent des indices utiles au diagnostic agronomique."},
{id:"q254",ch:1,lvl:3,q:"Quel est l’objectif d’un témoin dans une expérience ?",opts:["Une hypothèse est toujours vraie sans vérification", "Une population est une seule cellule", "Servir de référence pour comparer les résultats", "La génétique étudie seulement la météo"],a:2,exp:"Le témoin permet d’évaluer l’effet du facteur testé."},
{id:"q255",ch:1,lvl:3,q:"Pourquoi répéter une mesure dans une expérience ?",opts:["Une population est une seule cellule", "Pour réduire l’influence du hasard et estimer la variabilité", "La photosynthèse est un organe", "La génétique étudie seulement la météo"],a:1,exp:"Les répétitions rendent les conclusions plus fiables."},
{id:"q256",ch:1,lvl:2,q:"Quel terme désigne l’ensemble des populations d’espèces différentes vivant dans une zone ?",opts:["Une hypothèse est toujours vraie sans vérification", "Un écosystème ne contient que des organismes vivants", "Une communauté", "La biologie étudie uniquement les roches"],a:2,exp:"Une communauté biologique rassemble plusieurs populations qui coexistent."},
{id:"q257",ch:1,lvl:2,q:"Quelle affirmation sur les êtres vivants est correcte ?",opts:["Ils réalisent des échanges de matière et d’énergie avec leur milieu", "Une communauté ne contient qu’une seule espèce", "La photosynthèse est un organe", "La locomotion est obligatoire pour tout être vivant"],a:0,exp:"Le métabolisme implique des transformations et des échanges avec l’environnement."},
{id:"q258",ch:1,lvl:1,q:"Pourquoi les plantes sont-elles classées parmi les êtres vivants même si elles restent fixées ?",opts:["Une hypothèse est toujours vraie sans vérification", "La locomotion est obligatoire pour tout être vivant", "Une communauté ne contient qu’une seule espèce", "Elles ont des cellules et réalisent un métabolisme et une croissance"],a:3,exp:"La locomotion n’est pas une condition nécessaire pour être vivant."},
{id:"q259",ch:1,lvl:2,q:"Quel est le rôle d’une classification biologique ?",opts:["Une communauté ne contient qu’une seule espèce", "La locomotion est obligatoire pour tout être vivant", "Organiser les organismes selon leurs caractères et leurs relations", "Un écosystème ne contient que des organismes vivants"],a:2,exp:"La classification aide à identifier et à comparer les organismes."},
{id:"q260",ch:1,lvl:2,q:"Quel exemple montre une application directe de la biologie en agriculture ?",opts:["Identifier une carence avant d’adapter la fertilisation", "La photosynthèse est un organe", "Une communauté ne contient qu’une seule espèce", "Une population est une seule cellule"],a:0,exp:"Le diagnostic biologique aide à choisir une intervention adaptée."},
{id:"q261",ch:2,lvl:1,q:"Quelle structure sépare le contenu cellulaire du milieu extérieur ?",opts:["La paroi contrôle seule tous les échanges", "Les bactéries possèdent toujours un noyau entouré d’une enveloppe", "La membrane plasmique", "Les chloroplastes produisent les grains de pollen"],a:2,exp:"La membrane plasmique délimite la cellule et contrôle les échanges."},
{id:"q262",ch:2,lvl:1,q:"Quelle molécule porte l’essentiel de l’information héréditaire ?",opts:["Les chloroplastes produisent les grains de pollen", "Les ribosomes stockent principalement les lipides", "L’osmose est le déplacement des protéines à travers une paroi", "L’ADN"],a:3,exp:"L’ADN contient l’information génétique utilisée par la cellule."},
{id:"q263",ch:2,lvl:1,q:"Dans quelle partie de la cellule se trouvent de nombreux organites ?",opts:["Le cytoplasme", "L’osmose est le déplacement des protéines à travers une paroi", "La membrane plasmique est faite uniquement de cellulose", "La paroi contrôle seule tous les échanges"],a:0,exp:"Les organites baignent dans le cytoplasme, qui contient aussi le cytosol."},
{id:"q264",ch:2,lvl:1,q:"Quel organite est associé à la production d’ATP par respiration cellulaire ?",opts:["La mitochondrie", "Les bactéries possèdent toujours un noyau entouré d’une enveloppe", "La vacuole est absente de toutes les cellules végétales", "Les ribosomes stockent principalement les lipides"],a:0,exp:"La mitochondrie est un site majeur de production d’ATP dans les cellules eucaryotes."},
{id:"q265",ch:2,lvl:2,q:"Quelle structure végétale contient principalement de la cellulose ?",opts:["Les ribosomes stockent principalement les lipides", "La paroi cellulaire", "La membrane plasmique est faite uniquement de cellulose", "La paroi contrôle seule tous les échanges"],a:1,exp:"La cellulose contribue à la rigidité de la paroi des cellules végétales."},
{id:"q266",ch:2,lvl:1,q:"Quel pigment capte une partie de l’énergie lumineuse pour la photosynthèse ?",opts:["La vacuole est absente de toutes les cellules végétales", "L’osmose est le déplacement des protéines à travers une paroi", "La chlorophylle", "Les ribosomes stockent principalement les lipides"],a:2,exp:"La chlorophylle absorbe la lumière utilisée dans la photosynthèse."},
{id:"q267",ch:2,lvl:2,q:"Quel est le rôle principal des ribosomes ?",opts:["L’osmose est le déplacement des protéines à travers une paroi", "La vacuole est absente de toutes les cellules végétales", "Assembler les acides aminés pour fabriquer des protéines", "Les chloroplastes produisent les grains de pollen"],a:2,exp:"Les ribosomes réalisent la synthèse des protéines à partir de l’information portée par l’ARN messager."},
{id:"q268",ch:2,lvl:3,q:"Que devient généralement une cellule végétale placée dans un milieu très concentré en solutés ?",opts:["Les chloroplastes produisent les grains de pollen", "Les ribosomes stockent principalement les lipides", "La membrane plasmique est faite uniquement de cellulose", "Elle peut perdre de l’eau et se plasmolyser"],a:3,exp:"L’eau sort de la cellule par osmose si le milieu extérieur est suffisamment hypertonique."},
{id:"q269",ch:2,lvl:1,q:"Quel processus permet à une cellule de donner deux cellules filles ?",opts:["La division cellulaire", "Les chloroplastes produisent les grains de pollen", "Les ribosomes stockent principalement les lipides", "La vacuole est absente de toutes les cellules végétales"],a:0,exp:"La division cellulaire répartit le matériel cellulaire et, selon le type de division, l’ADN."},
{id:"q270",ch:2,lvl:2,q:"Quel élément distingue une bactérie d’une cellule eucaryote ?",opts:["L’osmose est le déplacement des protéines à travers une paroi", "La bactérie ne possède pas de noyau délimité par une enveloppe", "La membrane plasmique est faite uniquement de cellulose", "La vacuole est absente de toutes les cellules végétales"],a:1,exp:"Les bactéries sont des procaryotes dont l’ADN se trouve dans une région du cytoplasme."},
{id:"q271",ch:2,lvl:2,q:"Quel est le rôle de la grande vacuole d’une cellule végétale ?",opts:["L’osmose est le déplacement des protéines à travers une paroi", "La paroi contrôle seule tous les échanges", "Le noyau fabrique directement toute l’énergie", "Stocker de l’eau et des solutés et contribuer à la turgescence"],a:3,exp:"La vacuole participe au stockage et au maintien de la fermeté des tissus."},
{id:"q272",ch:2,lvl:3,q:"Qu’est-ce que l’osmose ?",opts:["La membrane plasmique est faite uniquement de cellulose", "Le déplacement net de l’eau à travers une membrane sélective", "Le noyau fabrique directement toute l’énergie", "L’osmose est le déplacement des protéines à travers une paroi"],a:1,exp:"L’eau se déplace selon les différences de potentiel hydrique de part et d’autre de la membrane."},
{id:"q273",ch:2,lvl:2,q:"Pourquoi les cellules végétales ont-elles une paroi en plus de la membrane ?",opts:["Les bactéries possèdent toujours un noyau entouré d’une enveloppe", "La paroi soutient et protège la cellule", "L’osmose est le déplacement des protéines à travers une paroi", "La membrane plasmique est faite uniquement de cellulose"],a:1,exp:"La paroi donne une résistance mécanique, tandis que la membrane régule les échanges."},
{id:"q274",ch:2,lvl:1,q:"Quel organite est directement associé à la photosynthèse chez les plantes vertes ?",opts:["Les chloroplastes produisent les grains de pollen", "Le chloroplaste", "La paroi contrôle seule tous les échanges", "Le noyau fabrique directement toute l’énergie"],a:1,exp:"Les réactions photosynthétiques se déroulent dans les chloroplastes."},
{id:"q275",ch:2,lvl:2,q:"Quel terme désigne le liquide intracellulaire dans lequel baignent les organites ?",opts:["Les ribosomes stockent principalement les lipides", "Le noyau fabrique directement toute l’énergie", "Le cytosol", "La paroi contrôle seule tous les échanges"],a:2,exp:"Le cytosol est la fraction liquide du cytoplasme."},
{id:"q276",ch:2,lvl:3,q:"Quelle structure aide à contrôler les substances entrant et sortant de la cellule ?",opts:["La membrane plasmique est faite uniquement de cellulose", "La vacuole est absente de toutes les cellules végétales", "Les protéines de transport de la membrane", "La paroi contrôle seule tous les échanges"],a:2,exp:"Des protéines membranaires facilitent ou régulent le passage de certaines molécules et ions."},
{id:"q277",ch:2,lvl:2,q:"Pourquoi une cellule a-t-elle besoin d’ATP ?",opts:["Pour alimenter de nombreux processus cellulaires", "Les chloroplastes produisent les grains de pollen", "La membrane plasmique est faite uniquement de cellulose", "Le noyau fabrique directement toute l’énergie"],a:0,exp:"L’ATP fournit une énergie directement utilisable pour le transport, la synthèse et d’autres activités."},
{id:"q278",ch:2,lvl:1,q:"Quel type de cellule possède habituellement des chloroplastes dans les feuilles ?",opts:["L’osmose est le déplacement des protéines à travers une paroi", "Le noyau fabrique directement toute l’énergie", "La paroi contrôle seule tous les échanges", "Une cellule végétale photosynthétique"],a:3,exp:"Les cellules vertes des feuilles contiennent généralement des chloroplastes."},
{id:"q279",ch:2,lvl:1,q:"Quelle structure organise l’information génétique dans une cellule eucaryote ?",opts:["Les ribosomes stockent principalement les lipides", "Le noyau", "Les bactéries possèdent toujours un noyau entouré d’une enveloppe", "La membrane plasmique est faite uniquement de cellulose"],a:1,exp:"Le noyau contient la majeure partie de l’ADN nucléaire."},
{id:"q280",ch:2,lvl:2,q:"Quel phénomène explique l’entrée d’eau dans les cellules d’un plant après une pluie ?",opts:["L’osmose est le déplacement des protéines à travers une paroi", "Les chloroplastes produisent les grains de pollen", "L’absorption d’eau et le rétablissement de la turgescence", "Les bactéries possèdent toujours un noyau entouré d’une enveloppe"],a:2,exp:"Quand les cellules absorbent de l’eau, la pression interne peut redonner de la fermeté aux tissus."},
{id:"q281",ch:3,lvl:1,q:"Quels éléments chimiques sont présents dans la plupart des glucides ?",opts:["Les lipides sont toujours solubles dans l’eau", "Le magnésium est le sucre de l’ADN", "Les protéines sont constituées uniquement de glucose", "Le carbone, l’hydrogène et l’oxygène"],a:3,exp:"Les glucides sont principalement composés de carbone, d’hydrogène et d’oxygène."},
{id:"q282",ch:3,lvl:1,q:"Quelle molécule constitue une réserve glucidique fréquente dans les graines et tubercules ?",opts:["Le magnésium est le sucre de l’ADN", "Le phosphore ne joue aucun rôle dans les cellules", "L’amidon", "Les lipides sont toujours solubles dans l’eau"],a:2,exp:"Les plantes stockent souvent leurs réserves de glucides sous forme d’amidon."},
{id:"q283",ch:3,lvl:1,q:"Quel polymère constitue une grande partie de la paroi végétale ?",opts:["L’ADN contient de l’uracile à la place de la thymine", "Le magnésium est le sucre de l’ADN", "La cellulose", "La cellulose est la principale réserve animale"],a:2,exp:"La cellulose forme des fibres résistantes dans la paroi végétale."},
{id:"q284",ch:3,lvl:1,q:"De quelles unités les protéines sont-elles constituées ?",opts:["Les enzymes sont consommées complètement à chaque réaction", "Les protéines sont constituées uniquement de glucose", "D’acides aminés", "Le potassium est un glucide"],a:2,exp:"Les acides aminés sont reliés par des liaisons peptidiques pour former les protéines."},
{id:"q285",ch:3,lvl:2,q:"Quel est le rôle d’un phospholipide dans une cellule ?",opts:["Le potassium est un glucide", "Le phosphore ne joue aucun rôle dans les cellules", "Contribuer à la bicouche des membranes", "L’ADN contient de l’uracile à la place de la thymine"],a:2,exp:"Les phospholipides possèdent des parties hydrophiles et hydrophobes qui favorisent la formation des membranes."},
{id:"q286",ch:3,lvl:2,q:"Quel élément minéral est particulièrement associé à la formation des acides nucléiques et des protéines ?",opts:["La cellulose est la principale réserve animale", "Le potassium est un glucide", "Les protéines sont constituées uniquement de glucose", "L’azote"],a:3,exp:"L’azote est présent dans les acides aminés et les bases azotées."},
{id:"q287",ch:3,lvl:1,q:"Quel nutriment est une source d’énergie rapidement utilisable par la respiration ?",opts:["Le glucose", "La cellulose est la principale réserve animale", "Le potassium est un glucide", "Les enzymes sont consommées complètement à chaque réaction"],a:0,exp:"Le glucose peut être dégradé lors de la respiration cellulaire pour produire de l’ATP."},
{id:"q288",ch:3,lvl:2,q:"Pourquoi les huiles des graines sont-elles utiles à la germination ?",opts:["Le potassium est un glucide", "Les enzymes sont consommées complètement à chaque réaction", "Les lipides sont toujours solubles dans l’eau", "Elles fournissent une réserve énergétique à l’embryon"],a:3,exp:"Les lipides stockés peuvent être mobilisés pendant le développement initial de la plantule."},
{id:"q289",ch:3,lvl:2,q:"Quel élément minéral joue un rôle dans le transfert d’énergie via l’ATP ?",opts:["La cellulose est la principale réserve animale", "L’ADN contient de l’uracile à la place de la thymine", "Le phosphore", "Les protéines sont constituées uniquement de glucose"],a:2,exp:"Le phosphore entre dans la composition de l’ATP et des acides nucléiques."},
{id:"q290",ch:3,lvl:3,q:"Quel élément est central dans la molécule de chlorophylle ?",opts:["Le phosphore ne joue aucun rôle dans les cellules", "Les enzymes sont consommées complètement à chaque réaction", "Le magnésium", "Le magnésium est le sucre de l’ADN"],a:2,exp:"Un ion magnésium se trouve au centre de la structure de la chlorophylle."},
{id:"q291",ch:3,lvl:3,q:"Quel micronutriment végétal intervient notamment dans des systèmes enzymatiques et la formation de chlorophylle ?",opts:["Les enzymes sont consommées complètement à chaque réaction", "Le potassium est un glucide", "Le fer", "La cellulose est la principale réserve animale"],a:2,exp:"Le fer est essentiel à plusieurs réactions d’oxydoréduction et à la synthèse normale de chlorophylle."},
{id:"q292",ch:3,lvl:2,q:"Que signifie qu’une enzyme est spécifique ?",opts:["Elle agit sur un substrat ou un type de réaction limité", "Les lipides sont toujours solubles dans l’eau", "Les enzymes sont consommées complètement à chaque réaction", "L’ADN contient de l’uracile à la place de la thymine"],a:0,exp:"La forme du site actif contribue à la spécificité d’une enzyme."},
{id:"q293",ch:3,lvl:2,q:"Quel facteur peut modifier l’activité d’une enzyme ?",opts:["La cellulose est la principale réserve animale", "Les lipides sont toujours solubles dans l’eau", "La température", "Le magnésium est le sucre de l’ADN"],a:2,exp:"Une température trop basse ralentit souvent l’activité et une température excessive peut dénaturer l’enzyme."},
{id:"q294",ch:3,lvl:2,q:"Quel sucre se trouve dans l’ADN ?",opts:["Les lipides sont toujours solubles dans l’eau", "Le magnésium est le sucre de l’ADN", "Le phosphore ne joue aucun rôle dans les cellules", "Le désoxyribose"],a:3,exp:"Le nom ADN renvoie à l’acide désoxyribonucléique, qui contient du désoxyribose."},
{id:"q295",ch:3,lvl:1,q:"Quelle base est présente dans l’ARN à la place de la thymine ?",opts:["La cellulose est la principale réserve animale", "Les protéines sont constituées uniquement de glucose", "Le phosphore ne joue aucun rôle dans les cellules", "L’uracile"],a:3,exp:"Dans l’ARN, l’uracile remplace généralement la thymine de l’ADN."},
{id:"q296",ch:3,lvl:3,q:"Pourquoi le potassium est-il important pour les plantes ?",opts:["Il participe à la régulation hydrique et à l’activation d’enzymes", "Les lipides sont toujours solubles dans l’eau", "Les enzymes sont consommées complètement à chaque réaction", "Le phosphore ne joue aucun rôle dans les cellules"],a:0,exp:"Le potassium contribue notamment à l’ouverture des stomates et à plusieurs fonctions métaboliques."},
{id:"q297",ch:3,lvl:3,q:"Quel rôle le calcium joue-t-il chez les plantes ?",opts:["Les protéines sont constituées uniquement de glucose", "Le magnésium est le sucre de l’ADN", "Il contribue à la structure des parois et à la signalisation cellulaire", "Les lipides sont toujours solubles dans l’eau"],a:2,exp:"Le calcium participe à la stabilité des parois et à la transmission de signaux dans les cellules."},
{id:"q298",ch:3,lvl:2,q:"Quel symptôme est souvent associé à une carence en azote ?",opts:["La cellulose est la principale réserve animale", "L’ADN contient de l’uracile à la place de la thymine", "Un jaunissement qui commence souvent sur les feuilles âgées", "Les protéines sont constituées uniquement de glucose"],a:2,exp:"L’azote étant mobile, la plante peut le déplacer vers les tissus jeunes."},
{id:"q299",ch:3,lvl:2,q:"Quel est le rôle général des lipides dans les membranes ?",opts:["Le phosphore ne joue aucun rôle dans les cellules", "Former une barrière sélective et contribuer à la structure membranaire", "Le magnésium est le sucre de l’ADN", "Les protéines sont constituées uniquement de glucose"],a:1,exp:"Les lipides membranaires forment une barrière qui sépare les milieux internes et externes."},
{id:"q300",ch:3,lvl:3,q:"Pourquoi les minéraux doivent-ils être dissous dans l’eau du sol pour être absorbés par les racines ?",opts:["Les lipides sont toujours solubles dans l’eau", "Les enzymes sont consommées complètement à chaque réaction", "Le phosphore ne joue aucun rôle dans les cellules", "Les racines absorbent généralement les éléments minéraux sous forme d’ions en solution"],a:3,exp:"La disponibilité des nutriments dépend notamment de leur présence sous une forme que les racines peuvent absorber."},
{id:"q301",ch:4,lvl:1,q:"Quelle partie de la plante absorbe surtout l’eau et les ions minéraux ?",opts:["Les racines, notamment leurs poils absorbants", "Les ovules se trouvent dans les anthères", "Les stomates servent à fabriquer les racines", "La cuticule augmente toujours les pertes d’eau"],a:0,exp:"Les racines ancrent la plante et absorbent l’eau et les éléments minéraux du sol."},
{id:"q302",ch:4,lvl:2,q:"Quel tissu transporte principalement l’eau et les sels minéraux des racines vers les feuilles ?",opts:["Le phloème transporte uniquement l’eau depuis le sol", "La germination ne nécessite jamais d’eau", "Le xylème", "Le phototropisme est une réponse à la gravité"],a:2,exp:"Le xylème conduit la sève brute, composée principalement d’eau et d’ions minéraux."},
{id:"q303",ch:4,lvl:2,q:"Quel tissu transporte une grande partie des sucres produits par les feuilles ?",opts:["Le phloème transporte uniquement l’eau depuis le sol", "La germination ne nécessite jamais d’eau", "Le phloème", "Les méristèmes empêchent la division cellulaire"],a:2,exp:"Le phloème distribue les assimilats organiques vers les organes consommateurs ou de réserve."},
{id:"q304",ch:4,lvl:2,q:"Quel est le rôle principal des stomates ?",opts:["La germination ne nécessite jamais d’eau", "Réguler les échanges gazeux et la perte d’eau", "Le phototropisme est une réponse à la gravité", "Le xylème transporte principalement les sucres vers les fruits"],a:1,exp:"L’ouverture des stomates permet l’entrée du CO₂ mais entraîne aussi une perte d’eau par transpiration."},
{id:"q305",ch:4,lvl:2,q:"Quelle structure protège l’extrémité en croissance d’une racine ?",opts:["Les ovules se trouvent dans les anthères", "La cuticule augmente toujours les pertes d’eau", "Les méristèmes empêchent la division cellulaire", "La coiffe racinaire"],a:3,exp:"La coiffe protège le méristème apical de la racine lorsqu’elle progresse dans le sol."},
{id:"q306",ch:4,lvl:1,q:"Quelle région de la racine est spécialisée dans l’absorption grâce aux poils absorbants ?",opts:["Les stomates servent à fabriquer les racines", "La zone pilifère", "La cuticule augmente toujours les pertes d’eau", "Le phototropisme est une réponse à la gravité"],a:1,exp:"Les poils absorbants augmentent la surface de contact avec le sol."},
{id:"q307",ch:4,lvl:1,q:"Quel organe floral produit généralement les grains de pollen ?",opts:["L’anthère", "Les stomates servent à fabriquer les racines", "La cuticule augmente toujours les pertes d’eau", "Les ovules se trouvent dans les anthères"],a:0,exp:"L’anthère fait partie de l’étamine et produit le pollen."},
{id:"q308",ch:4,lvl:1,q:"Quel organe floral contient les ovules ?",opts:["La cuticule augmente toujours les pertes d’eau", "Le phloème transporte uniquement l’eau depuis le sol", "L’ovaire", "Les ovules se trouvent dans les anthères"],a:2,exp:"L’ovaire fait partie du pistil et renferme les ovules."},
{id:"q309",ch:4,lvl:2,q:"Que devient généralement l’ovaire après la fécondation chez une plante à fleurs ?",opts:["Les ovules se trouvent dans les anthères", "La germination ne nécessite jamais d’eau", "Il se développe en fruit", "Les stomates servent à fabriquer les racines"],a:2,exp:"Après la fécondation, l’ovaire se développe généralement en fruit et les ovules en graines."},
{id:"q310",ch:4,lvl:1,q:"Quel est le rôle principal de la graine ?",opts:["Le phototropisme est une réponse à la gravité", "Les méristèmes empêchent la division cellulaire", "La cuticule augmente toujours les pertes d’eau", "Protéger l’embryon et contenir des réserves ou les structures nécessaires à son démarrage"],a:3,exp:"La graine contient un embryon et, selon l’espèce, des réserves nutritives."},
{id:"q311",ch:4,lvl:1,q:"Quel processus permet à une graine viable de commencer son développement lorsque les conditions sont favorables ?",opts:["Le phototropisme est une réponse à la gravité", "La cuticule augmente toujours les pertes d’eau", "La germination", "La germination ne nécessite jamais d’eau"],a:2,exp:"La germination commence notamment par l’absorption d’eau et la reprise de l’activité métabolique."},
{id:"q312",ch:4,lvl:1,q:"Pourquoi une plante a-t-elle besoin de lumière pour une croissance normale ?",opts:["Les méristèmes empêchent la division cellulaire", "La lumière fournit l’énergie nécessaire à la photosynthèse", "Le phloème transporte uniquement l’eau depuis le sol", "Les stomates servent à fabriquer les racines"],a:1,exp:"La photosynthèse permet de produire de la matière organique à partir de CO₂ et d’eau."},
{id:"q313",ch:4,lvl:2,q:"Quel rôle joue la cuticule sur les parties aériennes des plantes ?",opts:["Les ovules se trouvent dans les anthères", "La cuticule augmente toujours les pertes d’eau", "Limiter les pertes d’eau à travers l’épiderme", "Les méristèmes empêchent la division cellulaire"],a:2,exp:"La cuticule cireuse réduit l’évaporation directe à la surface des organes."},
{id:"q314",ch:4,lvl:1,q:"Quelle fonction la tige assure-t-elle souvent ?",opts:["Soutenir les feuilles et relier les organes par les tissus conducteurs", "Le phloème transporte uniquement l’eau depuis le sol", "Les ovules se trouvent dans les anthères", "Les méristèmes empêchent la division cellulaire"],a:0,exp:"La tige soutient les parties aériennes et permet le transport de la sève."},
{id:"q315",ch:4,lvl:2,q:"Quel est le rôle des méristèmes ?",opts:["Produire de nouvelles cellules pour la croissance", "Le xylème transporte principalement les sucres vers les fruits", "La germination ne nécessite jamais d’eau", "Les stomates servent à fabriquer les racines"],a:0,exp:"Les méristèmes contiennent des cellules qui se divisent activement."},
{id:"q316",ch:4,lvl:2,q:"Quel phénomène oriente souvent la croissance des pousses vers la lumière ?",opts:["Le phototropisme", "La cuticule augmente toujours les pertes d’eau", "Les ovules se trouvent dans les anthères", "Les stomates servent à fabriquer les racines"],a:0,exp:"Le phototropisme est une réponse de croissance orientée par la lumière."},
{id:"q317",ch:4,lvl:2,q:"Quel phénomène oriente la croissance des racines en réponse à la gravité ?",opts:["Le phloème transporte uniquement l’eau depuis le sol", "Le gravitropisme", "La cuticule augmente toujours les pertes d’eau", "Les stomates servent à fabriquer les racines"],a:1,exp:"Les racines présentent généralement un gravitropisme positif, en poussant vers le bas."},
{id:"q318",ch:4,lvl:2,q:"Quel organe stocke des réserves dans une patate douce ?",opts:["La racine tubérisée", "Le xylème transporte principalement les sucres vers les fruits", "Le phototropisme est une réponse à la gravité", "La cuticule augmente toujours les pertes d’eau"],a:0,exp:"La patate douce est une racine modifiée qui stocke des réserves."},
{id:"q319",ch:4,lvl:3,q:"Pourquoi la rotation des cultures peut-elle être utile ?",opts:["Les ovules se trouvent dans les anthères", "Le xylème transporte principalement les sucres vers les fruits", "La cuticule augmente toujours les pertes d’eau", "Elle aide à diversifier les prélèvements de nutriments et à rompre certains cycles de ravageurs"],a:3,exp:"La rotation contribue à gérer la fertilité et peut réduire l’accumulation de certains organismes nuisibles."},
{id:"q320",ch:4,lvl:3,q:"Quel facteur du sol peut limiter l’absorption des nutriments par les racines ?",opts:["Le xylème transporte principalement les sucres vers les fruits", "Un pH défavorable à la disponibilité de certains éléments", "Les méristèmes empêchent la division cellulaire", "La cuticule augmente toujours les pertes d’eau"],a:1,exp:"Le pH influence la solubilité et la disponibilité de plusieurs nutriments du sol."},
{id:"q321",ch:5,lvl:1,q:"Quels sont les deux réactifs principaux de la photosynthèse ?",opts:["La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "La mitochondrie est le principal site de la photosynthèse", "Le dioxyde de carbone et l’eau", "L’eau n’intervient pas dans la photosynthèse"],a:2,exp:"La photosynthèse utilise le CO₂ et l’eau pour fabriquer des composés organiques grâce à l’énergie lumineuse."},
{id:"q322",ch:5,lvl:2,q:"Quel gaz est libéré pendant la photosynthèse oxygénique ?",opts:["Une lumière toujours plus intense est bénéfique sans limite", "Le dioxygène", "La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "Le CO₂ est le pigment qui absorbe la lumière"],a:1,exp:"Le dioxygène libéré provient de la décomposition de l’eau lors des réactions lumineuses."},
{id:"q323",ch:5,lvl:2,q:"Quel est le rôle de la lumière dans la photosynthèse ?",opts:["La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "La mitochondrie est le principal site de la photosynthèse", "Le CO₂ est le pigment qui absorbe la lumière", "Fournir l’énergie aux réactions photochimiques"],a:3,exp:"Les pigments absorbent l’énergie lumineuse qui permet de produire des molécules énergétiques."},
{id:"q324",ch:5,lvl:3,q:"Où se déroulent les réactions lumineuses de la photosynthèse ?",opts:["La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "Dans les membranes des thylakoïdes des chloroplastes", "Une lumière toujours plus intense est bénéfique sans limite", "L’ATP sert uniquement à colorer les feuilles"],a:1,exp:"Les photosystèmes et la chaîne de transport d’électrons se trouvent dans les membranes thylakoïdiennes."},
{id:"q325",ch:5,lvl:1,q:"Quel gaz la plante prélève-t-elle dans l’air pour fabriquer des glucides ?",opts:["La respiration se déroule seulement à la lumière", "La mitochondrie est le principal site de la photosynthèse", "L’eau n’intervient pas dans la photosynthèse", "Le dioxyde de carbone"],a:3,exp:"Le carbone des molécules organiques produites par photosynthèse provient du CO₂."},
{id:"q326",ch:5,lvl:2,q:"Quel est le rôle des stomates dans la photosynthèse ?",opts:["L’eau n’intervient pas dans la photosynthèse", "Permettre notamment l’entrée du CO₂", "Les plantes ne respirent jamais", "Le CO₂ est le pigment qui absorbe la lumière"],a:1,exp:"Les stomates régulent l’entrée du CO₂ et les pertes d’eau par transpiration."},
{id:"q327",ch:5,lvl:1,q:"Quel processus libère l’énergie utilisable à partir des molécules organiques ?",opts:["L’ATP sert uniquement à colorer les feuilles", "L’eau n’intervient pas dans la photosynthèse", "La respiration cellulaire", "La mitochondrie est le principal site de la photosynthèse"],a:2,exp:"La respiration dégrade des molécules organiques et permet de produire de l’ATP."},
{id:"q328",ch:5,lvl:2,q:"La respiration cellulaire a-t-elle lieu uniquement la nuit chez les plantes ?",opts:["Les plantes ne respirent jamais", "L’ATP sert uniquement à colorer les feuilles", "Non, elle a lieu de jour comme de nuit", "La respiration se déroule seulement à la lumière"],a:2,exp:"La respiration se poursuit tant que les cellules sont vivantes et actives ; elle ne dépend pas directement de la lumière."},
{id:"q329",ch:5,lvl:1,q:"Quel est le rôle de l’ATP dans la cellule ?",opts:["La mitochondrie est le principal site de la photosynthèse", "Fournir une énergie utilisable pour les activités cellulaires", "Les plantes ne respirent jamais", "La respiration se déroule seulement à la lumière"],a:1,exp:"L’ATP alimente notamment la synthèse, le transport actif et la croissance."},
{id:"q330",ch:5,lvl:3,q:"Quel facteur peut limiter la photosynthèse si tous les autres sont suffisants ?",opts:["La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "La disponibilité du CO₂", "Les plantes ne respirent jamais", "L’ATP sert uniquement à colorer les feuilles"],a:1,exp:"Le CO₂ est un substrat de la photosynthèse et sa disponibilité peut limiter le processus."},
{id:"q331",ch:5,lvl:3,q:"Pourquoi une plante peut-elle moins photosynthétiser lors d’une sécheresse ?",opts:["L’eau n’intervient pas dans la photosynthèse", "La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "Les stomates peuvent se fermer et réduire l’entrée du CO₂", "La mitochondrie est le principal site de la photosynthèse"],a:2,exp:"La fermeture stomatique limite les pertes d’eau mais réduit aussi l’approvisionnement en CO₂."},
{id:"q332",ch:5,lvl:2,q:"Quel est l’effet possible d’une lumière trop faible sur une culture ?",opts:["Le CO₂ est le pigment qui absorbe la lumière", "La respiration se déroule seulement à la lumière", "La mitochondrie est le principal site de la photosynthèse", "Une réduction de la photosynthèse et de la croissance"],a:3,exp:"Une intensité lumineuse insuffisante peut limiter la production de matière organique."},
{id:"q333",ch:5,lvl:2,q:"Quel produit organique simple est fabriqué au cours de la photosynthèse puis utilisé dans d’autres voies métaboliques ?",opts:["La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "L’eau n’intervient pas dans la photosynthèse", "Un sucre comme le glucose", "La respiration se déroule seulement à la lumière"],a:2,exp:"Les produits carbonés de la photosynthèse servent à la respiration, à la croissance et au stockage."},
{id:"q334",ch:5,lvl:1,q:"Quel processus convertit l’énergie lumineuse en énergie chimique chez les plantes ?",opts:["La photosynthèse", "Le CO₂ est le pigment qui absorbe la lumière", "La respiration se déroule seulement à la lumière", "Une lumière toujours plus intense est bénéfique sans limite"],a:0,exp:"La photosynthèse convertit l’énergie lumineuse en énergie chimique stockée dans des molécules organiques."},
{id:"q335",ch:5,lvl:2,q:"Quel organite est le siège principal de la respiration cellulaire aérobie chez les cellules eucaryotes ?",opts:["La mitochondrie", "Les plantes ne respirent jamais", "La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement", "Une lumière toujours plus intense est bénéfique sans limite"],a:0,exp:"La mitochondrie accueille le cycle de Krebs et la chaîne respiratoire chez les eucaryotes."},
{id:"q336",ch:5,lvl:2,q:"Quel gaz est consommé lors de la respiration aérobie ?",opts:["Le dioxygène", "Une lumière toujours plus intense est bénéfique sans limite", "L’eau n’intervient pas dans la photosynthèse", "Le CO₂ est le pigment qui absorbe la lumière"],a:0,exp:"La respiration aérobie utilise l’oxygène comme accepteur final d’électrons."},
{id:"q337",ch:5,lvl:3,q:"Pourquoi les graines en germination respirent-elles activement ?",opts:["Les plantes ne respirent jamais", "L’eau n’intervient pas dans la photosynthèse", "Pour obtenir l’ATP nécessaire à la croissance de l’embryon", "La photosynthèse consomme du dioxygène pour produire du CO₂ uniquement"],a:2,exp:"La germination nécessite de l’énergie pour la division cellulaire et le développement de la plantule."},
{id:"q338",ch:5,lvl:3,q:"Pourquoi l’engorgement prolongé du sol peut-il endommager les racines ?",opts:["Les plantes ne respirent jamais", "La mitochondrie est le principal site de la photosynthèse", "Une lumière toujours plus intense est bénéfique sans limite", "Il réduit l’oxygène disponible pour la respiration racinaire"],a:3,exp:"Un sol saturé en eau contient moins d’air, ce qui peut limiter la respiration des racines."},
{id:"q339",ch:5,lvl:3,q:"Comment la photosynthèse et la respiration sont-elles liées ?",opts:["La mitochondrie est le principal site de la photosynthèse", "Le CO₂ est le pigment qui absorbe la lumière", "La matière organique et le dioxygène produits par la photosynthèse peuvent être utilisés par la respiration", "Une lumière toujours plus intense est bénéfique sans limite"],a:2,exp:"Les deux processus sont complémentaires dans les échanges de matière et d’énergie, mais ne sont pas de simples inverses exacts."},
{id:"q340",ch:5,lvl:2,q:"Pourquoi une culture bien éclairée peut-elle quand même souffrir si elle manque d’eau ?",opts:["L’eau est nécessaire à la photosynthèse et au maintien du fonctionnement cellulaire", "Une lumière toujours plus intense est bénéfique sans limite", "La respiration se déroule seulement à la lumière", "La mitochondrie est le principal site de la photosynthèse"],a:0,exp:"La lumière seule ne suffit pas : l’eau et le CO₂ sont aussi indispensables et la sécheresse perturbe plusieurs fonctions."},
{id:"q341",ch:6,lvl:2,q:"Qu’est-ce que la texture d’un sol ?",opts:["Les décomposeurs arrêtent le cycle des nutriments", "Le mutualisme nuit obligatoirement aux deux partenaires", "La proportion relative de sable, de limon et d’argile", "La biodiversité signifie qu’il n’existe qu’une seule espèce"],a:2,exp:"La texture est déterminée par les proportions des différentes tailles de particules minérales."},
{id:"q342",ch:6,lvl:2,q:"Quel sol retient généralement davantage l’eau : un sol sableux ou un sol riche en argile ?",opts:["L’agroforesterie consiste à supprimer tous les arbres", "Les décomposeurs arrêtent le cycle des nutriments", "La biodiversité signifie qu’il n’existe qu’une seule espèce", "Un sol riche en argile"],a:3,exp:"Les particules fines et les petits pores des sols argileux favorisent généralement une plus grande rétention d’eau."},
{id:"q343",ch:6,lvl:2,q:"Quel est un rôle de la matière organique dans le sol ?",opts:["La biodiversité signifie qu’il n’existe qu’une seule espèce", "Les facteurs abiotiques sont uniquement des animaux", "Améliorer la structure et contribuer au stockage des nutriments", "Le paillage accélère toujours l’évaporation"],a:2,exp:"La matière organique favorise l’agrégation du sol, l’activité biologique et la rétention de nutriments."},
{id:"q344",ch:6,lvl:1,q:"Quel processus transforme les résidus organiques en substances plus simples ?",opts:["L’agroforesterie consiste à supprimer tous les arbres", "La biodiversité signifie qu’il n’existe qu’une seule espèce", "La décomposition", "Les décomposeurs arrêtent le cycle des nutriments"],a:2,exp:"Les décomposeurs fragmentent et transforment les résidus, libérant progressivement des éléments nutritifs."},
{id:"q345",ch:6,lvl:3,q:"Quel organisme du sol peut fixer l’azote atmosphérique en association avec les légumineuses ?",opts:["L’érosion améliore toujours la couche arable", "Les décomposeurs arrêtent le cycle des nutriments", "Certaines bactéries du genre Rhizobium", "La lutte intégrée exige de traiter sans observer"],a:2,exp:"Ces bactéries vivent dans les nodosités des racines et convertissent l’azote atmosphérique en formes assimilables."},
{id:"q346",ch:6,lvl:2,q:"Quel type de relation bénéficie aux deux organismes partenaires ?",opts:["L’agroforesterie consiste à supprimer tous les arbres", "Le mutualisme", "La lutte intégrée exige de traiter sans observer", "Le paillage accélère toujours l’évaporation"],a:1,exp:"Dans une relation mutualiste, les deux partenaires tirent un bénéfice de l’interaction."},
{id:"q347",ch:6,lvl:1,q:"Quel exemple illustre la prédation dans une parcelle ?",opts:["Une coccinelle qui consomme des pucerons", "La lutte intégrée exige de traiter sans observer", "Le paillage accélère toujours l’évaporation", "Les facteurs abiotiques sont uniquement des animaux"],a:0,exp:"La prédation implique qu’un organisme capture et consomme un autre organisme."},
{id:"q348",ch:6,lvl:2,q:"Quel est un effet du ruissellement intense sur un terrain en pente ?",opts:["L’entraînement de particules de sol et l’érosion", "L’agroforesterie consiste à supprimer tous les arbres", "Les facteurs abiotiques sont uniquement des animaux", "Les décomposeurs arrêtent le cycle des nutriments"],a:0,exp:"L’eau qui s’écoule en surface peut emporter la couche fertile du sol."},
{id:"q349",ch:6,lvl:2,q:"Comment les haies plantées en courbes de niveau contribuent-elles à protéger un terrain ?",opts:["La biodiversité signifie qu’il n’existe qu’une seule espèce", "L’érosion améliore toujours la couche arable", "Les facteurs abiotiques sont uniquement des animaux", "Elles ralentissent l’écoulement de l’eau et retiennent des particules"],a:3,exp:"Les barrières végétales réduisent la vitesse du ruissellement et limitent l’érosion."},
{id:"q350",ch:6,lvl:3,q:"Pourquoi alterner une céréale et une légumineuse dans une rotation ?",opts:["Les facteurs abiotiques sont uniquement des animaux", "Pour diversifier les cultures et éventuellement améliorer l’apport d’azote au système", "L’érosion améliore toujours la couche arable", "Le paillage accélère toujours l’évaporation"],a:1,exp:"Les légumineuses peuvent fixer l’azote en symbiose avec des bactéries compatibles."},
{id:"q351",ch:6,lvl:1,q:"Quel est le rôle des producteurs dans une chaîne alimentaire ?",opts:["Transformer l’énergie lumineuse en énergie chimique stockée dans la matière organique", "L’agroforesterie consiste à supprimer tous les arbres", "Le paillage accélère toujours l’évaporation", "L’érosion améliore toujours la couche arable"],a:0,exp:"Les plantes sont des producteurs primaires grâce à la photosynthèse."},
{id:"q352",ch:6,lvl:1,q:"Quel organisme est un décomposeur typique ?",opts:["Un champignon saprophyte", "Le paillage accélère toujours l’évaporation", "La lutte intégrée exige de traiter sans observer", "Les facteurs abiotiques sont uniquement des animaux"],a:0,exp:"Les champignons et de nombreuses bactéries décomposent la matière organique morte."},
{id:"q353",ch:6,lvl:2,q:"Pourquoi la biodiversité peut-elle aider une exploitation agricole ?",opts:["L’érosion améliore toujours la couche arable", "Le mutualisme nuit obligatoirement aux deux partenaires", "La biodiversité signifie qu’il n’existe qu’une seule espèce", "Elle peut favoriser la pollinisation, la régulation des ravageurs et les fonctions du sol"],a:3,exp:"La diversité biologique peut soutenir plusieurs services utiles à la production."},
{id:"q354",ch:6,lvl:1,q:"Quel est un avantage du paillage ?",opts:["L’agroforesterie consiste à supprimer tous les arbres", "L’érosion améliore toujours la couche arable", "Réduire l’évaporation et protéger la surface du sol", "Les facteurs abiotiques sont uniquement des animaux"],a:2,exp:"Le paillis conserve l’humidité et amortit l’impact des gouttes de pluie."},

/* =====================================================================
   2. STOCKAGE — localStorage sécurisé
   ===================================================================== */
var KEY_DATA="agroquiz:v1:data", KEY_SET="agroquiz:v1:settings";
var memoryFallback={};
function safeGet(key){ try{ return window.localStorage.getItem(key); }catch(e){ return memoryFallback[key]||null; } }
function safeSet(key,val){ try{ window.localStorage.setItem(key,val); return true; }catch(e){ memoryFallback[key]=val; return false; } }
function safeRemove(key){ try{ window.localStorage.removeItem(key); }catch(e){} delete memoryFallback[key]; }
function parseJSON(raw,fallback){ if(!raw) return fallback; try{ var v=JSON.parse(raw); return (v&&typeof v==="object")?v:fallback; }catch(e){ return fallback; } }

var Store = {
  defaultsData:function(){ return {attempts:[],studied:{},recent:[],last:null}; },
  loadData:function(){
    var d=parseJSON(safeGet(KEY_DATA),null), base=this.defaultsData();
    if(!d) return base;
    var out=base;
    if(Array.isArray(d.attempts)){
      out.attempts=d.attempts.filter(function(a){
        return a && typeof a.date==="string" && isFinite(a.total) && isFinite(a.correct) && a.total>0 && a.correct>=0 && a.correct<=a.total && Array.isArray(a.details);
      }).map(function(a){
        a.details=a.details.filter(function(x){return x&&typeof x.id==="string";});
        return a;
      });
    }
    if(d.studied&&typeof d.studied==="object"&&!Array.isArray(d.studied)) out.studied=d.studied;
    if(Array.isArray(d.recent)) out.recent=d.recent.filter(function(x){return getChapitre(x);}).slice(0,6);
    if(getChapitre(d.last)) out.last=d.last;
    return out;
  },
  saveData:function(d){ return safeSet(KEY_DATA,JSON.stringify(d)); },
  loadSettings:function(){
    var s=parseJSON(safeGet(KEY_SET),{});
    return { theme:(s.theme==="dark"?"dark":"light"), timer:(s.timer===true) };
  },
  saveSettings:function(s){ safeSet(KEY_SET,JSON.stringify(s)); },
  clearData:function(){ safeRemove(KEY_DATA); }
};

var data = Store.loadData();
var settings = Store.loadSettings();

function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function getChapitre(id){ id=Number(id); for(var i=0;i<CHAPITRES.length;i++){ if(CHAPITRES[i].id===id) return CHAPITRES[i]; } return null; }
function getQuestion(id){ for(var i=0;i<QUESTIONS.length;i++){ if(QUESTIONS[i].id===id) return QUESTIONS[i]; } return null; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pct(a,b){ return b>0?Math.round(a*100/b):0; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), r=s%60; return m+" min "+(r<10?"0":"")+r+" s"; }
function fmtDate(iso){ var d=new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function pluriel(n,s,p){ return n+" "+(n>1?(p||s+"s"):s); }
function applyTheme(){ document.documentElement.setAttribute("data-theme",settings.theme); }

function confirmDialog(title,msg,okLabel){
  return new Promise(function(resolve){
    var bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mm"><h3 id="mt">'+esc(title)+'</h3><p id="mm">'+esc(msg)+'</p><div class="btn-row"><button class="btn sec" data-r="0">Annuler</button><button class="btn danger" data-r="1">'+esc(okLabel||"Confirmer")+'</button></div></div>';
    var prev=document.activeElement;
    function close(v){ document.removeEventListener("keydown",onKey); bg.remove(); if(prev&&prev.focus) prev.focus(); resolve(v); }
    function onKey(e){ if(e.key==="Escape") close(false); }
    bg.addEventListener("click",function(e){ var r=e.target.getAttribute&&e.target.getAttribute("data-r"); if(r!==null) close(r==="1"); else if(e.target===bg) close(false); });
    document.addEventListener("keydown",onKey);
    document.body.appendChild(bg);
    bg.querySelector('[data-r="0"]').focus();
  });
}

/* =====================================================================
   4. CALCULS À PARTIR DES DONNÉES RÉELLES
   ===================================================================== */
function globalStats(){
  var answered=0,correct=0;
  data.attempts.forEach(function(a){ answered+=a.total; correct+=a.correct; });
  return {quizzes:data.attempts.length, answered:answered, correct:correct, rate:pct(correct,answered)};
}
function chapterStats(id){
  var answered=0,correct=0,last=null,best=null;
  data.attempts.forEach(function(a){
    var n=0,c=0;
    a.details.forEach(function(d){ var q=getQuestion(d.id); if(q&&q.ch===id){ n++; if(d.ok) c++; } });
    if(n>0){ answered+=n; correct+=c; if(!last||a.date>last) last=a.date; var r=c/n; if(best===null||r>best) best=r; }
  });
  return {answered:answered,correct:correct,rate:pct(correct,answered),last:last,best:best};
}
function chapterStatus(id){
  var st=chapterStats(id), studied=!!data.studied[id];
  if(st.answered>0 && st.best>=0.8 && studied) return {label:"Terminé",cls:"ok"};
  if(st.answered>0) return {label:"Quiz fait · "+st.rate+" %",cls:"mid"};
  if(studied) return {label:"Lu",cls:"mid"};
  return {label:"Non commencé",cls:""};
}
function touchChapter(id){
  data.recent=[id].concat(data.recent.filter(function(x){return x!==id;})).slice(0,6);
  data.last=id; Store.saveData(data);
}
function hasProgress(){ return data.attempts.length>0||data.recent.length>0; }

/* =====================================================================
   5. MOTEUR DE QUIZ
   ===================================================================== */
var setup={ch:"all",lvl:"all",n:"10"};
var quiz=null, timerHandle=null;

function buildPool(ch,lvl){
  return QUESTIONS.filter(function(q){ return (ch==="all"||q.ch===Number(ch)) && (lvl==="all"||q.lvl===Number(lvl)); });
}
function startQuiz(ch,lvl,n){
  var pool=shuffle(buildPool(ch,lvl));
  if(n!=="all") pool=pool.slice(0,Number(n));
  if(!pool.length) return false;
  var items=pool.map(function(q){
    var order=shuffle([0,1,2,3]);
    return { id:q.id, order:order, correctPos:order.indexOf(q.a), choice:null, validated:false, ok:false };
  });
  quiz={ ch:ch, lvl:lvl, items:items, i:0, score:0, start:Date.now(), seconds:0, finished:false, saved:false, selected:null };
  return true;
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function startTimer(){
  stopTimer();
  if(!settings.timer||!quiz||quiz.finished) return;
  timerHandle=setInterval(function(){
    var el=$("#qtimer"); if(!el||!quiz||quiz.finished){ stopTimer(); return; }
    el.textContent=fmtTime((Date.now()-quiz.start)/1000);
  },1000);
}
function validateAnswer(){
  if(!quiz||quiz.finished) return;
  var it=quiz.items[quiz.i];
  if(it.validated||quiz.selected===null) return;
  it.choice=quiz.selected; it.validated=true;
  it.ok=(it.choice===it.correctPos);
  if(it.ok) quiz.score++;
}
function nextQuestion(){
  if(quiz.i<quiz.items.length-1){ quiz.i++; quiz.selected=null; renderQuiz(); }
  else finishQuiz();
}
function finishQuiz(){
  quiz.finished=true; quiz.seconds=Math.round((Date.now()-quiz.start)/1000);
  stopTimer();
  if(!quiz.saved){
    var correct=quiz.items.filter(function(x){return x.ok;}).length;
    data.attempts.push({
      date:new Date().toISOString(), chapter:quiz.ch, level:quiz.lvl,
      total:quiz.items.length, correct:correct, seconds:quiz.seconds, timed:settings.timer,
      details:quiz.items.map(function(x){ return {id:x.id,ok:x.ok}; })
    });
    if(data.attempts.length>300) data.attempts=data.attempts.slice(-300);
    if(quiz.ch!=="all"){ touchChapter(Number(quiz.ch)); }
    Store.saveData(data); quiz.saved=true;
  }
  renderQuiz();
}

function renderQuiz(){
  if(!quiz){ renderSetup(); return; }
  if(quiz.finished){ renderQuizEnd(); return; }
  var it=quiz.items[quiz.i], q=getQuestion(it.id), total=quiz.items.length, done=quiz.i+(it.validated?1:0);
  var h='<div class="page"><div class="qwrap" style="'+chStyle(q.ch)+'"><div class="qhead"><span>Question <b>'+(quiz.i+1)+'</b> sur '+total+'</span><span>Bonnes réponses : <b id="qscore">'+quiz.score+'</b>'+(settings.timer?' &nbsp; Temps : <b id="qtimer">'+fmtTime((Date.now()-quiz.start)/1000)+'</b>':'')+'</span></div>'+
  '<ol class="segs" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+done+'" aria-label="Progression du quiz">'+
  quiz.items.map(function(x,idx){ var c=x.validated?(x.ok?"ok":"ko"):(idx===quiz.i?"cur":""); return '<li class="'+c+'"></li>'; }).join("")+'</ol>'+
  '<p class="qchap"><i></i>Chapitre '+q.ch+', '+esc(getChapitre(q.ch).titre)+' ('+esc(NIVEAUX[q.lvl].toLowerCase())+')</p><h2 class="qtext">'+esc(q.q)+'</h2><div class="opts" role="group" aria-label="Propositions de réponse">';
  it.order.forEach(function(orig,pos){
    var cls="opt", k="ABCD"[pos];
    if(it.validated){ if(pos===it.correctPos){ cls+=" good"; k=icon("check",18); } else if(pos===it.choice){ cls+=" bad"; k=icon("cross",18); } }
    else if(quiz.selected===pos) cls+=" sel";
    h+='<button type="button" class="'+cls+'" data-pos="'+pos+'"'+(it.validated?' disabled':'')+' aria-pressed="'+(quiz.selected===pos)+'"><span class="k">'+k+'</span><span>'+esc(q.opts[orig])+'</span></button>';
  });
  h+='</div><div id="fb" aria-live="polite">';
  if(it.validated){
    h+='<div class="explain '+(it.ok?'good':'bad')+'"><strong class="v">'+(it.ok?'Bonne réponse':'Mauvaise réponse')+'</strong>'+(it.ok?'':'La bonne réponse : '+esc(q.opts[q.a])+'.<br>')+esc(q.exp)+'</div>';
  }
  h+='</div><div class="btn-row">';
  if(!it.validated) h+='<button class="btn" id="valid"'+(quiz.selected===null?' disabled':'')+'>Valider ma réponse</button>';
  else h+='<button class="btn" id="next">'+(quiz.i<total-1?'Question suivante':'Voir mon score')+'</button>';
  h+='<button class="btn sec" id="abandon">Abandonner</button></div></div></div>';
  setMain(h);
  $("#main").querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ if(it.validated) return; quiz.selected=Number(b.getAttribute("data-pos")); renderQuiz(); var nb=$('.opt[data-pos="'+quiz.selected+'"]'); if(nb) nb.focus(); }; });
  var v=$("#valid"); if(v) v.onclick=function(){ validateAnswer(); renderQuiz(); var n=$("#next"); if(n) n.focus(); };
  var nx=$("#next"); if(nx) nx.onclick=nextQuestion;
  $("#abandon").onclick=function(){ confirmDialog("Abandonner le quiz ?","Les réponses de cette série ne seront pas enregistrées dans tes résultats.","Abandonner").then(function(ok){ if(ok){ stopTimer(); quiz=null; renderSetup(); } }); };
  startTimer();
}

}
function resetProgress(){
  confirmDialog("Effacer la progression ?","Tous tes quiz, scores et chapitres étudiés seront supprimés de cet appareil. Cette action est définitive.","Effacer").then(function(ok){
    if(!ok) return; Store.clearData(); data=Store.defaultsData(); stopTimer(); quiz=null; route();
  });
}

function viewParametres(){
  var h=phead('Réglages','Thème, chronomètre et gestion de tes données.')+'<div class="page">'+
  '<div class="setrow"><div><strong>Thème</strong><p>Clair pour le jour, sombre pour les révisions du soir.</p></div><div class="seg" role="group" aria-label="Thème"><button type="button" data-theme="light" aria-pressed="'+(settings.theme==="light")+'">Clair</button><button type="button" data-theme="dark" aria-pressed="'+(settings.theme==="dark")+'">Sombre</button></div></div>'+
  '<div class="setrow"><div><strong>Chronomètre</strong><p>Mesure la durée de chaque quiz et l\'affiche avec ton score.</p></div><div class="seg" role="group" aria-label="Chronomètre"><button type="button" data-timer="on" aria-pressed="'+settings.timer+'">Activé</button><button type="button" data-timer="off" aria-pressed="'+(!settings.timer)+'">Désactivé</button></div></div>'+
  '<div class="setrow"><div><strong>Réinitialiser la progression</strong><p>Supprime les scores, l\'historique et les chapitres étudiés.</p></div><button class="btn danger" id="rst">Réinitialiser</button></div>'+
  '<p class="note" style="margin-top:26px">'+icon("info",18)+'<span>Tes données sont enregistrées sur cet appareil, dans ce navigateur. Elles ne sont envoyées nulle part. Si tu vides les données du navigateur, elles disparaissent.</span></p>'+
  '<h2 class="titre-liste">À propos</h2><p>AgroQuiz est un outil de révision en biologie générale et en agronomie pour les étudiants débutants. C\'est un support complémentaire : il ne remplace ni les cours officiels de l\'AUC ni les enseignants. Il contient '+CHAPITRES.length+' chapitres et '+QUESTIONS.length+' questions, et fonctionne hors ligne une fois le fichier enregistré.</p></div>';
  setMain(h);
  $("#main").querySelectorAll("[data-theme]").forEach(function(b){ b.onclick=function(){ settings.theme=b.getAttribute("data-theme"); Store.saveSettings(settings); applyTheme(); viewParametres(); }; });
  $("#main").querySelectorAll("[data-timer]").forEach(function(b){ b.onclick=function(){ settings.timer=b.getAttribute("data-timer")==="on"; Store.saveSettings(settings); if(quiz&&!quiz.finished){ settings.timer?startTimer():stopTimer(); } viewParametres(); }; });
  $("#rst").onclick=resetProgress;
}

/* =====================================================================
   7. ROUTAGE
   ===================================================================== */
function route(){
  var hash=(location.hash||"#accueil").slice(1), parts=hash.split("/"), page=parts[0];
  if(page!=="quiz") stopTimer();
  var active=page==="chapitre"?"chapitres":page;
  if(!ROUTES.some(function(r){return r[0]===active;})){ active="accueil"; page="accueil"; }
  renderNav(active);
  if(page==="accueil") viewAccueil();
  else if(page==="chapitres") viewChapitres();
  else if(page==="chapitre") viewChapitre(parts[1]);
  else if(page==="quiz") viewQuiz();
  else if(page==="resultats") viewResultats();
  else if(page==="parametres") viewParametres();
  var m=$("#main"); if(m) m.focus({preventScroll:true});
}
window.addEventListener("hashchange",route);
applyTheme();
route();
</script>
